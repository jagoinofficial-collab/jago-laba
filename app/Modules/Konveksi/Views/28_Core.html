                        packaging: Math.round((totalBiayaJasaPackagingPerUnit.value / total) * 100),
                        operasional: Math.round((totalBiayaOperasionalPerUnit.value / total) * 100),
                        manual: Math.round((totalBiayaManualPerUnit.value / total) * 100)
                    };
                });

                // Rekomendasi Grosir (Margin atau Markup)
                const hargaGrosirRekomendasi = computed(() => {
                    const cost = hppStandarPerUnit.value;
                    const val = Number(hppTargetMarginGrosirPct.value || 0);
                    if (val <= 0) return cost;
                    if (hppMarginMode.value === 'markup') {
                        return Math.round(cost * (1 + val / 100));
                    } else {
                        if (val >= 100) return cost;
                        return Math.round(cost / (1 - val / 100));
                    }
                });
                const labaGrosirPerUnit = computed(() => Math.max(0, hargaGrosirRekomendasi.value - hppStandarPerUnit.value));
                const totalLabaGrosirBatch = computed(() => labaGrosirPerUnit.value * Math.max(1, Number(hppBatchQty.value || 1)));

                // Rekomendasi Retail / Eceran (Margin atau Markup)
                const hargaRetailRekomendasi = computed(() => {
                    const cost = hppStandarPerUnit.value;
                    const val = Number(hppTargetMarginPct.value || 0);
                    if (val <= 0) return cost;
                    if (hppMarginMode.value === 'markup') {
                        return Math.round(cost * (1 + val / 100));
                    } else {
                        if (val >= 100) return cost;
                        return Math.round(cost / (1 - val / 100));
                    }
                });
                const labaRetailPerUnit = computed(() => Math.max(0, hargaRetailRekomendasi.value - hppStandarPerUnit.value));
                const totalLabaRetailBatch = computed(() => labaRetailPerUnit.value * Math.max(1, Number(hppBatchQty.value || 1)));

                // SPK List untuk Model Terpilih (mencakup semua varian warna model)
                const spkListForActiveHpp = computed(() => {
                    if (!activeHppModel.value) return [];
                    const vIds = new Set(activeHppModel.value.varian_ids.map(String));
                    const list = [];
                    jahit.value.forEach(j => {
                        const hasP = (j.items || []).some(it => vIds.has(String(it.id_produk)));
                        if (hasP) {
                            list.push({
                                type: 'jahit',
                                id: j.id,
                                no_spk: 'SPK-JHT-' + String(j.id).slice(-4),
                                tanggal: j.tanggal,
                                status: j.status || 'Proses',
                                items: j.items || [],
                                upah: j.upah || 0
                            });
                        }
                    });
                    potong.value.forEach(p => {
                        const hasP = (p.items || []).some(it => vIds.has(String(it.id_produk)));
                        if (hasP) {
                            list.push({
                                type: 'potong',
                                id: p.id,
                                no_spk: 'SPK-PTG-' + String(p.id).slice(-4),
                                tanggal: p.tanggal,
                                status: p.status || 'Proses',
                                items: p.items || [],
                                upah: p.upah || 0
                            });
                        }
                    });
                    return list;
                });

                const initHppAktualForModel = (model) => {
                    if (!model) return;
                    const vIds = new Set(model.varian_ids.map(String));
                    const jahitSelesai = jahit.value.find(j => j.status === 'Selesai' && (j.items || []).some(it => vIds.has(String(it.id_produk))));
                    const potongSelesai = potong.value.find(p => p.status === 'Selesai' && (p.items || []).some(it => vIds.has(String(it.id_produk))));

                    let totalPcs = Number(hppBatchQty.value || 100);
                    let upahJ = 0;
                    let upahP = 0;

                    if (jahitSelesai) {
                        const it = (jahitSelesai.items || []).find(x => vIds.has(String(x.id_produk)));
                        if (it && it.qty) totalPcs = Number(it.qty);
                        upahJ = getUpahTotalSPK(jahitSelesai, 'jahit');
                    }
                    if (potongSelesai) {
                        upahP = getUpahTotalSPK(potongSelesai, 'potong');
                    }

                    hppAktual.spkId = jahitSelesai ? jahitSelesai.id : (potongSelesai ? potongSelesai.id : '');
                    hppAktual.pcsBagus = totalPcs;
                    hppAktual.upahPotongRiil = upahP || (Number(hppUpah.potong || 0) * totalPcs);
                    hppAktual.upahJahitRiil = upahJ || (Number(hppUpah.jahit || 0) * totalPcs);
                    hppAktual.bahanRiil = Math.round(totalBiayaBahanPerUnit.value * totalPcs);
                    hppAktual.biayaLainRiil = Math.round((totalBiayaJasaPackagingPerUnit.value + totalBiayaManualPerUnit.value) * totalPcs);
                };

                const initHppAktualForProduct = (idProduk) => {
                    const p = produk.value.find(x => String(x.id) === String(idProduk));
                    const modelKey = p ? (p.model_tas || p.nama || '').trim() : '';
                    const m = uniqueHppModelList.value.find(x => x.model_key === modelKey);
                    if (m) initHppAktualForModel(m);
                };

                const applySpkToAktual = (spkId) => {
                    if (!spkId || !activeHppModel.value) return;
                    const vIds = new Set(activeHppModel.value.varian_ids.map(String));
                    const jh = jahit.value.find(j => String(j.id) === String(spkId));
                    const pt = potong.value.find(p => String(p.id) === String(spkId));

                    if (jh) {
                        const it = (jh.items || []).find(x => vIds.has(String(x.id_produk)));
                        const qty = it ? Number(it.qty || 0) : Number(hppBatchQty.value || 100);
                        hppAktual.pcsBagus = qty;
                        hppAktual.upahJahitRiil = getUpahTotalSPK(jh, 'jahit');
                        if (it && it.id_potong) {
                            const relPt = potong.value.find(p => String(p.id) === String(it.id_potong));
                            if (relPt) hppAktual.upahPotongRiil = getUpahTotalSPK(relPt, 'potong');
                        }
                        hppAktual.bahanRiil = Math.round(totalBiayaBahanPerUnit.value * qty);
                        hppAktual.biayaLainRiil = Math.round((totalBiayaJasaPackagingPerUnit.value + totalBiayaManualPerUnit.value) * qty);
                        showNotification('Data aktual diselaraskan dari SPK Jahit ' + jh.id);
                    } else if (pt) {
                        const it = (pt.items || []).find(x => vIds.has(String(x.id_produk)));
                        const qty = it ? Number(it.qty_hasil_potong || it.qty || 0) : Number(hppBatchQty.value || 100);
                        hppAktual.pcsBagus = qty;
                        hppAktual.upahPotongRiil = getUpahTotalSPK(pt, 'potong');
                        hppAktual.bahanRiil = Math.round(totalBiayaBahanPerUnit.value * qty);
                        showNotification('Data aktual diselaraskan dari SPK Potong ' + pt.id);
                    }
                };

                // Total Biaya Riil Aktual
                const totalBiayaAktual = computed(() => {
                    return Number(hppAktual.bahanRiil || 0) +
                           Number(hppAktual.upahPotongRiil || 0) +
                           Number(hppAktual.upahJahitRiil || 0) +
                           Number(hppAktual.biayaLainRiil || 0);
                });

                // HPP Aktual per Unit (per Tas)
                const hppAktualPerUnit = computed(() => {
                    const pcs = Number(hppAktual.pcsBagus || 0);
                    if (pcs <= 0) return 0;
                    return Math.round(totalBiayaAktual.value / pcs);
                });

                // Variansi Standar vs Aktual
                const hppVariansiRp = computed(() => {
                    if (hppAktualPerUnit.value <= 0) return 0;
                    return hppAktualPerUnit.value - hppStandarPerUnit.value;
                });

                const hppVariansiPct = computed(() => {
                    if (hppStandarPerUnit.value <= 0 || hppAktualPerUnit.value <= 0) return '0.0';
                    const diff = hppAktualPerUnit.value - hppStandarPerUnit.value;
                    return ((diff / hppStandarPerUnit.value) * 100).toFixed(1);
                });

                const hppVariansiStatus = computed(() => {
                    if (hppAktualPerUnit.value <= 0) return 'neutral';
                    if (hppVariansiRp.value <= 0) return 'efisien';
                    return 'over';
                });

                // VERSIONED HPP ACTIVATION & WORKSPACE HELPERS
                const nextHppVersionPreview = computed(() => {
                    if (!selectedHppModelKey.value) return 'V01';
                    const mKey = selectedHppModelKey.value;
                    const hist = (hppHistory.value || []).filter(h => h.model_key === mKey);
                    let maxVer = 0;
                    hist.forEach(h => {
                        const vStr = String(h.version || h.formula_version || '').toUpperCase();
                        const match = vStr.match(/V(\d+)/);
                        if (match) {
                            const num = parseInt(match[1], 10);
                            if (num > maxVer) maxVer = num;
                        }
                    });
                    const nextNum = maxVer + 1;
                    return 'V' + (nextNum < 10 ? '0' + nextNum : nextNum);
                });

                const ambilUpahDariMasterProduk = () => {
                    const m = activeHppModel.value;
                    if (!m) {
                        showPopup({ type: 'warning', title: 'Pilih Model', message: 'Silakan pilih model tas terlebih dahulu.' });
                        return;
                    }
                    hppUpah.potong = Number(m.upah_potong || 0);
                    hppUpah.jahit = Number(m.upah_jahit || 0);
                    hppUpah.finishing = Number(m.upah_finishing || 0);
                    hppUpah.packing = Number(m.upah_packing || 0);
                    showNotification('Standar biaya upah (CMT) berhasil disinkronkan dari Master Produk.');
                };

                const simpanDraftHppLokal = () => {
                    if (!selectedHppModelKey.value || !activeHppModel.value) {
                        showPopup({ type: 'warning', title: 'Pilih Model Terlebih Dahulu', message: 'Pilih model tas yang ingin disimpan draft kalkulasinya.' });
                        return;
                    }
                    const draftPayload = {
                        model_key: selectedHppModelKey.value,
                        batch_qty: Number(hppBatchQty.value || 100),
                        bom_items: hppBOMItems.value,
                        upah: { ...hppUpah },
                        packaging: { ...hppJasaPackaging },
                        operasional: { mode: hppOperasional.mode, persen: Number(hppOperasional.persen || 0), nominal: Number(hppOperasional.nominal || 0) },
                        biaya_manual: hppManualCosts.value,
                        target_margin_retail_pct: Number(hppTargetMarginPct.value || 30),
                        target_margin_grosir_pct: Number(hppTargetMarginGrosirPct.value || 20),
                        margin_mode: hppMarginMode.value,
                        saved_at: new Date().toISOString()
                    };
                    try {
                        localStorage.setItem('JL_HPP_DRAFT_' + selectedHppModelKey.value, JSON.stringify(draftPayload));
                        showPopup({
                            type: 'success',
                            title: 'Draft HPP Tersimpan',
                            message: `Draft resep dan formula biaya untuk model "${activeHppModel.value?.nama}" berhasil disimpan ke browser. Anda dapat melanjutkan kalkulasi kapan saja tanpa mengubah HPP aktif.`
                        });
                    } catch (e) {
                        showPopup({ type: 'error', title: 'Gagal Menyimpan Draft', message: e.message || String(e) });
                    }
                };

                const bukaModalAktivasiHpp = () => {
                    if (!selectedHppModelKey.value || !activeHppModel.value) {
                        showPopup({
                            type: 'warning',
                            title: 'Pilih Model Terlebih Dahulu',
                            message: 'Silakan pilih model tas yang ingin dihitung dan diaktifkan nilainya.'
                        });
                        return;
                    }
                    if (hppStandarPerUnit.value <= 0) {
                        showPopup({
                            type: 'warning',
                            title: 'Kalkulasi HPP Masih Kosong',
                            message: 'Tambahkan rincian bahan baku atau upah sebelum mengaktifkan HPP.'
                        });
                        return;
                    }
                    tanggalEfektifAktivasiHpp.value = new Date().toISOString().slice(0, 10);
                    catatanAktivasiHpp.value = '';
                    isModalKonfirmasiAktivasiHppOpen.value = true;
                };

                const eksekusiAktivasiHpp = async () => {
                    if (!selectedHppModelKey.value || !activeHppModel.value) return;
                    isActivatingHpp.value = true;

                    const model = activeHppModel.value;
                    const nominalHpp = hppStandarPerUnit.value;
                    const nextVer = nextHppVersionPreview.value;

                    const payload = {
                        model_key: model.model_key,
                        model_nama: model.nama,
                        produk_induk_id: model.id || '',
                        sku_induk: model.kode || model.model_key,
                        batch_qty: Number(hppBatchQty.value || 100),
                        target_margin_retail_pct: Number(hppTargetMarginPct.value || 30),
                        target_margin_grosir_pct: Number(hppTargetMarginGrosirPct.value || 20),
                        margin_mode: hppMarginMode.value,
                        bom_items: hppBOMItems.value,
                        upah: { ...hppUpah },
                        packaging: { ...hppJasaPackaging },
                        operasional: { mode: hppOperasional.mode, persen: Number(hppOperasional.persen || 0), nominal: Number(hppOperasional.nominal || 0) },
                        biaya_manual: hppManualCosts.value,
                        operator: getOperatorName(),
                        effective_date: tanggalEfektifAktivasiHpp.value,
                        catatan: catatanAktivasiHpp.value
                    };

                    try {
                        let serverSuccess = false;
                        if (window.jlApi && window.jlApi.run) {
                            await new Promise((resolve, reject) => {
                                window.jlApi.run
                                    .withSuccessHandler(res => {
                                        if (res && res.status === 'success') {
                                            serverSuccess = true;
                                            resolve(res);
                                        } else {
                                            reject(new Error(res?.message || 'Gagal aktivasi di server.'));
                                        }
                                    })
                                    .withFailureHandler(err => reject(err))
                                    .activateHppProductionServerRpc(payload);
                            });
                        }

                        // Update local Vue state
                        const matchingProds = (produk.value || []).filter(p => (p.model_tas || p.nama || '').trim() === model.model_key);
                        matchingProds.forEach(p => {
                            p.hpp_produk = nominalHpp;
                            p.hpp_version = nextVer;
                            p.hpp_updated_at = new Date().toISOString();
                            p.upah_potong = Number(hppUpah.potong || 0);
                            p.upah_jahit = Number(hppUpah.jahit || 0);
                        });

                        const bomRecordsToSave = hppBOMItems.value.map((it, idx) => {
                            const calc = calculateHppBomItem(it);
                            return {
                                id_bom: it.id_bom || ('BOM-' + Date.now() + '-' + idx + '-' + Math.random().toString(36).substr(2, 4).toUpperCase()),
                                model_key: model.model_key,
                                model_nama: model.nama,
                                produk_induk_id: model.id || '',
                                sku_induk: model.kode || model.model_key,
                                id_bahan_hpp: it.id_bahan_hpp || '',
                                id_bahan_gudang: it.id_bahan_gudang || it.id_bahan || '',
                                kode_bahan: it.kode_bahan || '',
                                nama_bahan: it.nama_bahan || it.nama_item || '',
                                kategori: it.kategori || 'bahan_utama',
                                satuan_beli: it.satuan_beli || 'Meter',
                                isi_satuan_beli: normalizeHppNumber(it.isi_satuan_beli, 1),
                                satuan_pakai: it.satuan_pakai || it.satuan || 'Meter',
                                harga_satuan_beli: normalizeHppNumber(it.harga_satuan_beli, 0),
                                harga_satuan_pakai: normalizeHppNumber(it.harga_satuan_pakai || it.harga_satuan, 0),
                                qty_pakai_per_pcs: normalizeHppNumber(it.qty_pakai_per_pcs !== undefined ? it.qty_pakai_per_pcs : it.qty_per_unit, 0),
                                waste_pct: normalizeHppNumber(it.waste_pct, 0),
                                qty_efektif_per_pcs: calc.qty_efektif_per_pcs,
                                hpp_material_per_pcs: calc.hpp_material_per_pcs,
                                urutan: idx + 1,
                                status: 'Aktif',
                                catatan: it.catatan || '',
                                formula_version: nextVer,
                                created_at: it.created_at || new Date().toISOString(),
                                updated_at: new Date().toISOString(),
                                operator: getOperatorName()
                            };
                        });
                        hppModelBom.value = (hppModelBom.value || []).filter(b => b.model_key !== model.model_key).concat(bomRecordsToSave);

                        const histEntry = {
                            id: 'HIST-' + Date.now(),
                            tanggal: tanggalEfektifAktivasiHpp.value || new Date().toISOString(),
                            model_key: model.model_key,
                            version: nextVer,
                            hpp_lama: Number(model.hpp_produk || 0),
                            hpp_baru: nominalHpp,
                            material_total: totalBiayaBahanPerUnit.value,
                            upah_total: totalBiayaUpahPerUnit.value,
                            packaging_total: totalBiayaJasaPackagingPerUnit.value,
                            operasional_total: biayaOperasionalPerUnit.value,
                            manual_total: totalBiayaManualPerUnit.value,
                            formula_snapshot: JSON.stringify(payload),
                            catatan: catatanAktivasiHpp.value,
                            operator: getOperatorName(),
                            keterangan: `Aktivasi ${nextVer}: ${formatRupiah(nominalHpp)}/unit`
                        };
                        hppHistory.value = (hppHistory.value || []).concat([histEntry]);

                        if (!serverSuccess) {
                            await syncMultiTabs([
                                { tab: 'Produk', data: produk.value },
                                { tab: 'HPP_Model_BOM', data: hppModelBom.value },
                                { tab: 'HPP_History', data: hppHistory.value }
                            ]);
                        } else {
                            simpanCacheLokal();
                        }

                        isModalKonfirmasiAktivasiHppOpen.value = false;
                        addLog(`Aktivasi HPP Resmi ${nextVer} Model ${model.nama}: ${formatRupiah(nominalHpp)}`, 'bg-emerald-600');

                        showPopup({
                            type: 'success',
                            title: `HPP Resmi ${nextVer} Berhasil Diaktifkan!`,
                            message: `HPP Resmi ${nextVer} untuk model "${model.nama}" sebesar ${formatRupiah(nominalHpp)}/unit berhasil diterapkan ke seluruh varian di Master Produk dan dicatat dalam histori versi permanen.`
                        });
                    } catch (err) {
                        showPopup({ type: 'error', title: 'Gagal Aktivasi HPP', message: err.message || String(err) });
                    } finally {
                        isActivatingHpp.value = false;
                    }
                };

                const terapkanHppKeProduk = () => {
                    bukaModalAktivasiHpp();
                };

                // Terapkan HPP Aktual ke Master Produk (ke semua varian model)
                const terapkanHppAktualKeProduk = () => {
                    if (!selectedHppModelKey.value || !activeHppModel.value || hppAktualPerUnit.value <= 0) {
                        showNotification('Nilai HPP Aktual belum tersedia atau masih nol.', 'warning');
                        return;
                    }

                    const model = activeHppModel.value;
                    const matchingProds = produk.value.filter(p => (p.model_tas || p.nama || '').trim() === model.model_key);
                    const countVarian = matchingProds.length;
                    const nominalAktual = hppAktualPerUnit.value;

                    showPopup({
                        type: 'confirm',
                        title: 'Terapkan HPP Aktual Pasca-Produksi?',
                        message: `HPP Aktual riil sebesar ${formatRupiah(nominalAktual)}/unit akan menggantikan HPP master untuk seluruh ${countVarian} varian warna dari Model "${model.nama}". Lanjutkan?`,
                        confirmText: 'Ya, Terapkan HPP Aktual',
                        cancelText: 'Batal',
                        onConfirm: () => {
                            matchingProds.forEach(p => {
                                p.hpp_produk = nominalAktual;
                            });
                            syncKeDatabase('Produk', produk.value);
                            addLog(`HPP Aktual Model ${model.nama} diterapkan: ${formatRupiah(nominalAktual)}`, 'bg-indigo-600');
                            showPopup({
                                type: 'success',
                                title: 'HPP Aktual Diterapkan',
                                message: `Master HPP Model "${model.nama}" (${countVarian} varian) berhasil diperbarui menjadi ${formatRupiah(nominalAktual)}/unit berdasarkan data audit riil.`
                            });
                        }
                    });
                };

                // Cetak / Download Lembar Rincian HPP PDF
                const cetakHppPDF = () => {
                    if (!selectedHppModelKey.value || !activeHppModel.value) {
                        showNotification('Pilih model tas sebelum mencetak kalkulasi HPP.', 'warning');
                        return;
                    }
                    const m = activeHppModel.value;

                    try {
                        showNotification('Mempersiapkan Lembar Rincian HPP...');
                        if (!window.jspdf || typeof window.jspdf.jsPDF !== 'function') {
                            window.print();
                            return;
                        }
                        const { jsPDF } = window.jspdf;
                        const doc = new jsPDF({ format: 'a4', orientation: 'portrait', unit: 'mm' });
                        const GREEN = [5, 150, 105], LINE = [226, 232, 240], TEXT = [15, 23, 42];

                        const header = PdfHeader_render(doc, {
                            title: 'LEMBAR RINCIAN HARGA POKOK PRODUKSI (HPP)',
                            subtitle: 'ANALISIS BIAYA',
                            badgeText: 'HPP',
                            margin: 14
                        });
                        let curMetaY = header.contentStartY;

                        doc.setFont('helvetica', 'bold');
                        doc.setFontSize(11);
                        doc.setTextColor(TEXT[0], TEXT[1], TEXT[2]);
                        doc.text('Model Tas: ' + m.nama + ' (' + m.jumlah_varian + ' Varian Warna: ' + m.varian_names.join(', ') + ')', 14, curMetaY);

                        doc.setFont('helvetica', 'normal');
                        doc.setFontSize(8.5);
                        doc.setTextColor(100, 116, 139);
                        doc.text('Kategori: ' + (m.kategori || '-') + '   |   Target Batch: ' + hppBatchQty.value + ' ' + (m.satuan || 'Pcs') + '   |   Tanggal: ' + currentDateFormatted.value, 14, curMetaY + 5.5);

                        doc.setFillColor(248, 250, 252);
                        doc.roundedRect(14, curMetaY + 10, 182, 18, 3, 3, 'FD');
                        doc.setFont('helvetica', 'bold');
                        doc.setFontSize(8.5);
                        doc.setTextColor(100, 116, 139);
                        doc.text('HPP STANDAR PER UNIT / TAS', 20, curMetaY + 17);
                        doc.setFontSize(13);
                        doc.setTextColor(GREEN[0], GREEN[1], GREEN[2]);
                        doc.text(formatRupiah(hppStandarPerUnit.value), 20, curMetaY + 24);

                        doc.setFontSize(8.5);
                        doc.setTextColor(100, 116, 139);
                        doc.text('TOTAL BIAYA 1 BATCH (' + hppBatchQty.value + ' PCS)', 110, curMetaY + 17);
                        doc.setFontSize(12);
                        doc.setTextColor(TEXT[0], TEXT[1], TEXT[2]);
                        doc.text(formatRupiah(totalHppBatch.value), 110, curMetaY + 24);

                        if (window.jspdf.autoTable || typeof doc.autoTable === 'function') {
                            const bomRows = hppBOMItems.value.map((it, i) => [
                                i + 1,
                                (it.kategori === 'bahan_utama' ? '[BAHAN UTAMA] ' : '[TRIMS] ') + it.nama_item + (it.catatan ? ' (' + it.catatan + ')' : ''),
                                formatRupiah(it.harga_satuan),
                                it.qty_per_unit + ' ' + it.satuan + (it.waste_pct ? ' (+'+it.waste_pct+'%)' : ''),
                                formatRupiah(getSubtotalBOMItem(it))
                            ]);

                            doc.autoTable({
                                startY: curMetaY + 32,
                                margin: { left: 14, right: 14 },
                                head: [['NO', 'KOMPONEN BAHAN & TRIMS', 'HARGA SATUAN', 'KEBUTUHAN / PCS', 'SUBTOTAL / TAS']],
                                body: bomRows.length ? bomRows : [['-', 'Tidak ada bahan baku yang diinput', '-', '-', '-']],
                                theme: 'grid',
                                styles: { fontSize: 8, cellPadding: 2.2, lineColor: LINE, lineWidth: 0.2 },
                                headStyles: { fillColor: [30, 41, 59], textColor: 255, fontSize: 8 },
                                columnStyles: { 0: { cellWidth: 10, halign: 'center' }, 1: { cellWidth: 80 }, 2: { cellWidth: 30, halign: 'right' }, 3: { cellWidth: 32, halign: 'center' }, 4: { cellWidth: 30, halign: 'right' } }
                            });

                            let curY = doc.lastAutoTable.finalY + 6;

                            const otherRows = [
                                ['1', 'Upah Potong (Direct Labor Cutting)', formatRupiah(hppUpah.potong)],
                                ['2', 'Upah Jahit / Perakitan (Direct Labor Sewing)', formatRupiah(hppUpah.jahit)],
                                ['3', 'Upah Finishing & QC', formatRupiah(hppUpah.finishing)],
                                ['4', 'Upah Packing', formatRupiah(hppUpah.packing)],
                                ['5', 'Cetak Sablon / Bordir Luar', formatRupiah(hppJasaPackaging.sablon_bordir)],
                                ['6', 'Packaging & Kemasan (Hangtag, Plastik, Karton)', formatRupiah(hppJasaPackaging.hangtag_label + hppJasaPackaging.plastik_polybag + hppJasaPackaging.aksesoris_kemasan)]
                            ];

                            hppManualCosts.value.forEach((m, idx) => {
                                otherRows.push([
                                    String(7 + idx),
                                    '[BIAYA MANUAL] ' + (m.deskripsi || 'Biaya Tambahan') + (m.tipe_alokasi === 'per_batch' ? ' (Dari '+formatRupiah(m.nominal)+'/batch)' : ''),
                                    formatRupiah(getNominalManualPerUnit(m))
                                ]);
                            });

                            doc.autoTable({
                                startY: curY,
                                margin: { left: 14, right: 14 },
                                head: [['NO', 'KOMPONEN UPAH, PACKAGING & BIAYA MANUAL', 'BIAYA / TAS']],
                                body: otherRows,
                                theme: 'grid',
                                styles: { fontSize: 8, cellPadding: 2.2, lineColor: LINE, lineWidth: 0.2 },
                                headStyles: { fillColor: [51, 65, 85], textColor: 255, fontSize: 8 },
                                columnStyles: { 0: { cellWidth: 10, halign: 'center' }, 1: { cellWidth: 142 }, 2: { cellWidth: 30, halign: 'right' } }
                            });

                            curY = doc.lastAutoTable.finalY + 6;

                            doc.setFillColor(241, 245, 249);
                            doc.roundedRect(14, curY, 182, 22, 2, 2, 'FD');
                            doc.setFont('helvetica', 'bold');
                            doc.setFontSize(8.5);
                            doc.setTextColor(TEXT[0], TEXT[1], TEXT[2]);
                            doc.text('REKOMENDASI HARGA JUAL & MARGIN LABA', 20, curY + 6);
                            doc.setFont('helvetica', 'normal');
                            doc.setFontSize(8);
                            doc.text('Grosir (Margin ' + hppTargetMarginGrosirPct.value + '%): ' + formatRupiah(hargaGrosirRekomendasi.value) + ' (Estimasi Laba/Pcs: ' + formatRupiah(labaGrosirPerUnit.value) + ')', 20, curY + 13);
                            doc.text('Eceran / Retail (Margin ' + hppTargetMarginPct.value + '%): ' + formatRupiah(hargaRetailRekomendasi.value) + ' (Estimasi Laba/Pcs: ' + formatRupiah(labaRetailPerUnit.value) + ')', 20, curY + 19);
                        }

                        eksekusiUnduhPDF(doc, 'HPP_' + m.nama.replace(/[^a-zA-Z0-9]/g, '_') + '.pdf');
                    } catch(err) {
                        console.error('Cetak PDF HPP error:', err);
                        window.print();
                    }
                };

                // =============================================================
                // DAFTAR HPP PRODUK KONVEKSI REGISTRY (EXECUTIVE COSTING TABLE)
                // =============================================================
                const searchHppRegistry = ref('');
                const statusFilterHppRegistry = ref('semua');

                const getHppRegistryItem = (p) => {
                    let material = 0;
                    let potong = Number(p.upah_potong || 0);
                    let jahit = Number(p.upah_jahit || 0);
                    let operasional = 0;
                    let hppEstimasi = Number(p.hpp_produk || 0);
                    let hasBom = false;

                    if (p.hpp_formula) {
                        try {
                            const f = typeof p.hpp_formula === 'string' ? JSON.parse(p.hpp_formula) : p.hpp_formula;
                            if (f && typeof f === 'object') {
                                const boms = Array.isArray(f.bom) ? f.bom : [];
                                if (boms.length > 0) {
                                    hasBom = true;
                                    material = boms.reduce((s, it) => {
                                        const price = Number(it.harga_satuan || 0);
                                        const qty = Number(it.qty_per_unit || 0);
                                        const waste = Number(it.waste_pct || 0);
                                        return s + (price * qty * (1 + waste / 100));
                                    }, 0);
                                }
                                if (f.upah) {
                                    if (f.upah.potong !== undefined) potong = Number(f.upah.potong);
                                    if (f.upah.jahit !== undefined) jahit = Number(f.upah.jahit);
                                    operasional += Number(f.upah.finishing || 0) + Number(f.upah.packing || 0);
                                }
                                if (f.packaging) {
                                    operasional += Number(f.packaging.sablon_bordir || 0) +
                                                   Number(f.packaging.hangtag_label || 0) +
                                                   Number(f.packaging.plastik_polybag || 0) +
                                                   Number(f.packaging.aksesoris_kemasan || 0);
                                }
                                const bQty = Math.max(1, Number(f.batchQty || 100));
                                const manualCosts = Array.isArray(f.manualCosts) ? f.manualCosts : [];
                                manualCosts.forEach(m => {
                                    const nom = Number(m.nominal || 0);
                                    operasional += (m.tipe_alokasi === 'per_batch' ? (nom / bQty) : nom);
                                });

                                if (f.hppStandar) {
                                    hppEstimasi = Number(f.hppStandar);
                                } else {
                                    hppEstimasi = Math.round(material + potong + jahit + operasional);
                                }
                            }
                        } catch(e) {
                            console.warn('Err parsing formula for registry:', e);
                        }
                    }

                    if (hppEstimasi <= 0) {
                        hppEstimasi = Math.round(material + potong + jahit + operasional);
                    }

                    const hppAktif = Number(p.hpp_produk || hppEstimasi || 0);
                    const hppAktual = Number(p.hpp_aktual || 0);

                    // Harga Jual (mengambil p.harga_jual jika ada, atau estimasi harga jual standar)
                    let hargaJual = Number(p.harga_jual || p.harga || 0);
                    if (hargaJual <= 0) {
                        hargaJual = hppAktif > 0 ? Math.round(hppAktif / 0.65) : 0;
                    }

                    const marginRp = Math.max(0, hargaJual - hppAktif);
                    const marginPct = hargaJual > 0 ? ((marginRp / hargaJual) * 100).toFixed(2) : '0.00';

                    return {
                        id: p.id,
                        foto: p.foto || '',
                        kode: p.kode || '-',
                        nama: p.nama || '-',
                        model_tas: p.model_tas || p.nama || '-',
                        warna: p.warna || 'Default',
                        material: Math.round(material),
                        potong: Math.round(potong),
                        jahit: Math.round(jahit),
                        operasional: Math.round(operasional),
                        hpp_estimasi: Math.round(hppEstimasi),
                        hpp_aktual: hppAktual > 0 ? Math.round(hppAktual) : null,
                        hpp_aktif: Math.round(hppAktif),
                        harga_jual: Math.round(hargaJual),
                        margin_rp: Math.round(marginRp),
                        margin_pct: marginPct,
                        has_bom: hasBom
                    };
                };

                const hppRegistryList = computed(() => {
                    return (produk.value || []).map(p => getHppRegistryItem(p));
                });

                const filteredHppRegistry = computed(() => {
                    const q = (searchHppRegistry.value || '').toLowerCase().trim();
                    const st = statusFilterHppRegistry.value;
                    return hppRegistryList.value.filter(item => {
                        const matchSearch = !q ||
                            item.kode.toLowerCase().includes(q) ||
                            item.nama.toLowerCase().includes(q) ||
                            item.model_tas.toLowerCase().includes(q) ||
                            item.warna.toLowerCase().includes(q);
                        if (!matchSearch) return false;

                        if (st === 'ada_bom') return item.has_bom;
                        if (st === 'belum_bom') return !item.has_bom;
                        if (st === 'ada_aktual') return item.hpp_aktual != null && item.hpp_aktual > 0;
                        if (st === 'margin_rendah') return Number(item.margin_pct) < 20;
                        return true;
                    });
                });

                const totalProdukRegistry = computed(() => hppRegistryList.value.length);
                const rataRataHppRegistry = computed(() => {
                    const list = hppRegistryList.value.filter(x => x.hpp_aktif > 0);
                    if (!list.length) return 0;
                    return Math.round(list.reduce((s, x) => s + x.hpp_aktif, 0) / list.length);
                });
                const rataRataMaterialRegistry = computed(() => {

                // SUB-MODUL: PENJUALAN HASIL PRODUKSI JAHIT ENGINE

                // Helper: Ambil stok tersedia untuk SKU
                const getStokSku = (sku) => {
                    if (!sku) return 0;
                    const cleanSku = String(sku).trim().toUpperCase();
                    const s = (masterStok.value || []).find(m => String(m.kode_sku || '').trim().toUpperCase() === cleanSku);
                    if (s && s.stok_akhir !== undefined && s.stok_akhir !== null) return Number(s.stok_akhir || 0);
                    const p = (produk.value || []).find(item => String(item.sku || '').trim().toUpperCase() === cleanSku);
                    if (p && p.stok !== undefined && p.stok !== null) return Number(p.stok || 0);
                    return 0;
                };

                // Helper: Ambil HPP untuk SKU
                const getHppSku = (sku) => {
                    if (!sku) return 0;
                    const cleanSku = String(sku).trim().toUpperCase();
                    const s = (masterStok.value || []).find(m => String(m.kode_sku || '').trim().toUpperCase() === cleanSku);
                    if (s && Number(s.hpp_rata_rata || 0) > 0) return Number(s.hpp_rata_rata || 0);
                    const p = (produk.value || []).find(item => String(item.sku || '').trim().toUpperCase() === cleanSku);
                    if (p && Number(p.hpp_total || 0) > 0) return Number(p.hpp_total || 0);
                    return 0;
                };

                // Helper: Ambil Harga Jual untuk SKU
                const getHargaJualSku = (sku) => {
                    if (!sku) return 0;
                    const cleanSku = String(sku).trim().toUpperCase();
                    const p = (produk.value || []).find(item => {
                        if (String(item.sku || '').trim().toUpperCase() === cleanSku) return true;
                        if (Array.isArray(item.variasi)) {
                            return item.variasi.some(v => String(v.sku || '').trim().toUpperCase() === cleanSku);
                        }
                        return false;
                    });
                    if (p) return Number(p.harga_jual || p.harga || 0);
                    return 0;
                };

                // Computed: Daftar Produk & SKU Aktif Siap Jual
                const produkListForPenjualan = computed(() => {
                    const list = [];
                    const seenSkus = new Set();
                    
                    (masterStok.value || []).forEach(s => {
                        if (s.kode_sku && s.status_stok !== 'Arsip') {
                            const cleanSku = String(s.kode_sku).trim().toUpperCase();
                            seenSkus.add(cleanSku);
                            const curStok = Number(s.stok_akhir || 0);
                            const hppVal = Number(s.hpp_rata_rata || 0);
                            const hjVal = getHargaJualSku(s.kode_sku);
                            list.push({
                                sku: s.kode_sku,
                                id_produk: s.id_produk || '',
                                nama: s.nama_produk || s.kode_sku,
                                varian: s.varian_warna || 'Standar',
                                stok: curStok,
                                hpp: hppVal,
                                harga_jual: hjVal > 0 ? hjVal : (hppVal > 0 ? Math.round(hppVal * 1.3) : 0)
                            });
                        }
                    });

                    (produk.value || []).forEach(p => {
                        const variasiList = Array.isArray(p.variasi) && p.variasi.length ? p.variasi : [{ nama: 'Standar', sku: p.sku || ('SKU-' + p.id) }];
                        variasiList.forEach((v, idx) => {
                            const skuCode = v.sku || (p.sku ? p.sku + '-' + (idx + 1) : 'SKU-' + p.id);
                            const cleanSku = String(skuCode).trim().toUpperCase();
                            if (!seenSkus.has(cleanSku)) {
                                seenSkus.add(cleanSku);
                                const curStok = Number(p.stok || 0);
                                const hppVal = Number(p.hpp_total || p.biaya_material || 0);
                                const hjVal = Number(p.harga_jual || p.harga || 0);
                                list.push({
                                    sku: skuCode,
                                    id_produk: p.id,
                                    nama: p.nama,
                                    varian: v.nama || v.warna || 'Standar',
                                    stok: curStok,
                                    hpp: hppVal,
                                    harga_jual: hjVal > 0 ? hjVal : (hppVal > 0 ? Math.round(hppVal * 1.3) : 0)
                                });
                            }
                        });
                    });

                    return list;
                });

                // Computed: Filter Transaksi Penjualan
                const filteredPenjualanProduksi = computed(() => {
                    let list = (penjualanProduksi.value || []).slice();

                    // Search Query
                    if (searchPenjualan.value && searchPenjualan.value.trim()) {
                        const q = searchPenjualan.value.toLowerCase().trim();
                        list = list.filter(p => 
                            String(p.no_penjualan || '').toLowerCase().includes(q) ||
                            String(p.nama_pelanggan || '').toLowerCase().includes(q) ||
                            String(p.no_wa || '').toLowerCase().includes(q) ||
                            String(p.catatan || '').toLowerCase().includes(q) ||
                            String(p.channel_penjualan || '').toLowerCase().includes(q)
                        );
                    }

                    // Filter Status Dokumen
                    if (filterStatusPenjualan.value !== 'semua') {
                        list = list.filter(p => String(p.status_transaksi || '').toUpperCase() === filterStatusPenjualan.value.toUpperCase());
                    }

                    // Filter Saluran Penjualan
                    if (filterSaluranPenjualan.value !== 'semua') {
                        list = list.filter(p => String(p.channel_penjualan || '').toLowerCase().includes(filterSaluranPenjualan.value.toLowerCase()));
                    }

                    // Filter Status Pembayaran
                    if (filterStatusBayarPenjualan.value !== 'semua') {
                        list = list.filter(p => String(p.status_pembayaran || '').toUpperCase() === filterStatusBayarPenjualan.value.toUpperCase());
                    }

                    // Filter Periode
                    const todayStr = new Date().toISOString().substring(0, 10);
                    const curMonthStr = todayStr.substring(0, 7);

                    if (filterPeriodePenjualan.value === 'hari_ini') {
                        list = list.filter(p => String(p.tanggal || '').substring(0, 10) === todayStr);
                    } else if (filterPeriodePenjualan.value === 'minggu_ini') {
                        const d = new Date();
                        d.setDate(d.getDate() - 7);
                        const sevenDaysAgo = d.toISOString().substring(0, 10);
                        list = list.filter(p => String(p.tanggal || '').substring(0, 10) >= sevenDaysAgo);
                    } else if (filterPeriodePenjualan.value === 'bulan_ini') {
                        list = list.filter(p => String(p.tanggal || '').substring(0, 7) === curMonthStr);
                    } else if (filterPeriodePenjualan.value === 'custom') {
                        if (filterTglMulaiPenjualan.value) {
                            list = list.filter(p => String(p.tanggal || '') >= filterTglMulaiPenjualan.value);
                        }
                        if (filterTglSelesaiPenjualan.value) {
                            list = list.filter(p => String(p.tanggal || '') <= filterTglSelesaiPenjualan.value);
                        }
                    }

                    // Sort newest first (ultra-fast string comparison)
                    return list.sort((a, b) => {
                        const ta = String(a.created_at || a.tanggal || '');
                        const tb = String(b.created_at || b.tanggal || '');
                        return tb > ta ? 1 : (tb < ta ? -1 : 0);
                    });
                });

                // Computed: 6 KPI Cards Penjualan
                const kpiPenjualan = computed(() => {
                    const all = penjualanProduksi.value || [];
                    const todayStr = new Date().toISOString().substring(0, 10);
                    const curMonthStr = todayStr.substring(0, 7);

                    let countHariIni = 0;
                    let pcsBulanIni = 0;
                    let omzetBulanIni = 0;
                    let hppBulanIni = 0;
                    let labaBulanIni = 0;

                    all.forEach(p => {
                        const isPostedOrRevised = (p.status_transaksi === 'POSTED' || p.status_transaksi === 'REVISED');
                        const tgl = String(p.tanggal || '').substring(0, 10);
                        const bln = tgl.substring(0, 7);

                        if (tgl === todayStr && isPostedOrRevised) {
                            countHariIni++;
                        }

                        if (bln === curMonthStr && isPostedOrRevised) {
                            pcsBulanIni += Number(p.total_qty || 0);
                            omzetBulanIni += Number(p.total_tagihan || 0);
                            hppBulanIni += Number(p.total_hpp || 0);
                            labaBulanIni += Number(p.laba_kotor || 0);
                        }
                    });

                    const marginPersen = omzetBulanIni > 0 ? Math.round((labaBulanIni / omzetBulanIni) * 10000) / 100 : 0;

                    return {
                        transaksiHariIni: countHariIni,
                        pcsTerjualBulanIni: pcsBulanIni,
                        omzetBulanIni: omzetBulanIni,
                        totalHppBulanIni: hppBulanIni,
                        labaKotorBulanIni: labaBulanIni,
                        marginPersenBulanIni: marginPersen
                    };
                });

                // Computed: Kalkulasi Live Form Modal Penjualan Baru
                const kalkulasiFormPenjualan = computed(() => {
                    const f = modalPenjualanState.form;
                    let subtotal = 0;
                    let diskonItemTotal = 0;
                    let totalHpp = 0;
                    let totalQty = 0;

                    (f.items || []).forEach(it => {
                        const q = Number(it.qty || 0);
                        const hj = Number(it.harga_jual || 0);
                        const disc = Number(it.diskon_item || 0);
                        const sub = Math.max(0, (q * hj) - disc);
                        const hpp = Number(it.hpp_satuan || 0);

                        subtotal += (q * hj);
                        diskonItemTotal += disc;
                        totalHpp += (q * hpp);
                        totalQty += q;
                    });

                    const netSubtotal = Math.max(0, subtotal - diskonItemTotal);
                    const diskonTransaksi = Number(f.diskon_transaksi || 0);
                    const ongkir = Number(f.ongkir || 0);
                    const biayaLain = Number(f.biaya_lain || 0);

                    const totalTagihan = Math.max(0, netSubtotal - diskonTransaksi + ongkir + biayaLain);
                    const nominalDibayar = Number(f.nominal_dibayar || 0);
                    const sisaTagihan = Math.max(0, totalTagihan - nominalDibayar);
                    const kembalian = Math.max(0, nominalDibayar - totalTagihan);

                    const labaKotor = Math.max(0, (netSubtotal - diskonTransaksi) - totalHpp);
                    const marginPersen = totalTagihan > 0 ? Math.round((labaKotor / Math.max(1, netSubtotal - diskonTransaksi)) * 10000) / 100 : 0;

                    return {
                        subtotal,
                        diskonItemTotal,
                        netSubtotal,
                        diskonTransaksi,
                        ongkir,
                        biayaLain,
                        totalTagihan,
                        nominalDibayar,
                        sisaTagihan,
                        kembalian,
                        totalHpp,
                        labaKotor,
                        marginPersen,
                        totalQty
                    };
                });

                // Computed: Kalkulasi Live Form Modal Koreksi Penjualan
                const kalkulasiFormKoreksi = computed(() => {
                    const f = modalKoreksiPenjualanState.form;
                    const old = modalKoreksiPenjualanState.originalSale || {};

                    let subtotal = 0;
                    let diskonItemTotal = 0;
                    let totalHpp = 0;
                    let totalQty = 0;

                    (f.items || []).forEach(it => {
                        const q = Number(it.qty || 0);
                        const hj = Number(it.harga_jual || 0);
                        const disc = Number(it.diskon_item || 0);
                        const sub = Math.max(0, (q * hj) - disc);
                        const hpp = Number(it.hpp_satuan || 0);

                        subtotal += (q * hj);
                        diskonItemTotal += disc;
                        totalHpp += (q * hpp);
                        totalQty += q;
                    });

                    const netSubtotal = Math.max(0, subtotal - diskonItemTotal);
                    const diskonTransaksi = Number(f.diskon_transaksi || 0);
                    const ongkir = Number(f.ongkir || 0);
                    const biayaLain = Number(f.biaya_lain || 0);

                    const totalTagihan = Math.max(0, netSubtotal - diskonTransaksi + ongkir + biayaLain);
                    const nominalDibayar = Number(f.nominal_dibayar || 0);
                    const sisaTagihan = Math.max(0, totalTagihan - nominalDibayar);
                    const kembalian = Math.max(0, nominalDibayar - totalTagihan);

                    const labaKotor = Math.max(0, (netSubtotal - diskonTransaksi) - totalHpp);
                    const marginPersen = totalTagihan > 0 ? Math.round((labaKotor / Math.max(1, netSubtotal - diskonTransaksi)) * 10000) / 100 : 0;

                    const oldQty = Number(old.total_qty || 0);
                    const oldTotal = Number(old.total_tagihan || 0);
                    const oldDibayar = Number(old.nominal_dibayar || 0);
                    const oldLaba = Number(old.laba_kotor || 0);

                    const deltaQty = totalQty - oldQty;
                    const deltaTotal = totalTagihan - oldTotal;
                    const deltaKas = nominalDibayar - oldDibayar;
                    const deltaLaba = labaKotor - oldLaba;

                    return {
                        subtotal,
                        diskonItemTotal,
                        netSubtotal,
                        diskonTransaksi,
                        ongkir,
                        biayaLain,
                        totalTagihan,
                        nominalDibayar,
                        sisaTagihan,
                        kembalian,
                        totalHpp,
                        labaKotor,
                        marginPersen,
                        totalQty,
                        deltaQty,
                        deltaTotal,
                        deltaKas,
                        deltaLaba
                    };
                });

                // Method: Buka Modal Input Penjualan Baru / Edit Draft
                const bukaModalPenjualan = (draftData = null) => {

                    } else {

                // Method: Tambah baris item di Modal Penjualan
                const tambahItemPenjualanForm = () => {

                // Method: Hapus baris item di Modal Penjualan

                // Method: Ketika produk/SKU dipilih pada modal
                const onPilihProdukPenjualanForm = (itemRow, sku) => {

                // Quick Cash Setters

                    } else if (typeof typeOrAmount === 'number') {

                            formRef.nominal_dibayar += typeOrAmount;
                        } else {

                // Method: Simpan Draft Penjualan
                const simpanDraftPenjualanHandler = async () => {
                    if (!modalPenjualanState.form.nama_pelanggan || !modalPenjualanState.form.nama_pelanggan.trim()) {
                        modalPenjualanState.error = 'Nama pelanggan wajib diisi.';

                    const calc = kalkulasiFormPenjualan.value;
                    const payload = {
                        ...modalPenjualanState.form,

                        diskon_item_total: calc.diskonItemTotal,

                                    if (res && res.status === 'success') {

                                        fetchDatabaseFromServer();

                                    }
                                } catch(e) {
                                    showNotification('Draft berhasil disimpan.', 'success');
                                    modalPenjualanState.isOpen = false;
                                    fetchDatabaseFromServer();
                                }
                            })
                            .withFailureHandler((err) => {
                                modalPenjualanState.isSubmitting = false;
                                modalPenjualanState.error = err?.message || 'Terjadi kesalahan jaringan.';
                            })
                            .saveDraftPenjualanProduksiServer(payload, getOperatorName());
                    } else {
                        modalPenjualanState.isSubmitting = false;
                        modalPenjualanState.isOpen = false;
                        showNotification('Draft disimpan (mode lokal).', 'info');
                    }
                };

                // Method: Buka Konfirmasi Posting Penjualan (dengan Anti-Negative Stock Check)
                const bukaKonfirmasiPostingPenjualan = () => {
                    modalPenjualanState.error = '';
                    const f = modalPenjualanState.form;

                    if (!f.nama_pelanggan || !f.nama_pelanggan.trim()) {
                        modalPenjualanState.error = 'Nama pelanggan wajib diisi sebelum posting.';
                        return;
                    }
                    if (!f.items.length) {
                        modalPenjualanState.error = 'Minimal pilih 1 produk untuk transaksi.';
                        return;
                    }

                    // Anti-Negative Stock Validation
                    for (let i = 0; i < f.items.length; i++) {
                        const it = f.items[i];
                        const requestedQty = Number(it.qty || 0);
                        if (requestedQty <= 0) {
                            modalPenjualanState.error = `Jumlah qty untuk ${it.nama_produk || it.kode_sku} harus lebih dari 0.`;
                            return;
                        }
                        const available = getStokSku(it.kode_sku);
                        if (requestedQty > available) {
                            modalPenjualanState.error = `Stok untuk "${it.nama_produk || it.kode_sku}" tidak mencukupi! Diminta: ${requestedQty} Pcs, Stok Tersedia: ${available} Pcs.`;
                            return;
                        }
                    }

                    const calc = kalkulasiFormPenjualan.value;
                    const payload = {
                        ...modalPenjualanState.form,
                        operator: getOperatorName(),
                        subtotal: calc.subtotal,
                        diskon_item_total: calc.diskonItemTotal,
                        total_tagihan: calc.totalTagihan,
                        nominal_dibayar: calc.nominalDibayar,
                        sisa_tagihan: calc.sisaTagihan,
                        kembalian: calc.kembalian,
                        total_hpp: calc.totalHpp,
                        laba_kotor: calc.labaKotor,
                        margin_persen: calc.marginPersen,
                        total_qty: calc.totalQty
                    };

                    confirmPostPenjualanState.payload = payload;
                    confirmPostPenjualanState.isCorrection = false;
                    confirmPostPenjualanState.isOpen = true;
                };

                // Method: Eksekusi Atomic Posting Penjualan
                const eksekusiPostingPenjualan = async () => {
                    const payload = confirmPostPenjualanState.payload;
                    if (!payload) return;

                    confirmPostPenjualanState.isSubmitting = true;

                    if (window.jlApi && window.jlApi.run) {
                        window.jlApi.run
                            .withSuccessHandler(async (rawRes) => {
                                confirmPostPenjualanState.isSubmitting = false;
                                confirmPostPenjualanState.isOpen = false;
                                modalPenjualanState.isOpen = false;

                                try {
                                    const res = typeof rawRes === 'string' ? JSON.parse(rawRes) : rawRes;
                                    if (res && res.status === 'success') {
                                        showNotification(`Penjualan ${res.data?.no_penjualan || ''} berhasil diposting! Stok dan Kas telah diperbarui.`, 'success');

                                        const completeSaleData = {
                                            ...payload,
                                            ...(res.data || {}),
                                            no_penjualan: res.data?.no_penjualan || payload.no_penjualan,
                                            id_penjualan: res.data?.id_penjualan || payload.id_penjualan,
                                            status_transaksi: 'POSTED'
                                        };

                                        modalSuksesPenjualanState.data = completeSaleData;
                                        modalSuksesPenjualanState.items = completeSaleData.items || [];
                                        modalSuksesPenjualanState.isOpen = true;

                                        try {
                                            const doc = buildInvoicePenjualanCustomerPDF(completeSaleData, completeSaleData.items || []);
                                            if (doc) {
                                                savePdfAndGetDocumentLink(

                                    } else {

                                    }
                                } catch(e) {

                                    fetchDatabaseFromServer();
                                }
                            })
                            .withFailureHandler((err) => {

                                showNotification(err?.message || 'Gagal posting penjualan.', 'error');
                            })
                            .postPenjualanProduksiServer(payload, getOperatorName());

                        modalPenjualanState.isOpen = false;

                // Method: Buka Modal Koreksi Transaksi Penjualan (POSTED -> REVISED)
                const bukaModalKoreksiPenjualan = (saleRow) => {

                        alamat_pelanggan: saleRow.alamat_pelanggan || '',
                        tipe_pelanggan: saleRow.tipe_pelanggan || 'Umum',

                        id_rekening: saleRow.id_rekening || '',

                        items: itms.map(it => ({

                    };

                const tambahItemKoreksiPenjualanForm = () => {

                const onPilihProdukKoreksiForm = (itemRow, sku) => {

                    modalVoidPenjualanState.isSubmitting = true;
                    modalVoidPenjualanState.error = '';

                    const payload = {
                        id_penjualan: modalVoidPenjualanState.data.id_penjualan,
                        void_reason: modalVoidPenjualanState.void_reason,
                        catatan: modalVoidPenjualanState.catatan || '',
                        operator: getOperatorName()
                    };

                    if (window.jlApi && window.jlApi.run) {
                        window.jlApi.run
                            .withSuccessHandler((rawRes) => {
                                modalVoidPenjualanState.isSubmitting = false;
                                modalVoidPenjualanState.isOpen = false;
                                try {
                                    const res = typeof rawRes === 'string' ? JSON.parse(rawRes) : rawRes;
                                    showNotification(`Transaksi ${modalVoidPenjualanState.data.no_penjualan} berhasil dibatalkan (VOID). Stok dan kas telah dikembalikan.`, 'info');
                                } catch(e) {
                                    showNotification('Transaksi berhasil di-VOID.', 'info');
                                }
                                fetchDatabaseFromServer();
                            })
                            .withFailureHandler((err) => {
                                modalVoidPenjualanState.isSubmitting = false;
                                modalVoidPenjualanState.error = err?.message || 'Gagal membatalkan transaksi.';

                            .voidPenjualanProduksiServer(payload, getOperatorName());
                    } else {
                        modalVoidPenjualanState.isSubmitting = false;
                        modalVoidPenjualanState.isOpen = false;

                };

                // Method: Buka Detail Drawer Penjualan
                const bukaDetailDrawerPenjualan = (saleRow) => {
                    if (!saleRow) return;
                    detailPenjualanDrawer.data = saleRow;
                    detailPenjualanDrawer.activeTab = 'rincian';
                    detailPenjualanDrawer.items = (penjualanItems.value || []).filter(it => String(it.id_penjualan) === String(saleRow.id_penjualan));

                // Helper: Retry Backup storage server

                // Helper PDF Builder: Invoice Customer A5 Landscape (STRICTLY NO HPP / COSTS / MARGINS)

<script>
/* ============================================================
   JAGO LABA SMART UX UTILITIES
   Does not replace Vue methods or alter database workflow.
   ============================================================ */
(function(){
  const menuTerms = [
    ['dashboard','Ikhtisar Utama','fa-chart-pie'],
    ['produk','Katalog Produk','fa-box-open'],
    ['hpp_produksi','Kalkulator HPP Produksi','fa-calculator'],
    ['bahan_hpp','Bahan Baku HPP','fa-tags'],
    ['bahan','Data Material','fa-layer-group'],
    ['pegawai','Tim Karyawan','fa-users'],
    ['pembelian','Faktur Pembelian','fa-cart-shopping'],
    ['distribusi','Serah Terima Material','fa-boxes-packing'],
    ['potong','SPK Potong','fa-scissors'],
    ['jahit','SPK Jahit','fa-shirt'],
    ['penjualan_produksi','Penjualan Produksi','fa-cash-register'],
    ['kasbon','Pencairan Kasbon','fa-hand-holding-dollar'],
    ['piutang','Piutang Pegawai','fa-hand-holding-hand'],
    ['rekening','Akun Rekening','fa-building-columns'],
    ['keuangan','Laporan Keuangan','fa-chart-line'],
    ['profil','Konfigurasi Sistem','fa-gear']
  ];

  function findMenu(tab){
    const links = Array.from(document.querySelectorAll('aside a'));
    return links.find(a => {
      const h = a.getAttribute('href') || '';
      const click = a.getAttribute('@click') || '';
      return click.includes("'" + tab + "'") || click.includes('"' + tab + '"') ||
             h === '#' && a.textContent.toLowerCase().includes(menuTerms.find(x=>x[0]===tab)?.[1].toLowerCase() || '');
    });
  }

  function clickTab(tab){
    const a = findMenu(tab);
    if(a){ a.click(); return true; }
    return false;
  }

  function buildPalette(){
    if(document.getElementById('jlPalette')) return;
    const back = document.createElement('div');
    back.id='jlPalette';
    back.className='jl-palette-backdrop';
    back.innerHTML =
      '<div class="jl-palette" role="dialog" aria-modal="true" aria-label="Pusat Perintah">' +
        '<div class="jl-palette-head">' +
          '<i class="fa-solid fa-bolt"></i>' +
          '<input id="jlPaletteInput" class="jl-palette-input" autocomplete="off" placeholder="Cari menu atau tindakan...">' +
          '<span class="jl-kbd">ESC</span>' +
        '</div>' +
        '<div id="jlPaletteList" class="jl-palette-list"></div>' +
        '<div class="jl-palette-foot">JAGO LABA SMART COMMAND • Gunakan ↑ ↓ untuk memilih • Enter untuk membuka</div>' +
      '</div>';
    document.body.appendChild(back);

    const input=back.querySelector('#jlPaletteInput');
    const list=back.querySelector('#jlPaletteList');

    function render(filter=''){
      const q=filter.trim().toLowerCase();
      list.innerHTML='';
      const items=menuTerms.filter(x=>!q || x[1].toLowerCase().includes(q) || x[0].includes(q));
      items.forEach((x,i)=>{
        const b=document.createElement('button');
        b.className='jl-palette-item'+(i===0?' active':'');
        b.dataset.tab=x[0];
        b.innerHTML='<i class="fa-solid '+x[2]+'"></i><span>'+x[1]+'</span><span class="jl-kbd">Open</span>';
        b.onclick=()=>{ if(clickTab(x[0])) closePalette(); };
        list.appendChild(b);
      });
      if(!items.length){
        list.innerHTML='<div style="padding:25px;text-align:center;color:#94a3b8;font-size:12px;font-weight:800">Menu tidak ditemukan</div>';
      }
    }
    function openPalette(){
      back.classList.add('open'); input.value=''; render(); setTimeout(()=>input.focus(),30);
    }
    function closePalette(){back.classList.remove('open')}
    window.jlOpenPalette=openPalette;
    window.jlClosePalette=closePalette;

    input.addEventListener('input',()=>render(input.value));
    back.addEventListener('click',e=>{if(e.target===back)closePalette()});

    document.addEventListener('keydown',e=>{
      if(e.key==='Escape'){closePalette();return}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
        e.preventDefault();openPalette();return
      }
      if(!back.classList.contains('open')) return;
      const buttons=Array.from(list.querySelectorAll('.jl-palette-item'));
      if(!buttons.length) return;
      let current=buttons.findIndex(b=>b.classList.contains('active'));
      if(e.key==='ArrowDown'){
        e.preventDefault(); current=(current+1)%buttons.length;
      }else if(e.key==='ArrowUp'){
        e.preventDefault(); current=(current-1+buttons.length)%buttons.length;
      }else if(e.key==='Enter'){
        e.preventDefault(); buttons[current]?.click(); return;
      }else{return}
      buttons.forEach(b=>b.classList.remove('active'));
      buttons[current].classList.add('active');
      buttons[current].scrollIntoView({block:'nearest'});
    });
  }

  function buildUtilities(){
    if(document.getElementById('jlFloat')) return;
    const wrap=document.createElement('div');
    wrap.id='jlFloat';wrap.className='jl-float';
    wrap.innerHTML=
      '<button type="button" class="jl-top" id="jlTopBtn" title="Kembali ke atas" aria-label="Kembali ke atas" onclick="window.scrollTo({top:0,behavior:\'smooth\'})"><i class="fa-solid fa-arrow-up"></i></button>';
    document.body.appendChild(wrap);
  }

  window.jlFocusSearch=function(){
    const el=document.querySelector('header input[type="text"]') ||
             document.querySelector('input[placeholder*="Cari"]');
    if(el){el.focus();el.select?.();}
  };

  function buildSystemRail(){
    if(document.getElementById('jlSystemRail')) return;
    const rail=document.createElement('div');
    rail.id='jlSystemRail';
    rail.className='jl-system-rail';
    rail.innerHTML='<span class="dot"></span><span class="label">Sistem siap • koneksi browser aktif</span>';
    document.body.appendChild(rail);
    rail.style.position='fixed';rail.style.right='18px';rail.style.top='86px';rail.style.zIndex='70';
    rail.style.display=window.innerWidth<700?'none':'flex';

    const label=rail.querySelector('.label');
    function update(){
      const online=navigator.onLine;
      rail.classList.toggle('offline',!online);
      label.textContent=online?'Sistem siap • koneksi aktif':'Mode offline • periksa koneksi';
    }
    window.addEventListener('online',update);
    window.addEventListener('offline',update);
    update();
  }

  function bindShortcuts(){
    document.addEventListener('keydown',e=>{
      if((e.ctrlKey||e.metaKey)&&e.key==='/'){
        e.preventDefault();window.jlFocusSearch();
      }
      if(e.key==='Escape'){
        const active=document.activeElement;
        if(active && (active.tagName==='INPUT'||active.tagName==='TEXTAREA')) active.blur();
      }
    });
    window.addEventListener('resize',()=>{
      const rail=document.getElementById('jlSystemRail');
      if(rail) rail.style.display=window.innerWidth<700?'none':'flex';
    });
    window.addEventListener('scroll',()=>{
      const b=document.getElementById('jlTopBtn');
      if(b)b.classList.toggle('show',window.scrollY>450);
    },{passive:true});
  }

  function init(){
    buildPalette();buildUtilities();buildSystemRail();bindShortcuts();
    document.body.setAttribute('data-jl-smart-ui','v2');
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>
