                const isDateInRange = (dateStr) => {
                    if (!filterDateStart.value || !filterDateEnd.value) return true;

                    if (String(dateStr).includes('/')) {
                        const p = String(dateStr).split('/');
                        d = new Date(p[2] + "-" + p[1] + "-" + p[0]);
                    } else {
                        d = new Date(String(dateStr).split('T')[0]);

                    d.setHours(0,0,0,0);
                    const start = new Date(filterDateStart.value); start.setHours(0,0,0,0);
                    const end = new Date(filterDateEnd.value); end.setHours(23,59,59,999);
                    return d >= start && d <= end;

                    } else {
                        d = new Date(String(dateStr).split('T')[0]);
                    }
                    const td = new Date();
                    return d.getFullYear() === td.getFullYear() && d.getMonth() === td.getMonth() && d.getDate() === td.getDate();

                const formatRupiah = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(Number(n)||0);
                const formatRupiahSingkat = (n) => { let a=Number(n)||0; if(a>=1e9) return 'Rp '+(a/1e9).toFixed(1).replace('.0','')+' M'; if(a>=1e6) return 'Rp '+(a/1e6).toFixed(1).replace('.0','')+' Jt'; return formatRupiah(a); };

                // =============================================================

                const angkaKeTerbilang = (n) => {
                    const nilai = Math.floor(Math.abs(Number(n) || 0));
                    if (nilai === 0) return 'Nol Rupiah';
                    const huruf = ['', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh', 'Delapan', 'Sembilan', 'Sepuluh', 'Sebelas'];
                    function sebut(x) {
                        if (x < 12) return ' ' + huruf[x];
                        if (x < 20) return sebut(x - 10) + ' Belas';
                        if (x < 100) return sebut(Math.floor(x / 10)) + ' Puluh' + sebut(x % 10);
                        if (x < 200) return ' Seratus' + sebut(x - 100);
                        if (x < 1000) return sebut(Math.floor(x / 100)) + ' Ratus' + sebut(x % 100);
                        if (x < 2000) return ' Seribu' + sebut(x - 1000);
                        if (x < 1000000) return sebut(Math.floor(x / 1000)) + ' Ribu' + sebut(x % 1000);
                        if (x < 1000000000) return sebut(Math.floor(x / 1000000)) + ' Juta' + sebut(x % 1000000);
                        if (x < 1000000000000) return sebut(Math.floor(x / 1000000000)) + ' Miliar' + sebut(x % 1000000000);
                        return sebut(Math.floor(x / 1000000000000)) + ' Triliun' + sebut(x % 1000000000000);
                    }
                    return (sebut(nilai).trim() + ' Rupiah').replace(/\s+/g, ' ');
                };

                const onRupiahInputChange = (event, targetObj, propName, callback = null, maxLimit = null) => {

                    if (maxLimit !== null && maxLimit !== undefined && numVal > Number(maxLimit)) {

                    const formatted = numVal > 0 ? numVal.toLocaleString('id-ID') : '';
                    
                    // Caret preservation
                    const caretPos = el.selectionEnd;
                    const oldLen = el.value.length;
                    el.value = formatted;
                    const newLen = el.value.length;
                    const newCaret = Math.max(0, caretPos + (newLen - oldLen));
                    try { el.setSelectionRange(newCaret, newCaret); } catch(e) {}
                    
                    if (typeof callback === 'function') callback();

                    } else if (delta === 'max') {
                        if (maxLimit !== null && maxLimit !== undefined) {
                            targetObj[propName] = Math.max(0, Number(maxLimit));
                        }
                    } else {
                        let nextVal = curr + Number(delta);
                        if (maxLimit !== null && maxLimit !== undefined) {

                        attempts++;
                    } while (existingIds.has(candidate) && attempts < 1000);

                        const matchQ = !q || 
                            (item.nama && item.nama.toLowerCase().includes(q)) || 
                            (item.kode && item.kode.toLowerCase().includes(q)) ||
                            (item.spesifikasi && item.spesifikasi.toLowerCase().includes(q)) ||
                            (item.supplier_acuan && item.supplier_acuan.toLowerCase().includes(q));
                        const matchKat = kat === 'Semua' || item.kategori === kat;

                        let matchSumber = true;
                        if (sumber && sumber !== 'Semua') {
                            const sItem = (item.sumber_harga || 'terakhir').toLowerCase();
                            if (sumber === 'Terakhir') matchSumber = sItem === 'terakhir';
                            else if (sumber === 'Rata-Rata') matchSumber = sItem === 'rata_rata';
                            else if (sumber === 'Manual') matchSumber = sItem === 'manual' || !!item.is_manual_harga_pakai;
                        }

                        let matchStatus = true;
                        if (status && status !== 'Semua') {
                            if (status === 'Aktif') matchStatus = item.status === 'Aktif' || !item.status;
                            else if (status === 'Perlu Review') matchStatus = cekPerluReviewHarga(item);
                            else if (status === 'Non-Aktif') matchStatus = item.status === 'Non-Aktif';
                        }

                        let matchPerluReview = true;
                        if (perluReviewOnly) {
                            matchPerluReview = cekPerluReviewHarga(item);
                        }

                        return matchQ && matchKat && matchSumber && matchStatus && matchPerluReview;
                    });
                });
                // Sentralisasi Utilitas Angka HPP & Konversi Satuan
                const normalizeHppNumber = (val, fallback = 0) => {
                    if (val === null || val === undefined || val === '') return fallback;
                    const n = Number(val);
                    return isNaN(n) ? fallback : n;
                };

                const applyHppRoundingRule = (cost, ruleStr = 'NONE', modeStr = 'NEAREST') => {
                    if (!ruleStr || ruleStr === 'NONE' || ruleStr === '0') {
                        return Math.round(cost * 100) / 100;
                    }
                    const step = Number(ruleStr);
                    if (isNaN(step) || step <= 0) return Math.round(cost * 100) / 100;

                    const mode = String(modeStr || 'NEAREST').toUpperCase();
                    if (mode === 'UP') {
                        return Math.ceil(cost / step) * step;
                    } else if (mode === 'DOWN') {
                        return Math.floor(cost / step) * step;
                    } else {
                        // NEAREST (Default JAGO LABA)
                        return Math.round(cost / step) * step;
                    }
                };

                const calculateBahanHppCost = (mat) => {
                    if (!mat) return { cost_before_rounding: 0, hpp_final_per_pcs: 0, raw_cost_per_pcs: 0, standard_cost_per_pcs: 0 };
                    
                    // Manual HPP Override
                    if (mat.cost_mode === 'MANUAL' || mat.is_manual) {
                        const finalVal = normalizeHppNumber(mat.hpp_final_per_pcs !== undefined ? mat.hpp_final_per_pcs : mat.harga_standar, 0);
                        return {
                            cost_before_rounding: finalVal,
                            hpp_final_per_pcs: finalVal,
                            raw_cost_per_pcs: finalVal,
                            standard_cost_per_pcs: finalVal
                        };
                    }

                    const hargaBeli = normalizeHppNumber(mat.harga_satuan_beli !== undefined && mat.harga_satuan_beli !== '' ? mat.harga_satuan_beli : mat.harga_standar, 0);
                    const isi = normalizeHppNumber(mat.isi_satuan_beli, 1);
                    const metode = (mat.metode_kalkulasi || 'PER_UNIT_PAKAI').toUpperCase();
                    const roundingRule = String(mat.rounding_rule || 'NONE');
                    const roundingMode = String(mat.rounding_mode || 'NEAREST');
                    const wasteTreatment = mat.waste_treatment || 'Included in Yield';

                    let costBefore = 0;
                    if (metode === 'YIELD' || metode === 'PER_YIELD') {
                        const goodOutput = normalizeHppNumber(mat.yield_good_pcs, normalizeHppNumber(mat.yield_qty, 1) - normalizeHppNumber(mat.reject_default, 0));
                        costBefore = hargaBeli / Math.max(1, goodOutput);
                        if (wasteTreatment === 'Additional Waste') {
                            const w = normalizeHppNumber(mat.waste_default, 0);
                            costBefore = costBefore * (1 + w / 100);
                        }
                    } else if (metode === 'PER_PCS' || metode === 'PER_PCS_LANGSUNG') {
                        const hargaPerPcs = hargaBeli / Math.max(1, isi);
                        const qty = normalizeHppNumber(mat.qty_pakai_per_pcs, 1);
                        costBefore = hargaPerPcs * qty;
                    } else if (metode === 'PER_BATCH') {
                        const batchQty = normalizeHppNumber(mat.yield_good_pcs, 100);
                        costBefore = hargaBeli / Math.max(1, batchQty);
                    } else {
                        // Default PER_UNIT_PAKAI
                        const hargaPakai = hargaBeli / Math.max(1, isi);
                        const qty = normalizeHppNumber(mat.qty_pakai_per_pcs || mat.qty_per_unit, 1);
                        const waste = normalizeHppNumber(mat.waste_default, 0);
                        costBefore = hargaPakai * qty * (1 + waste / 100);
                    }

                    const hppFinal = applyHppRoundingRule(costBefore, roundingRule, roundingMode);
                    return {
                        cost_before_rounding: Math.round(costBefore * 10000) / 10000,
                        hpp_final_per_pcs: hppFinal,
                        raw_cost_per_pcs: Math.round(costBefore * 10000) / 10000,
                        standard_cost_per_pcs: hppFinal
                    };
                };

                const getHargaAktifBahan = (mat) => {
                    if (!mat) return 0;
                    if (mat.harga_aktif !== undefined && mat.harga_aktif !== null && mat.harga_aktif !== '') {
                        return Number(mat.harga_aktif);
                    }
                    if (mat.harga_per_satuan_pakai !== undefined && mat.harga_per_satuan_pakai !== null && mat.harga_per_satuan_pakai !== '') {
                        return Number(mat.harga_per_satuan_pakai);
                    }
                    return Number(mat.harga_standar || 0);
                };

                const getHargaBeliTerakhirPerSatuanPakai = (mat) => {
                    if (!mat) return 0;
                    const isi = normalizeHppNumber(mat.isi_satuan_beli, 1);
                    const hBeli = Number(mat.harga_beli_terakhir !== undefined && mat.harga_beli_terakhir !== '' ? mat.harga_beli_terakhir : (mat.harga_satuan_beli || mat.harga_standar || 0));
                    return Math.round((hBeli / isi) * 1000) / 1000;
                };

                const getHargaRataRataPerSatuanPakai = (mat) => {
                    if (!mat) return 0;
                    const isi = normalizeHppNumber(mat.isi_satuan_beli, 1);
                    const hRata = Number(mat.harga_rata_rata !== undefined && mat.harga_rata_rata !== '' ? mat.harga_rata_rata : (mat.harga_beli_terakhir || mat.harga_satuan_beli || mat.harga_standar || 0));
                    return Math.round((hRata / isi) * 1000) / 1000;
                };

                const cekPerluReviewHarga = (mat) => {
                    if (!mat) return false;
                    if (mat.status === 'Perlu Review') return true;
                    const hAktif = getHargaAktifBahan(mat);
                    const hBeliPakai = getHargaBeliTerakhirPerSatuanPakai(mat);
                    if (hAktif <= 0 || hBeliPakai <= 0) return false;
                    const deltaPct = Math.abs(hBeliPakai - hAktif) / hAktif;
                    return deltaPct > 0.05;
                };

                const getPerubahanHargaBadge = (mat) => {
                    if (!mat) return { type: 'stable', label: 'Stabil', diffPct: 0, diffNominal: 0 };
                    const hAktif = getHargaAktifBahan(mat);
                    const hBeliPakai = getHargaBeliTerakhirPerSatuanPakai(mat);
                    if (hAktif <= 0 || hBeliPakai <= 0 || Math.abs(hBeliPakai - hAktif) < 0.01) {
                        return { type: 'stable', label: 'Stabil', diffPct: 0, diffNominal: 0 };
                    }
                    const diffNominal = hBeliPakai - hAktif;
                    const diffPct = Math.round(((diffNominal) / hAktif) * 1000) / 10;
                    if (diffPct > 0) {
                        return { type: 'up', label: `+${diffPct}%`, diffPct, diffNominal };
                    } else {
                        return { type: 'down', label: `${diffPct}%`, diffPct, diffNominal };
                    }
                };

                const onUpdateKalkulasiHargaModalBahan = () => {
                    const isi = normalizeHppNumber(formData.isi_satuan_beli, 1);
                    const hBeli = Number(formData.harga_satuan_beli || 0);
                    formData.isi_satuan_beli = isi;
                    
                    const sumber = formData.sumber_harga || 'terakhir';
                    let hargaPakaiDihitung = Math.round((hBeli / isi) * 1000) / 1000;

                    if (sumber === 'rata_rata') {
                        const hRata = Number(formData.harga_rata_rata || hBeli);
                        hargaPakaiDihitung = Math.round((hRata / isi) * 1000) / 1000;
                    } else if (sumber === 'manual') {
                        hargaPakaiDihitung = Number(formData.harga_manual_override !== undefined ? formData.harga_manual_override : (formData.harga_per_satuan_pakai || hargaPakaiDihitung));
                    }

                    formData.harga_per_satuan_pakai = hargaPakaiDihitung;
                    formData.harga_aktif = hargaPakaiDihitung;
                    formData.harga_standar = hargaPakaiDihitung;
                };

                const sinkronkanHargaDariPembelian = async () => {
                    isSyncingHargaPembelian.value = true;
                    try {
                        if (window.jlApi && window.jlApi.run) {
                            await new Promise((resolve, reject) => {
                                window.jlApi.run
                                    .withSuccessHandler(res => {
                                        if (res && res.status === 'success') {
                                            if (Array.isArray(res.data)) {
                                                bahanHPP.value = res.data;
                                                simpanCacheLokal();
                                            }
                                            showPopup({
                                                type: 'success',
                                                title: 'Sinkronisasi Berhasil',
                                                message: `Berhasil memperbarui harga acuan ${res.updatedCount || 0} bahan dari faktur pembelian. Standar harga aktif HPP tetap terlindungi.`
                                            });
                                            resolve(res);
                                        } else {
                                            reject(new Error(res?.message || 'Gagal sinkronisasi'));
                                        }
                                    })
                                    .withFailureHandler(err => reject(err))
                                    .syncBahanHppFromPurchasesServerRpc();
                            });
                        } else {
                            let count = 0;
                            (bahanHPP.value || []).forEach(bh => {
                                if (bh.id_bahan_gudang) {
                                    const pbList = (pembelian.value || []).filter(p => (p.items || []).some(it => String(it.id_bahan) === String(bh.id_bahan_gudang)));
                                    if (pbList.length > 0) {
                                        const latestPb = pbList[0];
                                        const itm = (latestPb.items || []).find(it => String(it.id_bahan) === String(bh.id_bahan_gudang));
                                        if (itm && Number(itm.qty) > 0) {
                                            const unitPrice = Number(itm.total_harga || 0) / Number(itm.qty);
                                            if (unitPrice > 0) {
                                                bh.harga_beli_terakhir = unitPrice;
                                                count++;
                                            }
                                        }
                                    }
                                }
                            });
                            if (count > 0) {
                                syncKeDatabase('Bahan_HPP', bahanHPP.value);
                                showPopup({
                                    type: 'success',
                                    title: 'Sinkronisasi Pembelian Selesai',
                                    message: `${count} harga acuan bahan baku berhasil disinkronkan dengan riwayat pembelian.`
                                });
                            } else {
                                showPopup({ type: 'info', title: 'Sudah Terkini', message: 'Seluruh harga acuan bahan baku sudah sinkron dengan faktur pembelian.' });
                            }
                        }
                    } catch (err) {
                        showPopup({ type: 'error', title: 'Gagal Sinkronisasi', message: err.message || String(err) });
                    } finally {
                        isSyncingHargaPembelian.value = false;
                    }
                };

                const gunakanHargaBeliTerakhir = (bh) => {
                    if (!bh) return;
                    const isi = normalizeHppNumber(bh.isi_satuan_beli, 1);
                    const hBeliTerakhir = Number(bh.harga_beli_terakhir || bh.harga_satuan_beli || 0);
                    if (hBeliTerakhir <= 0) {
                        showPopup({ type: 'warning', title: 'Belum Ada Riwayat Beli', message: 'Belum ada data harga pembelian terakhir untuk bahan ini.' });
                        return;
                    }
                    const hargaBaruPerSatuanPakai = Math.round((hBeliTerakhir / isi) * 1000) / 1000;
                    const hargaLama = getHargaAktifBahan(bh);

                    showPopup({
                        type: 'confirm',
                        title: 'Gunakan Harga Beli Terakhir?',
                        message: `Perbarui harga aktif "${bh.nama}" dari ${formatRupiah(hargaLama)} menjadi ${formatRupiah(hargaBaruPerSatuanPakai)} / ${bh.satuan_pakai || 'satuan'}? Riwayat perubahan akan dicatat permanen ke audit log.`,
                        confirmText: 'Ya, Terapkan Harga Beli',
                        cancelText: 'Batal',
                        onConfirm: async () => {
                            const diffNominal = hargaBaruPerSatuanPakai - hargaLama;
                            const diffPct = hargaLama > 0 ? Math.round(((diffNominal) / hargaLama) * 1000) / 10 : 0;

                            bh.harga_aktif = hargaBaruPerSatuanPakai;
                            bh.harga_per_satuan_pakai = hargaBaruPerSatuanPakai;
                            bh.harga_standar = hargaBaruPerSatuanPakai;
                            bh.sumber_harga = 'terakhir';
                            bh.status = 'Aktif';
                            bh.updated_at = new Date().toISOString();

                            const histEntry = {
                                id_history: 'HIST-BH-' + Date.now(),
                                id_bahan_hpp: String(bh.id),
                                kode_bahan: bh.kode || '',
                                nama_bahan: bh.nama,
                                harga_lama: hargaLama,
                                harga_baru: hargaBaruPerSatuanPakai,
                                selisih_nominal: diffNominal,
                                persentase_perubahan: diffPct,
                                sumber_harga: 'Pembelian Terakhir',
                                alasan_perubahan: 'Adopsi harga pembelian terakhir oleh Admin',
                                user: getOperatorName(),
                                created_at: new Date().toISOString()
                            };

                            bahanHppHistory.value = (bahanHppHistory.value || []).concat([histEntry]);

                            try {
                                await syncMultiTabs([
                                    { tab: 'Bahan_HPP', data: bahanHPP.value },
                                    { tab: 'Bahan_HPP_History', data: bahanHppHistory.value }
                                ]);
                            } catch(e) {
                                syncKeDatabase('Bahan_HPP', bahanHPP.value);
                            }

                            showPopup({
                                type: 'success',
                                title: 'Harga Aktif Diperbarui',
                                message: `Harga aktif "${bh.nama}" kini ditetapkan ${formatRupiah(hargaBaruPerSatuanPakai)} / ${bh.satuan_pakai || 'satuan'}.`
                            });
                            addLog(`Harga aktif bahan ${bh.nama} diubah ke ${formatRupiah(hargaBaruPerSatuanPakai)}`, 'bg-blue-600');
                        }
                    });
                };

                const bukaRiwayatHargaBahan = (bh) => {
                    selectedBahanForHistory.value = bh;
                    isModalRiwayatHargaBahanOpen.value = true;
                };

                const riwayatHargaBahanTerpilih = computed(() => {
                    if (!selectedBahanForHistory.value) return [];
                    const idTarget = String(selectedBahanForHistory.value.id || '');
                    const kodeTarget = String(selectedBahanForHistory.value.kode || '').trim().toUpperCase();
                    return (bahanHppHistory.value || []).filter(h => {
                        return (h.id_bahan_hpp && String(h.id_bahan_hpp) === idTarget) ||
                               (kodeTarget && h.kode_bahan && String(h.kode_bahan).trim().toUpperCase() === kodeTarget);
                    }).sort((a, b) => new Date(b.created_at || b.tanggal || 0) - new Date(a.created_at || a.tanggal || 0));
                });

                const bukaSimulasiDampakHarga = (bh) => {
                    selectedBahanForDampak.value = bh;
                    const hargaBaru = getHargaBeliTerakhirPerSatuanPakai(bh);
                    const hargaLama = getHargaAktifBahan(bh);

                    const affected = [];
                    const seenModels = new Set();
                    (hppModelBom.value || []).filter(b => String(b.id_bahan_hpp) === String(bh.id) && b.status !== 'Nonaktif').forEach(b => {
                        if (!seenModels.has(b.model_key)) {
                            seenModels.add(b.model_key);
                            const model = (uniqueHppModelList.value || []).find(m => m.model_key === b.model_key);
                            const hppLama = Number(model?.hpp_produk || 0);
                            const qtyPakai = Number(b.qty_pakai_per_pcs !== undefined ? b.qty_pakai_per_pcs : (b.qty_per_unit || 0));
                            const waste = Number(b.waste_pct || 0);
                            const qtyEfektif = qtyPakai * (1 + waste / 100);
                            
                            const selisihBahanPerUnit = (hargaBaru - hargaLama) * qtyEfektif;
                            const hppBaruSimulasi = Math.round(hppLama + selisihBahanPerUnit);
                            const selisihHpp = hppBaruSimulasi - hppLama;
                            const selisihPct = hppLama > 0 ? Math.round((selisihHpp / hppLama) * 1000) / 10 : 0;

                            affected.push({
                                model_key: b.model_key,
                                model_nama: b.model_nama || model?.nama || b.model_key,
                                qty_pakai: Math.round(qtyPakai * 100) / 100,
                                satuan: b.satuan_pakai || b.satuan || 'Pcs',
                                waste_pct: waste,
                                hpp_lama: hppLama,
                                hpp_baru_simulasi: hppBaruSimulasi,
                                selisih: selisihHpp,
                                selisih_pct: selisihPct
                            });
                        }
                    });
                    dampakBahanList.value = affected;
                    isModalDampakBahanOpen.value = true;
                };

                const bukaModelDariSimulasi = (modelKey) => {
                    isModalDampakBahanOpen.value = false;
                    switchTab('hpp_produksi');
                    loadHppFormulaByModel(modelKey);
                };

                const getHargaPerSatuanPakai = (mat) => {
                    if (!mat) return 0;
                    return getHargaAktifBahan(mat);
                };

                const totalBahanHPP = computed(() => (bahanHPP.value || []).length);
                const totalHargaAktifBahanHPP = computed(() => (bahanHPP.value || []).filter(x => getHargaAktifBahan(x) > 0).length);
                const totalPerluReviewBahanHPP = computed(() => (bahanHPP.value || []).filter(x => cekPerluReviewHarga(x)).length);
                const totalOverrideManualBahanHPP = computed(() => (bahanHPP.value || []).filter(x => (x.sumber_harga || '').toLowerCase() === 'manual' || !!x.is_manual_harga_pakai).length);
                const totalBahanUtamaCount = computed(() => {
                    return (bahanHPP.value || []).filter(x => {
                        const k = (x.kategori || '').toLowerCase();
                        return k.includes('utama') || k.includes('kain');
                    }).length;
                });
                const rataRataBahanUtama = computed(() => {
                    const utama = (bahanHPP.value || []).filter(x => {
                        const k = (x.kategori || '').toLowerCase();
                        return k.includes('utama') || k.includes('kain');
                    });
                    if (!utama.length) return 0;
                    const sum = utama.reduce((s, x) => s + (getHargaPerSatuanPakai(x) || Number(x.harga_standar) || 0), 0);
                    return Math.round(sum / utama.length);
                });
                const totalAksesorisTrims = computed(() => {
                    return (bahanHPP.value || []).filter(x => {
                        const k = (x.kategori || '').toLowerCase();
                        return k.includes('aksesoris') || k.includes('trims') || k.includes('furing') || k.includes('packaging');
                    }).length;
                });
                const totalTerhubungGudang = computed(() => {
                    return (bahanHPP.value || []).filter(x => x.id_bahan_gudang && String(x.id_bahan_gudang).trim() !== '').length;
                });
                const totalModelMemilikiBom = computed(() => {
                    const set = new Set((hppModelBom.value || []).filter(b => b.status !== 'Nonaktif').map(b => b.model_key).filter(Boolean));
                    return set.size;
                });
                const totalBahanBelumDigunakan = computed(() => {
                    const usedIds = new Set((hppModelBom.value || []).map(b => String(b.id_bahan_hpp)).filter(Boolean));
                    return (bahanHPP.value || []).filter(b => !usedIds.has(String(b.id))).length;
                });
                const getModelCountForBahan = (bahanHppId) => {
                    if (!bahanHppId) return 0;
                    const set = new Set((hppModelBom.value || []).filter(b => String(b.id_bahan_hpp) === String(bahanHppId)).map(b => b.model_key).filter(Boolean));
                    return set.size;
                };
                const getModelsUsingBahan = (bahanHppId) => {
                    if (!bahanHppId) return [];
                    const map = new Map();
                    (hppModelBom.value || []).filter(b => String(b.id_bahan_hpp) === String(bahanHppId)).forEach(b => {
                        if (!map.has(b.model_key)) {
                            map.set(b.model_key, {
                                model_key: b.model_key,
                                model_nama: b.model_nama || b.model_key,
                                qty_pakai: b.qty_pakai_per_pcs || b.qty_per_unit || 0,
                                satuan: b.satuan_pakai || b.satuan || 'Pcs',
                                waste_pct: b.waste_pct || 0
                            });
                        }
                    });
                    return Array.from(map.values());
                };

                const bahanHPPListBahanUtama = computed(() => {
                    return (bahanHPP.value || []).filter(x => {
                        const k = (x.kategori || '').toLowerCase();
                        return k.includes('utama') || k.includes('kain') || k.includes('furing');
                    });
                });
                const bahanHPPListAksesoris = computed(() => {
                    return (bahanHPP.value || []).filter(x => {
                        const k = (x.kategori || '').toLowerCase();
                        return !k.includes('utama') && !k.includes('kain');
                    });
                });
                const getNamaBahanGudang = (id) => {
                    if (!id) return '-';
                    const b = bahan.value.find(x => String(x.id) === String(id));
                    return b ? (b.nama + (b.kode ? ' (' + b.kode + ')' : '')) : '-';
                };
                const onPilihBahanGudangDiModal = () => {
                    if (!formData.id_bahan_gudang) return;
                    const b = bahan.value.find(x => String(x.id) === String(formData.id_bahan_gudang));
                    if (b) {
                        if (!formData.nama) formData.nama = b.nama;
                        if (!formData.satuan_beli) formData.satuan_beli = b.satuan || 'Roll';
                        if (!formData.satuan_pakai) formData.satuan_pakai = b.satuan === 'Roll' ? 'Meter' : (b.satuan || 'Pcs');
                        if (!formData.satuan) formData.satuan = formData.satuan_pakai;
                        formData.harga_beli_terakhir = Number(b.harga_beli || 0);
                        if (!formData.harga_satuan_beli || Number(formData.harga_satuan_beli) === 0) {
                            formData.harga_satuan_beli = Number(b.harga_beli || 0);
                        }
                        const isi = normalizeHppNumber(formData.isi_satuan_beli, 1);
                        formData.harga_per_satuan_pakai = Math.round((Number(formData.harga_satuan_beli) / isi) * 1000) / 1000;
                        if (!formData.harga_standar || Number(formData.harga_standar) === 0) {
                            formData.harga_standar = formData.harga_per_satuan_pakai;
                        }
                    }
                };
                const sinkronkanHargaDariGudang = () => {
                    let updatedCount = 0;
                    const affectedModels = new Set();
                    (bahanHPP.value || []).forEach(bh => {
                        if (bh.id_bahan_gudang) {
                            const b = bahan.value.find(x => String(x.id) === String(bh.id_bahan_gudang));
                            if (b && Number(b.harga_beli || 0) > 0) {
                                const oldPrice = Number(bh.harga_satuan_beli || bh.harga_standar || 0);
                                const newPrice = Number(b.harga_beli);
                                if (oldPrice !== newPrice) {
                                    bh.harga_beli_terakhir = newPrice;
                                    bh.harga_satuan_beli = newPrice;
                                    const isi = normalizeHppNumber(bh.isi_satuan_beli, 1);
                                    bh.harga_per_satuan_pakai = Math.round((newPrice / isi) * 1000) / 1000;
                                    bh.harga_standar = bh.harga_per_satuan_pakai;
                                    updatedCount++;

                                    // Lacak model terdampak
                                    (hppModelBom.value || []).filter(item => String(item.id_bahan_hpp) === String(bh.id)).forEach(item => {
                                        affectedModels.add(item.model_key);
                                    });
                                }
                            }
                        }
                    });
                    if (updatedCount > 0) {
                        syncKeDatabase('Bahan_HPP', bahanHPP.value);
                        const modelListStr = Array.from(affectedModels).slice(0, 3).join(', ');
                        const extraStr = affectedModels.size > 3 ? ` dan ${affectedModels.size - 3} model lainnya` : '';
                        showNotification(`${updatedCount} Bahan Baku HPP berhasil disinkronkan dengan harga beli gudang terbaru. ${affectedModels.size ? `Terdampak pada model: ${modelListStr}${extraStr}.` : ''}`);
                    } else {
                        showNotification('Semua data bahan baku HPP sudah sinkron dengan harga gudang fisik.');
                    }
                };

                // =========================================================
                // MODUL REGISTRASI MATERIAL MASTER TERPADU V1
                // =========================================================
                const generateNextKodeMaterial = (kategori) => {
                    const kat = String(kategori || formData.kategori || 'Kain Utama').trim().toUpperCase();
                    let prefix = 'MAT-';
                    if (kat.includes('KAIN UTAMA')) prefix = 'MAT-KAIN-';
                    else if (kat.includes('FURING') || kat.includes('LAPIS')) prefix = 'MAT-FUR-';
                    else if (kat.includes('RESL') || kat.includes('ZIPPER')) prefix = 'MAT-ZIP-';
                    else if (kat.includes('WEBB') || kat.includes('TALI')) prefix = 'MAT-WEB-';
                    else if (kat.includes('BUSA') || kat.includes('FOAM')) prefix = 'MAT-FOAM-';
                    else if (kat.includes('BENANG')) prefix = 'MAT-BNG-';
                    else if (kat.includes('LABEL')) prefix = 'MAT-LBL-';
                    else if (kat.includes('PACKAG')) prefix = 'MAT-PCK-';
                    else if (kat.includes('HARDWARE')) prefix = 'MAT-HDW-';
                    else if (kat.includes('AKSESORIS')) prefix = 'MAT-AKS-';

                    const codeSet = new Set((bahan.value || []).map(b => String(b.kode_bahan || b.kode || '').trim().toUpperCase()));
                    let seq = 1;
                    while (seq < 10000) {
                        const cand = prefix + String(seq).padStart(3, '0');
                        if (!codeSet.has(cand)) {
                            formData.kode = cand;
                            cekDuplikasiKodeMaterial();
                            return cand;
                        }
                        seq++;
                    }
                    const rnd = prefix + Math.random().toString(36).substr(2, 4).toUpperCase();
                    formData.kode = rnd;
                    cekDuplikasiKodeMaterial();
                    return rnd;
                };

                const cekDuplikasiKodeMaterial = () => {
                    const code = String(formData.kode || '').trim().toUpperCase();
                    if (!code) {
                        kodeBahanDuplicateWarning.value = '';
                        return;
                    }
                    const targetId = isEditMode.value ? String(formData.id_bahan || formData.id || '') : '';
                    const dup = (bahan.value || []).find(b => {
                        const bKode = String(b.kode_bahan || b.kode || '').trim().toUpperCase();
                        const bId = String(b.id_bahan || b.id || '').trim();
                        return bKode === code && (!isEditMode.value || bId !== targetId);
                    });
                    if (dup) {
                        kodeBahanDuplicateWarning.value = 'Kode material sudah digunakan (' + (dup.nama_bahan || dup.nama || 'Material') + ').';
                    } else {
                        kodeBahanDuplicateWarning.value = '';
                    }
                };

                const hitungKalkulasiHppSatuanPakai = () => {
                    const hrgBeli = Number(formData.harga_beli || 0);
                    const isi = Number(formData.isi_satuan_beli || 1);
                    const satBeli = String(formData.satuan_beli || 'Roll').trim().toLowerCase();
                    const satPakai = String(formData.satuan_pakai || 'Meter').trim().toLowerCase();

                    if (!formData.manual_override) {
                        if (satBeli === satPakai) {
                            formData.harga_satuan_pakai = hrgBeli;
                        } else if (isi > 0) {
                            formData.harga_satuan_pakai = Math.round((hrgBeli / isi) * 1000) / 1000;
                        } else {
                            formData.harga_satuan_pakai = hrgBeli;
                        }
                    }
                };

                const onKategoriMaterialChange = (e) => {
                    if (e && e.target && e.target.value === 'Lainnya') {
                        showCustomJenis.value = true;
                        formData.kategori = '';
                    }
                    if (!isEditMode.value || !formData.kode) {
                        generateNextKodeMaterial(formData.kategori);
                    }
                };

                const onSatuanBeliChange = (e) => {
                    if (e && e.target && e.target.value === 'Lainnya') {
                        showCustomSatuanBahan.value = true;
                        formData.satuan_beli = '';
                    }
                    const sb = String(formData.satuan_beli || '').toLowerCase();
                    if (sb === 'roll') {
                        formData.isi_satuan_beli = formData.isi_satuan_beli && formData.isi_satuan_beli > 1 ? formData.isi_satuan_beli : 50;
                        formData.satuan_pakai = 'Meter';
                    } else if (sb === 'meter' || sb === 'centimeter' || sb === 'yard') {
                        formData.isi_satuan_beli = 1;
                        formData.satuan_pakai = formData.satuan_beli;
                    } else if (sb === 'kg') {
                        formData.isi_satuan_beli = 1000;
                        formData.satuan_pakai = 'Gram';
                    } else if (sb === 'lusin') {
                        formData.isi_satuan_beli = 12;
                        formData.satuan_pakai = 'Pcs';
                    } else if (sb === 'pack') {
                        formData.isi_satuan_beli = 100;
                        formData.satuan_pakai = 'Pcs';
                    }
                    hitungKalkulasiHppSatuanPakai();
                };

                const onManualOverrideToggle = () => {
                    if (formData.manual_override) {
                        formData.sumber_harga = 'manual';
                        if (!formData.alasan_override) formData.alasan_override = '';
                    } else {
                        hitungKalkulasiHppSatuanPakai();
                    }
                };

                const eksekusiSimpanMaterial = () => {
                    if (!formData.nama || !String(formData.nama).trim()) {
                        showPopup({ type: 'error', title: 'Nama Wajib', message: 'Nama material wajib diisi.' });
                        return;
                    }
                    if (kodeBahanDuplicateWarning.value) {
                        showPopup({ type: 'warning', title: 'Kode Duplikat', message: kodeBahanDuplicateWarning.value });
                        return;
                    }
                    const satBeli = String(formData.satuan_beli || '').trim().toLowerCase();
                    const satPakai = String(formData.satuan_pakai || '').trim().toLowerCase();
                    const isi = Number(formData.isi_satuan_beli || 1);
                    if (satBeli !== satPakai && isi <= 0) {
                        showPopup({ type: 'warning', title: 'Konversi Tidak Valid', message: 'Isi per satuan beli harus lebih besar dari 0 untuk konversi satuan.' });
                        return;
                    }
                    if (formData.manual_override && (!formData.alasan_override || !String(formData.alasan_override).trim())) {
                        showPopup({ type: 'warning', title: 'Alasan Wajib', message: 'Wajib mengisi alasan penyesuaian manual override.' });
                        return;
                    }

                    isSubmittingMaterial.value = true;
                    hitungKalkulasiHppSatuanPakai();

                    const payload = {
                        is_edit: isEditMode.value,
                        target_id: isEditMode.value ? (formData.id_bahan || formData.id) : '',
                        id_bahan: isEditMode.value ? (formData.id_bahan || formData.id) : '',
                        kode: String(formData.kode || '').trim().toUpperCase(),
                        kode_bahan: String(formData.kode || '').trim().toUpperCase(),
                        nama: String(formData.nama || '').trim(),
                        nama_bahan: String(formData.nama || '').trim(),
                        kategori: formData.kategori || 'Kain Utama',
                        jenis: formData.kategori || 'Kain Utama',
                        subkategori: formData.subkategori || '',
                        supplier_id: formData.supplier_id || '',
                        status: formData.status || 'Aktif',
                        catatan: formData.catatan || '',
                        satuan_beli: formData.satuan_beli || 'Roll',
                        satuan: formData.satuan_beli || 'Roll',
                        isi_satuan_beli: isi,
                        satuan_pakai: formData.satuan_pakai || 'Meter',
                        stok_awal: Number(formData.stok_awal || 0),
                        stok_minimum: Number(formData.stok_minimum !== undefined ? formData.stok_minimum : 10),
                        gudang_id: formData.gudang_id || 'GDG-UTAMA',
                        lokasi_rak: formData.lokasi_rak || '',
                        harga_beli: Number(formData.harga_beli || 0),
                        harga_satuan_pakai: Number(formData.harga_satuan_pakai || 0),
                        sumber_harga: formData.sumber_harga || 'manual',
                        manual_override: Boolean(formData.manual_override),
                        alasan_override: formData.alasan_override || '',
                        operator: loginData.nama || userRole.value || 'Admin Konveksi'
                    };

                    if (window.jlApi && window.jlApi.run) {
                        window.jlApi.run
                            .withSuccessHandler(function(res) {
                                isSubmittingMaterial.value = false;
                                const parsed = typeof res === 'string' ? JSON.parse(res || '{}') : (res || {});
                                if (parsed.status === 'success') {
                                    // 1. Update Bahan lokal
                                    const mData = parsed.material || payload;
                                    if (isEditMode.value) {
                                        const idx = bahan.value.findIndex(b => String(b.id_bahan || b.id) === String(payload.target_id));
                                        if (idx > -1) bahan.value[idx] = Object.assign({}, bahan.value[idx], mData);
                                    } else {
                                        bahan.value.unshift(mData);
                                    }

                                    // 2. Update Bahan_HPP lokal
                                    const bhData = parsed.bahan_hpp;
                                    if (bhData) {
                                        const bhIdx = (bahanHPP.value || []).findIndex(x => String(x.id_bahan_gudang || x.id_bahan) === String(mData.id_bahan || mData.id));
                                        if (bhIdx > -1) {
                                            bahanHPP.value[bhIdx] = Object.assign({}, bahanHPP.value[bhIdx], bhData);
                                        } else {
                                            bahanHPP.value.unshift(bhData);
                                        }
                                    }

                                    // 3. Update Mutasi_Stok lokal jika tercatat
                                    if (parsed.mutasi && parsed.mutasi_created) {
                                        mutasiStok.value.unshift(parsed.mutasi);
                                    }

                                    simpanCacheLokal();

                                    // Jika dibuat dari baris faktur pembelian, kembalikan ke modal faktur
                                    if (activeItemForQuickMaterial.value) {
                                        if (cachedPurchaseFormData.value) {
                                            for (let k in formData) delete formData[k];
                                            Object.assign(formData, cachedPurchaseFormData.value);
                                            cachedPurchaseFormData.value = null;
                                        }
                                        const tId = mData.id_bahan || mData.id;
                                        const targetItem = (formData.items || []).find(it => it === activeItemForQuickMaterial.value || (it.raw_name && it.raw_name === activeItemForQuickMaterial.value.raw_name));
                                        if (targetItem) {
                                            targetItem.id_bahan = tId;
                                            targetItem.satuan_beli = mData.satuan_beli || mData.satuan || targetItem.satuan_beli || 'Roll';
                                            targetItem.mapping_status = 'EXACT';
                                            targetItem.confidence = 100;
                                        }
                                        activeItemForQuickMaterial.value = null;
                                        isModalOpen.value = true;
                                        modalType.value = 'pembelian';
                                        modalTitle.value = 'Faktur Pembelian Bahan';
                                        hitungGrandTotalPembelian();
                                        showPopup({
                                            type: 'success',
                                            title: 'Material Terpetakan!',
                                            message: 'Material "' + mData.nama + '" berhasil didaftarkan dan langsung dipetakan pada faktur pembelian.',
                                            autoClose: 2500
                                        });
                                        return;
                                    }

                                    isModalOpen.value = false;
                                    lastRegisteredMaterialResult.value = parsed;
                                    isModalSuksesMaterialOpen.value = true;
                                    addLog('Master Material ' + mData.nama + ' (' + mData.kode + ') berhasil disimpan');
                                } else {
                                    showPopup({ type: 'error', title: 'Gagal Menyimpan Material', message: parsed.message || 'Terjadi kesalahan sistem backend.' });
                                }
                            })
                            .withFailureHandler(function(err) {
                                isSubmittingMaterial.value = false;
                                showPopup({ type: 'error', title: 'Kesalahan Server', message: err.message || String(err) });
                            })
                            .saveMaterialMasterServerRpc(payload);
                    } else {
                        // Fallback offline / dev mode
                        isSubmittingMaterial.value = false;
                        const fakeId = 'BHN-' + Math.random().toString(16).substring(2, 10).toUpperCase();
                        payload.id = payload.id || fakeId;
                        payload.id_bahan = payload.id_bahan || fakeId;
                        bahan.value.unshift(payload);

                        if (activeItemForQuickMaterial.value) {
                            if (cachedPurchaseFormData.value) {
                                for (let k in formData) delete formData[k];
                                Object.assign(formData, cachedPurchaseFormData.value);
                                cachedPurchaseFormData.value = null;
                            }
                            const targetItem = (formData.items || []).find(it => it === activeItemForQuickMaterial.value || (it.raw_name && it.raw_name === activeItemForQuickMaterial.value.raw_name));
                            if (targetItem) {
                                targetItem.id_bahan = fakeId;
                                targetItem.satuan_beli = payload.satuan_beli || 'Roll';
                                targetItem.mapping_status = 'EXACT';
                                targetItem.confidence = 100;
                            }
                            activeItemForQuickMaterial.value = null;
                            isModalOpen.value = true;
                            modalType.value = 'pembelian';
                            modalTitle.value = 'Faktur Pembelian Bahan';
                            hitungGrandTotalPembelian();
                            return;
                        }

                        isModalOpen.value = false;
                        lastRegisteredMaterialResult.value = { status: 'success', action: 'create', ...payload };
                        isModalSuksesMaterialOpen.value = true;
                    }
                };

                const tambahMaterialLagi = () => {
                    isModalSuksesMaterialOpen.value = false;
                    openModal('bahan');
                };

                const lihatMaterialDiTabel = () => {
                    isModalSuksesMaterialOpen.value = false;
                    switchTab('bahan');
                };

                // ==========================================
                // PURCHASING & SMART INVOICE CAPTURE ENGINE
                // ==========================================
                const geminiApiKeyStatus = ref({ hasKey: false, maskedKey: '' });
                const isModalGeminiKeyOpen = ref(false);
                const geminiKeyInput = ref('');
                const showGeminiKeySecret = ref(false);
                const isSavingGeminiKey = ref(false);

                const cekStatusGeminiApiKey = () => {
                    if (window.jlApi && window.jlApi.run) {
                        window.jlApi.run
                            .withSuccessHandler((res) => {
                                const parsed = typeof res === 'string' ? JSON.parse(res || '{}') : (res || {});
                                if (parsed && parsed.status === 'success') {
                                    geminiApiKeyStatus.value = {
                                        hasKey: Boolean(parsed.hasKey),
                                        maskedKey: parsed.maskedKey || ''
                                    };
                                }
                            })
                            .getGeminiApiKeyStatusServerRpc();
                    }
                };
                if (isLoggedIn.value) cekStatusGeminiApiKey();

                const bukaModalGeminiKey = () => {
                    geminiKeyInput.value = '';
                    showGeminiKeySecret.value = false;
                    isModalGeminiKeyOpen.value = true;
                    cekStatusGeminiApiKey();
                };

                const simpanGeminiApiKey = () => {
                    const cleanKey = String(geminiKeyInput.value || '').trim();
                    if (!cleanKey) {
                        showPopup({ type: 'warning', title: 'Kunci Kosong', message: 'Silakan masukkan Gemini API Key terlebih dahulu.' });
                        return;
                    }
                    isSavingGeminiKey.value = true;
                    if (window.jlApi && window.jlApi.run) {
                        window.jlApi.run
                            .withSuccessHandler((res) => {
                                isSavingGeminiKey.value = false;
                                const parsed = typeof res === 'string' ? JSON.parse(res || '{}') : (res || {});
                                if (parsed.status === 'success') {
                                    isModalGeminiKeyOpen.value = false;
                                    cekStatusGeminiApiKey();
                                    showPopup({
                                        type: 'success',
                                        title: 'Kunci API Tersimpan',
                                        message: 'Kunci API Google Gemini berhasil disimpan dan diverifikasi aktif! Kini Anda dapat memindai foto faktur secara otomatis.'
                                    });
                                } else {
                                    showPopup({
                                        type: 'error',
                                        title: 'Verifikasi Kunci API Gagal',
                                        message: parsed.message || 'Kunci API tidak valid atau ditolak Google.'
                                    });
                                }
                            })
                            .withFailureHandler((err) => {
                                isSavingGeminiKey.value = false;
                                showPopup({ type: 'error', title: 'Gagal Menyimpan', message: err.message || String(err) });
                            })
                            .saveGeminiApiKeyServerRpc(cleanKey);
                    } else {
                        isSavingGeminiKey.value = false;
                        showPopup({type:'error',title:'Belum tersimpan',message:'Server tidak tersedia.'});
                    }
                };

                const setPurchaseInputMode = (mode) => {
                    purchaseInputMode.value = mode;
                };

                const triggerPurchaseFileInput = () => {
                    const el = document.getElementById('purchaseFileInput');
                    if (el) el.click();
                };

                const triggerPurchaseCameraInput = () => {
                    const el = document.getElementById('purchaseCameraInput');
                    if (el) el.click();
                };

                const onPurchaseFileSelected = (e) => {
                    const file = e.target.files && e.target.files[0];
                    if (!file) return;

                    if (file.size > 10 * 1024 * 1024) {
                        showPopup({ type: 'warning', title: 'Ukuran Terlalu Besar', message: 'Maksimal ukuran faktur adalah 10 MB.' });
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = (re) => {
                        const dataUrl = re.target.result;
                        const base64 = dataUrl.split(',')[1];
                        uploadedInvoiceFile.value = {
                            name: file.name,
                            fileName: file.name,
                            size: file.size,
                            type: file.type || 'image/jpeg',
                            mimeType: file.type || 'image/jpeg',
                            dataUrl: dataUrl,
                            previewUrl: dataUrl,
                            base64: base64,
                            base64Data: base64
                        };

                        if (purchaseInputMode.value === 'ocr') {
                            jalankanEkstraksiFaktur();
                        }
                    };
                    reader.readAsDataURL(file);
                };

                const hapusFileFaktur = () => {
                    uploadedInvoiceFile.value = null;
                    ocrExtractionResult.value = null;
                    ocrConfidenceDetails.value = {
                        overall: 0,
                        supplier: 0,
                        tanggal: 0,
                        items: 0,
                        harga: 0
                    };
                    formData.ocr_raw_text = '';
                    formData.ocr_confidence = 0;
                    formData.ocr_total_faktur = 0;
                    const el = document.getElementById('purchaseFileInput');
                    if (el) el.value = '';
                    const elCam = document.getElementById('purchaseCameraInput');
                    if (elCam) elCam.value = '';
                };
                const resetInvoiceUpload = hapusFileFaktur;

                const jalankanEkstraksiFaktur = () => {
                    if (!uploadedInvoiceFile.value) {
                        showPopup({ type: 'warning', title: 'Belum Ada Berkas', message: 'Silakan pilih foto atau berkas PDF faktur terlebih dahulu.' });
                        return;
                    }

                    isExtractingInvoice.value = true;
                    const fVal = uploadedInvoiceFile.value || {};
                    const payload = {
                        base64: fVal.base64 || fVal.base64Data || '',
                        base64Data: fVal.base64Data || fVal.base64 || '',
                        mimeType: fVal.mimeType || fVal.type || 'image/jpeg',
                        fileName: fVal.fileName || fVal.name || 'faktur_pembelian.jpg'
                    };

                    if (window.jlApi && window.jlApi.run) {
                        window.jlApi.run
                            .withSuccessHandler((res) => {
                                isExtractingInvoice.value = false;
                                const parsed = typeof res === 'string' ? JSON.parse(res || '{}') : (res || {});
                                if (parsed.status === 'success' && parsed.data) {
                                    terapkanHasilOcrKeDraft(parsed.data);
                                } else if (parsed.status === 'needs_api_key') {
                                    showPopup({
                                        type: 'warning',
                                        title: 'Kunci API Gemini Belum Dikonfigurasi',
                                        message: parsed.message || 'Silakan pasang Google Gemini API Key Anda untuk membaca dokumen faktur ini secara otomatis.',
                                        confirmText: 'Atur API Key Sekarang',
                                        onConfirm: () => {
                                            bukaModalGeminiKey();
                                        }
                                    });
                                } else {
                                    showPopup({ type: 'error', title: 'Ekstraksi Faktur Gagal', message: parsed.message || 'Gagal mengenali teks faktur.' });
                                }
                            })
                            .withFailureHandler((err) => {
                                isExtractingInvoice.value = false;
                                showPopup({ type: 'error', title: 'Gagal Menghubungi OCR Server', message: err.message || String(err) });
                            })
                            .extractPurchaseInvoiceServerRpc(payload);
                    } else {
                        isExtractingInvoice.value = false;
                        showPopup({type:'error',title:'OCR belum berjalan',message:'Server tidak tersedia. Tidak ada data yang dimuat.'});
                    }
                };

                const terapkanHasilOcrKeDraft = (data) => {
                    ocrExtractionResult.value = data;
                    const bd = data.confidence_breakdown || {};
                    ocrConfidenceDetails.value = {
                        overall: Number(data.confidence || 85),
                        supplier: Number(bd.supplier || 85),
                        tanggal: Number(bd.tanggal || 90),
                        items: Number(bd.items || 80),
                        harga: Number(bd.harga || 85)
                    };

                    if (data.no_faktur) formData.no_faktur_supplier = data.no_faktur;
                    if (data.tanggal) {
                        let tglStr = String(data.tanggal).trim();
                        if (tglStr.includes('-')) {
                            const p = tglStr.split('-');
                            if (p.length === 3) tglStr = p[2] + '/' + p[1] + '/' + p[0];
                        }
                        formData.tanggal = tglStr;
                    }

                    if (data.supplier_nama) {
                        const sClean = data.supplier_nama.toLowerCase().replace(/[^a-z0-9]/g, '');
                        const matchedSpl = (supplier.value || []).find(s => {
                            const snClean = String(s.nama || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                            return snClean && (snClean.includes(sClean) || sClean.includes(snClean));
                        });
                        if (matchedSpl) {
                            formData.id_supplier = matchedSpl.id;
                        }
                    }

                    if (data.status_bayar) {
                        const sb = String(data.status_bayar).toUpperCase();
                        if (sb.includes('TEMPO') || sb.includes('KREDIT') || sb.includes('HUTANG')) {
                            formData.status_bayar = 'Tempo';
                        } else if (sb.includes('DP') || sb.includes('UANG MUKA')) {
                            formData.status_bayar = 'DP';
                        } else {
                            formData.status_bayar = 'Lunas';
                        }
                    }

                    if (data.jatuh_tempo) formData.jatuh_tempo = data.jatuh_tempo;
                    formData.ocr_total_faktur = Number(data.total || 0);
                    formData.ocr_confidence = Number(data.confidence || 0);
                    formData.ocr_raw_text = data.raw_text || '';

                    if (Array.isArray(data.items) && data.items.length > 0) {
                        formData.items = data.items.map(it => {
                            const q = Number(it.qty || 1);
                            const p = Number(it.harga_satuan || 0);
                            const t = Number(it.subtotal !== undefined ? it.subtotal : (it.total_harga !== undefined ? it.total_harga : (q * p)));
                            const rawN = String(it.raw_name || it.nama || it.nama_faktur_supplier || 'Bahan Konveksi').trim();
                            const sat = String(it.satuan || it.satuan_beli || 'Roll').trim();
                            return {
                                id_bahan: '',
                                raw_name: rawN,
                                nama_faktur_supplier: rawN,
                                qty: q,
                                satuan_beli: sat,
                                satuan: sat,
                                harga_satuan: p,
                                total_harga: t,
                                subtotal: t,
                                kategori_estimasi: it.kategori_estimasi || '',
                                mapping_status: 'UNMATCHED',
                                confidence: Number(it.confidence || 85)
                            };
                        });
                        matchItemsWithMaster();
                    }

                    hitungGrandTotalPembelian();
                    cekDuplikasiFakturSupplier();

                    showPopup({
                        type: 'success',
                        title: 'Faktur Terbaca!',
                        message: 'Faktur berhasil dibaca menjadi DRAFT. Seluruh item, volume, dan harga telah terisi otomatis. Silakan tinjau sebelum Verifikasi & Posting.',
                        autoClose: 3500
                    });
                };

                const muatContohFakturPengujian = () => { showPopup({type:'warning',title:'Data contoh tidak tersedia',message:'Gunakan faktur usaha yang sebenarnya. Data contoh tidak dimuat pada ruang operasional.'}); };

                const matchItemsWithMaster = () => {
                    if (!formData.items || !formData.items.length) return;
                    const currentSupplierId = String(formData.id_supplier || '').trim();

                    formData.items.forEach(it => {
                        const rawName = String(it.raw_name || it.nama_faktur_supplier || '').trim();
                        if (!rawName) {
                            it.mapping_status = it.id_bahan ? 'MAPPED' : 'UNMATCHED';
                            it.match_status = it.mapping_status;
                            it.subtotal = it.total_harga || 0;
                            return;
                        }

                        const rawClean = rawName.toLowerCase().replace(/[^a-z0-9]/g, '');

                        // 1. Alias lookup
                        const foundAlias = (materialAliasList.value || []).find(al => {
                            const alSpl = String(al.id_supplier || '').trim();
                            const alRaw = String(al.raw_name || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
                            return (alSpl === currentSupplierId || !alSpl) && alRaw === rawClean;
                        });

                        if (foundAlias && foundAlias.id_bahan) {
                            const bObj = (bahan.value || []).find(b => String(b.id_bahan || b.id) === String(foundAlias.id_bahan));
                            if (bObj) {
                                it.id_bahan = bObj.id_bahan || bObj.id;
                                it.satuan_beli = bObj.satuan_beli || bObj.satuan || it.satuan_beli || 'Roll';
                                it.satuan = it.satuan_beli;
                                it.mapping_status = 'ALIAS';
                                it.match_status = 'ALIAS';
                                it.confidence = 98;
                                it.subtotal = it.total_harga || 0;
                                return;
                            }
                        }

                        // 2. Exact match
                        const exactMatch = (bahan.value || []).find(b => {
                            const bNama = String(b.nama_bahan || b.nama || '').trim().toLowerCase();
                            const bKode = String(b.kode_bahan || b.kode || '').trim().toLowerCase();
                            return bNama === rawName.toLowerCase() || bKode === rawName.toLowerCase();
                        });

                        if (exactMatch) {
                            it.id_bahan = exactMatch.id_bahan || exactMatch.id;
                            it.satuan_beli = exactMatch.satuan_beli || exactMatch.satuan || it.satuan_beli || 'Roll';
                            it.satuan = it.satuan_beli;
                            it.mapping_status = 'EXACT';
                            it.match_status = 'EXACT';
                            it.confidence = 95;
                            it.subtotal = it.total_harga || 0;
                            return;
                        }

                        // 3. Suggested substring match
                        const suggestedMatch = (bahan.value || []).find(b => {
                            const bNamaClean = String(b.nama_bahan || b.nama || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                            return bNamaClean && (bNamaClean.includes(rawClean) || rawClean.includes(bNamaClean));
                        });

                        if (suggestedMatch) {
                            it.id_bahan = suggestedMatch.id_bahan || suggestedMatch.id;
                            it.satuan_beli = suggestedMatch.satuan_beli || suggestedMatch.satuan || it.satuan_beli || 'Roll';
                            it.satuan = it.satuan_beli;
                            it.mapping_status = 'SUGGESTED';
                            it.match_status = 'SUGGESTED';
                            it.confidence = 75;
                            it.subtotal = it.total_harga || 0;
                            return;
                        }

                        // 4. Unmatched
                        if (!it.id_bahan) {
                            it.mapping_status = 'UNMATCHED';
                            it.match_status = 'UNMATCHED';
                            it.confidence = 0;
                        } else {
                            it.mapping_status = 'MAPPED';
                            it.match_status = 'MAPPED';
                        }
                        it.satuan = it.satuan_beli || 'Roll';
                        it.subtotal = it.total_harga || 0;
                    });
                };

                const onMaterialMappedChange = (item) => {
                    if (item.id_bahan) {
                        const bObj = (bahan.value || []).find(b => String(b.id_bahan || b.id) === String(item.id_bahan));
                        if (bObj) {
                            item.satuan_beli = bObj.satuan_beli || bObj.satuan || item.satuan_beli || 'Roll';
                            item.satuan = item.satuan_beli;
                            if (!item.harga_satuan && bObj.harga_beli) {
                                item.harga_satuan = Number(bObj.harga_beli);
                                item.total_harga = Math.round(Number(item.qty || 1) * item.harga_satuan);
                            }
                        }
                        item.mapping_status = 'MAPPED';
                        item.match_status = 'EXACT';
                        item.confidence = 100;
                    } else {
                        item.mapping_status = 'UNMATCHED';
                        item.match_status = 'UNMATCHED';
                        item.confidence = 0;
                    }
                    item.subtotal = item.total_harga || 0;
                    hitungGrandTotalPembelian();
                };

                const onRawNameChange = (it) => {
                    it.nama_faktur_supplier = it.raw_name;
                    matchItemsWithMaster();
                };

                const tambahBarisMaterialPembelian = () => tambahItem('pembelian');
                const hapusBarisMaterialPembelian = (i) => hapusItem(i);
                const bukaTambahSupplierCepat = () => openModal('supplier');

                const setQuickJatuhTempo = (days) => {
                    const dt = new Date();
                    dt.setDate(dt.getDate() + Number(days || 30));
                    const d = String(dt.getDate()).padStart(2, '0');
                    const m = String(dt.getMonth() + 1).padStart(2, '0');
                    const y = dt.getFullYear();
                    formData.jatuh_tempo = `${d}/${m}/${y}`;
                };

                const bukaQuickCreateMaterialFromItem = (item) => {
                    activeItemForQuickMaterial.value = item;
                    cachedPurchaseFormData.value = JSON.parse(JSON.stringify(formData));
                    openModal('bahan');
                    formData.nama = item.raw_name || item.nama_faktur_supplier || '';
                    if (formData.supplier_id === undefined || !formData.supplier_id) {
                        formData.supplier_id = cachedPurchaseFormData.value.id_supplier || (supplier.value.length ? supplier.value[0].id : '');
                    }
                    if (item.satuan_beli) {
                        formData.satuan_beli = item.satuan_beli;
                        formData.satuan = item.satuan_beli;
                    }
                    if (item.harga_satuan) {
                        formData.harga_beli = Number(item.harga_satuan);
                    }
                };

                const recalculateItemSubtotal = (it) => {
                    const q = Number(it.qty || 0);
                    const p = Number(it.harga_satuan || 0);
                    it.total_harga = Math.round(q * p);
                    it.subtotal = it.total_harga;
                    hitungGrandTotalPembelian();
                };

                const hitungGrandTotalPembelian = () => {
                    if (!formData.items || !formData.items.length) {
                        formData.subtotal = 0;
                        formData.total_harga = 0;
                    } else {
                        formData.subtotal = formData.items.reduce((s, it) => s + Number(it.total_harga || 0), 0);
                        formData.total_harga = Math.max(0, formData.subtotal - Number(formData.diskon || 0) + Number(formData.pajak || 0) + Number(formData.ongkir || 0));
                    }
                    formData.total_faktur_terbaca = Number(formData.ocr_total_faktur || formData.total_harga || 0);
                    onPaymentStatusSelect(formData.status_bayar || 'Lunas', false);
                };

                const totalCrossCheckDiff = computed(() => {
                    const ocrTot = Number(formData.ocr_total_faktur || 0);
                    if (!ocrTot) return 0;
                    return (Number(formData.total_harga || 0) - ocrTot);
                });

                const onPaymentStatusSelect = (status, resetNominal = true) => {
                    formData.status_bayar = status;
                    const tot = Number(formData.total_harga || 0);
                    if (status === 'Lunas') {
                        formData.nominal_bayar = tot;
                        formData.sisa_hutang = 0;
                        formData.jatuh_tempo = '';
                    } else if (status === 'Tempo') {
                        formData.nominal_bayar = 0;
                        formData.sisa_hutang = tot;
                        if (!formData.jatuh_tempo || resetNominal) {
                            const dt = new Date();
                            dt.setDate(dt.getDate() + 30);
                            const d = String(dt.getDate()).padStart(2, '0');
                            const m = String(dt.getMonth() + 1).padStart(2, '0');
                            const y = dt.getFullYear();
                            formData.jatuh_tempo = `${d}/${m}/${y}`;
                        }
                    } else if (status === 'DP') {
                        if (resetNominal || Number(formData.nominal_bayar || 0) >= tot || Number(formData.nominal_bayar || 0) <= 0) {
                            formData.nominal_bayar = Math.round(tot / 2);
                        }
                        formData.sisa_hutang = Math.max(0, tot - Number(formData.nominal_bayar || 0));
                        if (!formData.jatuh_tempo) {
                            const dt = new Date();
                            dt.setDate(dt.getDate() + 30);
                            const d = String(dt.getDate()).padStart(2, '0');
                            const m = String(dt.getMonth() + 1).padStart(2, '0');
                            const y = dt.getFullYear();
                            formData.jatuh_tempo = `${d}/${m}/${y}`;
                        }
                    }
                };

                const cekDuplikasiFakturSupplier = () => {
                    const splId = String(formData.id_supplier || '').trim();
                    const noFaktur = String(formData.no_faktur_supplier || '').trim().toUpperCase();
                    if (!splId || !noFaktur) {
                        supplierInvoiceDuplicateWarning.value = '';
                        return;
                    }
                    const dup = (pembelian.value || []).find(p => {
                        if (isEditMode.value && String(p.id) === String(formData.id)) return false;
                        const pSpl = String(p.id_supplier || '').trim();
                        const pNo = String(p.no_faktur_supplier || '').trim().toUpperCase();
                        return pSpl === splId && pNo === noFaktur;
                    });
                    if (dup) {
                        supplierInvoiceDuplicateWarning.value = 'Perhatian: Faktur No "' + noFaktur + '" sudah pernah dicatat di transaksi ' + (dup.id || '') + ' (' + (dup.tanggal || '') + ').';
                    } else {
                        supplierInvoiceDuplicateWarning.value = '';
                    }
                };

                const simpanDraftPembelianLokal = () => {
                    try {
                        const draftObj = {
                            formData: JSON.parse(JSON.stringify(formData)),
                            uploadedInvoiceFile: uploadedInvoiceFile.value,
                            savedAt: new Date().toISOString()
                        };
                        safeStorage.setItem('jl_draft_pembelian', JSON.stringify(draftObj));
                        showPopup({
                            type: 'success',
                            title: 'Draft Tersimpan',
                            message: 'Draft faktur pembelian berhasil disimpan di peramban lokal Anda.',
                            autoClose: 2000
                        });
                    } catch(e) {
                        console.error("Gagal simpan draft:", e);
                    }
                };

                const eksekusiPostingPembelian = () => {
                    if (!formData.id_supplier) {
                        showPopup({ type: 'warning', title: 'Supplier Wajib', message: 'Silakan pilih Supplier/Mitra terlebih dahulu.' });
                        return;
                    }
                    if (!formData.items || !formData.items.length) {
