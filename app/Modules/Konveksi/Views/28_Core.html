                        showPopup({ type: 'warning', title: 'Item Kosong', message: 'Faktur harus memiliki minimal 1 item material.' });
                        return;
                    }

                    // Validasi item: jika belum dimapping, sistem akan otomatis mendaftarkannya sebagai bahan baru
                    for (let i = 0; i < formData.items.length; i++) {
                        const it = formData.items[i];
                        if (Number(it.qty || 0) <= 0) {
                            showPopup({ type: 'warning', title: 'Volume Qty Tidak Valid', message: 'Baris #' + (i + 1) + ' harus memiliki kuantitas lebih dari 0.' });
                            return;
                        }
                    }

                    const nomBayar = Number(formData.nominal_bayar || 0);
                    if (nomBayar > 0) {
                        if (!formData.id_rekening) {
                            showPopup({ type: 'warning', title: 'Rekening Kas Wajib', message: 'Karena ada kas keluar sebesar Rp ' + formatRupiah(nomBayar) + ', silakan pilih Akun Kas.' });
                            return;
                        }
                        const saldoAda = getSaldoRekening(formData.id_rekening);
                        if (saldoAda < nomBayar) {
                            const rekObj = (rekening.value || []).find(r => String(r.id) === String(formData.id_rekening));
                            const namaRek = rekObj ? (rekObj.nama || rekObj.nama_bank || '') : 'Kas';
                            showPopup({
                                type: 'warning',
                                title: 'Saldo Kas Tidak Mencukupi',
                                message: 'Saldo kas ' + namaRek + ' saat ini (' + formatRupiah(saldoAda) + ') tidak mencukupi untuk pembayaran sebesar ' + formatRupiah(nomBayar) + '.'
                            });
                            return;
                        }
                    }

                    if ((formData.status_bayar === 'Tempo' || formData.status_bayar === 'DP') && Number(formData.sisa_hutang || 0) > 0 && !formData.jatuh_tempo) {
                        showPopup({ type: 'warning', title: 'Jatuh Tempo Wajib', message: 'Silakan isi tanggal jatuh tempo hutang pembelian.' });
                        return;
                    }

                    isPostingPurchase.value = true;
                    showPopup({
                        type: 'info',
                        loading: true,
                        title: 'Posting Faktur Pembelian...',
                        message: 'Memproses mutasi stok, buku besar, keuangan, dan penyimpanan dokumen ke storage server...',
                        autoClose: 0
                    });

                    const payload = {
                        is_edit: isEditMode.value,
                        id_transaksi: isEditMode.value ? (formData.id || '') : '',
                        id: isEditMode.value ? (formData.id || '') : '',
                        tanggal: formData.tanggal,
                        id_supplier: formData.id_supplier,
                        no_faktur_supplier: formData.no_faktur_supplier || '',
                        status_bayar: formData.status_bayar || 'Lunas',
                        id_rekening: formData.id_rekening || '',
                        nominal_bayar: nomBayar,
                        sisa_hutang: Number(formData.sisa_hutang || 0),
                        jatuh_tempo: formData.jatuh_tempo || '',
                        catatan: formData.catatan || '',
                        ocr_raw_text: formData.ocr_raw_text || '',
                        ocr_confidence: Number(formData.ocr_confidence || 0),
                        ocr_total_faktur: Number(formData.ocr_total_faktur || 0),
                        file_invoice: uploadedInvoiceFile.value ? {
                            base64: uploadedInvoiceFile.value.base64,
                            mimeType: uploadedInvoiceFile.value.type,
                            fileName: uploadedInvoiceFile.value.name
                        } : null,
                        items: formData.items.map(it => {
                            const bObj = (bahan.value || []).find(b => String(b.id_bahan || b.id) === String(it.id_bahan));
                            const isi = bObj ? Number(bObj.isi_satuan_beli || 1) : 1;
                            const satPakai = bObj ? (bObj.satuan_pakai || bObj.satuan || it.satuan || 'Roll') : (it.satuan || 'Roll');
                            const satBeli = String(it.satuan || it.satuan_beli || (bObj ? bObj.satuan_beli : 'Roll')).trim();
                            const qty = Number(it.qty || 1);
                            const hrg = Number(it.harga_satuan || 0);
                            const tot = Number(it.subtotal || it.total_harga || (qty * hrg));
                            return {
                                id_bahan: it.id_bahan || '',
                                kode_bahan: bObj ? (bObj.kode_bahan || bObj.kode || '') : '',
                                raw_name: it.raw_name || it.nama_faktur_supplier || (bObj ? bObj.nama : ''),
                                nama_faktur_supplier: it.nama_faktur_supplier || it.raw_name || (bObj ? bObj.nama : ''),
                                qty: qty,
                                satuan_beli: satBeli,
                                satuan: satBeli,
                                isi_satuan_beli: isi,
                                satuan_pakai: satPakai,
                                qty_satuan_pakai: qty * isi,
                                harga_satuan: hrg,
                                total_harga: tot,
                                subtotal: tot,
                                kategori_estimasi: it.kategori_estimasi || ''
                            };
                        }),
                        operator: loginData.nama || userRole.value || 'Admin Konveksi'
                    };

                    if (window.jlApi && window.jlApi.run) {
                        window.jlApi.run
                            .withSuccessHandler((res) => {
                                isPostingPurchase.value = false;
                                const parsed = typeof res === 'string' ? JSON.parse(res || '{}') : (res || {});
                                if (parsed.status === 'success') {
                                    const tr = parsed.transaksi || parsed.purchase;
                                    if (tr) {
                                        if (isEditMode.value) {
                                            const idx = pembelian.value.findIndex(p => String(p.id) === String(tr.id));
                                            if (idx > -1) pembelian.value[idx] = tr;
                                        } else {
                                            pembelian.value.unshift(tr);
                                        }
                                    }

                                    // Sinkronisasi material baru yang dibuat otomatis oleh server
                                    if (Array.isArray(parsed.new_materials) && parsed.new_materials.length) {
                                        parsed.new_materials.forEach(nm => {
                                            const exBIdx = bahan.value.findIndex(b => String(b.id_bahan || b.id) === String(nm.id_bahan || nm.id));
                                            if (exBIdx === -1) bahan.value.unshift(nm);
                                            else bahan.value[exBIdx] = Object.assign({}, bahan.value[exBIdx], nm);
                                        });
                                    }

                                    if (Array.isArray(parsed.stok_updates)) {
                                        parsed.stok_updates.forEach(su => {
                                            const bIdx = bahan.value.findIndex(b => String(b.id_bahan || b.id) === String(su.id_bahan));
                                            if (bIdx > -1) {
                                                bahan.value[bIdx].stok = su.stok_setelah;
                                                if (su.harga_terakhir) {
                                                    bahan.value[bIdx].harga_beli = su.harga_terakhir;
                                                    bahan.value[bIdx].harga_satuan_pakai = su.harga_satuan_pakai;
                                                }
                                            }
                                        });
                                    }

                                    if (Array.isArray(parsed.mutasi_entries)) {
                                        parsed.mutasi_entries.forEach(me => mutasiStok.value.unshift(me));
                                    }

                                    if (Array.isArray(parsed.bahan_hpp_updates)) {
                                        parsed.bahan_hpp_updates.forEach(hu => {
                                            const hIdx = (bahanHPP.value || []).findIndex(h => String(h.id_bahan_gudang || h.id_bahan) === String(hu.id_bahan_gudang));
                                            if (hIdx > -1) {
                                                bahanHPP.value[hIdx].harga_beli_terakhir = hu.harga_beli_terakhir;
                                                bahanHPP.value[hIdx].harga_rata_rata = hu.harga_rata_rata;
                                                if (hu.status) bahanHPP.value[hIdx].status = hu.status;
                                            }
                                        });
                                    }

                                    if (parsed.jurnal_kas) {
                                        keuangan.value.unshift(parsed.jurnal_kas);
                                        const rIdx = rekening.value.findIndex(r => String(r.id) === String(parsed.jurnal_kas.id_rekening));
                                        if (rIdx > -1) {
                                            rekening.value[rIdx].saldo = Number(rekening.value[rIdx].saldo || 0) - Number(parsed.jurnal_kas.nominal || 0);
                                        }
                                    }

                                    if (Array.isArray(parsed.new_aliases) && parsed.new_aliases.length) {
                                        parsed.new_aliases.forEach(na => {
                                            const exIdx = materialAliasList.value.findIndex(a => String(a.id_supplier) === String(na.id_supplier) && String(a.raw_name).toLowerCase() === String(na.raw_name).toLowerCase());
                                            if (exIdx > -1) materialAliasList.value[exIdx] = na;
                                            else materialAliasList.value.push(na);
                                        });
                                    }

                                    simpanCacheLokal();
                                    closePopup();
                                    isModalOpen.value = false;

                                    lastPostedPurchaseResult.value = {
                                        id_transaksi: tr.id,
                                        no_faktur_supplier: tr.no_faktur_supplier || '-',
                                        tanggal: tr.tanggal,
                                        nama_supplier: getSupplierName(tr.id_supplier),
                                        status_bayar: tr.status_bayar,
                                        total_bersih: tr.total_harga,
                                        nominal_bayar: tr.nominal_bayar || 0,
                                        sisa_hutang: tr.sisa_hutang || 0,
                                        items_count: (tr.items || []).length,
                                        drive_file_id: tr.drive_file_id || '',
                                        link_drive: tr.link_drive || ''
                                    };

                                    isModalSuksesPembelianOpen.value = true;
                                    addLog('Faktur Beli ' + tr.id + ' diposting & disinkronkan (' + tr.status_bayar + ')');
                                } else {
                                    showPopup({ type: 'error', title: 'Gagal Posting Faktur', message: parsed.message || 'Terjadi kesalahan pada sistem backend.' });
                                }
                            })
                            .withFailureHandler((err) => {
                                isPostingPurchase.value = false;
                                showPopup({ type: 'error', title: 'Kesalahan Sistem Server', message: err.message || String(err) });
                            })
                            .savePurchaseInvoiceServerRpc(payload);
                    } else {
                        isPostingPurchase.value = false;
                        showPopup({type:'error',title:'Belum tersimpan',message:'Server tidak tersedia. Faktur belum diposting.'});
                    }
                };

                const retryUploadDokumenPembelian = (pembelianItem) => {
                    const el = document.createElement('input');
                    el.type = 'file';
                    el.accept = 'image/*,application/pdf';
                    el.onchange = (e) => {
                        const file = e.target.files && e.target.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = (re) => {
                            const dataUrl = re.target.result;
                            const base64 = dataUrl.split(',')[1];
                            showPopup({
                                type: 'info',
                                loading: true,
                                title: 'Mengunggah Berkas Faktur...',
                                message: 'Menyimpan berkas faktur ke storage server...',
                                autoClose: 0
                            });
                            if (window.jlApi && window.jlApi.run) {
                                window.jlApi.run
                                    .withSuccessHandler((res) => {
                                        closePopup();
                                        const parsed = typeof res === 'string' ? JSON.parse(res || '{}') : (res || {});
                                        if (parsed.status === 'success') {
                                            pembelianItem.link_drive = parsed.link_drive;
                                            pembelianItem.drive_file_id = parsed.drive_file_id;
                                            simpanCacheLokal();
                                            showPopup({ type: 'success', title: 'Upload Berhasil', message: 'Berkas faktur berhasil disimpan ke Drive.' });
                                        } else {
                                            showPopup({ type: 'error', title: 'Upload Gagal', message: parsed.message || 'Gagal menyimpan ke Drive.' });
                                        }
                                    })
                                    .withFailureHandler((err) => {
                                        closePopup();
                                        showPopup({ type: 'error', title: 'Kesalahan Server', message: err.message || String(err) });
                                    })
                                    .retryUploadPurchaseDocumentServerRpc({
                                        id_transaksi: pembelianItem.id,
                                        file_invoice: { base64, mimeType: file.type || 'image/jpeg', fileName: file.name }
                                    });
                            }
                        };
                        reader.readAsDataURL(file);
                    };
                    el.click();
                };

                const filteredBahan = computed(() => (bahan.value || []).filter(i => {
                    const stokVal = Number(i.stok !== undefined ? i.stok : (i.stok_awal || 0));

                // KPI Counters - Master Produk Legacy & Bahan
                const totalProdukCount = computed(() => produk.value.length);

                // Helper normalisasi nomor WhatsApp standar internasional
                const normalizeWhatsAppNumber = (number) => {
                    if (!number) return '';
                    let cln = String(number).replace(/\D/g, '');
                    if (cln.startsWith('0')) {
                        cln = '62' + cln.substring(1);
                    } else if (cln.startsWith('8')) {
                        cln = '62' + cln;
                    }
                    return cln;
                };

                    let url = "https://wa.me/" + phone + "?text=" + encodedText;
                    if (!phone) url = "https://wa.me/?text=" + encodedText;
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { if (document.body.contains(a)) document.body.removeChild(a); }, 100);

                const savePdfAndGetDocumentLink = (doc, fileName, documentType, referenceId, makeShareable = true) => {
                    return new Promise((resolve, reject) => {
                        try {
                            if (!doc) {
                                reject(new Error('Dokumen PDF tidak tersedia.'));
                                return;
                            }
                            if (!window.jlApi || !window.jlApi.run) {
                                reject(new Error('Koneksi backend API PHP tidak terdeteksi. Silakan refresh aplikasi.'));
                                return;
                            }
                            const base64 = doc.output('datauristring');
                            window.jlApi.run
                                .withSuccessHandler((response) => {
                                    if (response && response.status === 'success' && response.drive_url) {
                                        resolve(response);
                                    } else {
                                        reject(new Error(response?.message || 'URL PDF storage server tidak tersedia.'));
                                    }
                                })
                                .withFailureHandler((error) => {
                                    reject(new Error(error?.message || 'Gagal menyimpan PDF ke storage server.'));
                                })
                                .saveDocumentFileServer(base64, fileName, documentType, referenceId, makeShareable);

                            reject(error);
                        }
                    });

                const bagikanDokumenWhatsApp = async ({
                    tipe,
                    data,
                    phone,
                    docKey,
                    docName,
                    messageBuilder,
                    pdfBuilder,
                    tabName,
                    tableRef
                }) => {
                    if (isSharingWhatsApp.value) return;
                    if (!data) {
                        showPopup({
                            type: 'warning',
                            title: 'Data Kosong',
                            message: 'Dokumen transaksi tidak ditemukan atau data kosong.'

                    isSharingWhatsApp.value = true;
                    sharingDocKey.value = currentDocKey;

                            });

                                throw new Error('PDF builder tidak tersedia untuk tipe: ' + tipe);
                            }

                            if (!doc) {
                                throw new Error('Gagal menghasilkan dokumen PDF.');

                            data.pdf_needs_refresh = false;

                                try {
                                    syncKeDatabase(tabName, tableRef.value);

                                    console.warn('Background sync PDF metadata dilewati:', syncErr);
                                }
                            }
                        }

                            throw new Error('Link PDF storage server tidak valid atau belum berformat resmi.');
                        }

                        const cleanPhone = normalizeWhatsAppNumber(phone);
                        const waMsg = messageBuilder(driveUrl);

                        closePopup();
                        showNotification('PDF berhasil disiapkan. Membuka WhatsApp...');
                        openWhatsApp(cleanPhone, waMsg);

                            type: 'error',
                            title: 'Gagal Menyiapkan PDF',
                            message: 'Link PDF storage server tidak dapat dibuat: ' + (err?.message || err),

                        else if (type === 'pembelian') {

                            formData.status_bayar = item.status_bayar || 'Lunas';
                            formData.nominal_bayar = Number(item.nominal_bayar !== undefined ? item.nominal_bayar : (formData.status_bayar === 'Lunas' ? item.total_harga : 0));
                            formData.sisa_hutang = Number(item.sisa_hutang !== undefined ? item.sisa_hutang : (formData.status_bayar === 'Tempo' ? item.total_harga : 0));
                            formData.jatuh_tempo = item.jatuh_tempo || '';
                            formData.no_faktur_supplier = item.no_faktur_supplier || '';
                            formData.catatan = item.catatan || '';
                            formData.link_drive = item.link_drive || '';
                            formData.drive_file_id = item.drive_file_id || '';
                            
                            let parsedItems = [];
                            if (item.items) {
                                try {
                                    parsedItems = typeof item.items === 'string' ? JSON.parse(item.items) : JSON.parse(JSON.stringify(item.items));
                                } catch(e) { parsedItems = []; }
                            }
                            if (!parsedItems.length) {
                                parsedItems = [{ id_bahan: item.id_bahan || '', qty: item.qty || 1, total_harga: item.total_harga || 0 }];
                            }
                            formData.items = parsedItems.map(it => ({
                                id_bahan: it.id_bahan || '',
                                raw_name: it.raw_name || it.nama_faktur_supplier || getBahanName(it.id_bahan),
                                nama_faktur_supplier: it.nama_faktur_supplier || it.raw_name || '',
                                qty: Number(it.qty || 1),
                                satuan_beli: it.satuan_beli || it.satuan || 'Roll',
                                harga_satuan: Number(it.harga_satuan || (it.qty ? Math.round(Number(it.total_harga || 0) / Number(it.qty)) : 0)),
                                total_harga: Number(it.total_harga || 0),
                                mapping_status: 'MAPPED',
                                confidence: 100
                            }));
                            hitungGrandTotalPembelian();
                        }
                        else if(type==='distribusi' || type==='potong' || type==='jahit') { if(!formData.items||!formData.items.length) { if(type==='potong') formData.items = [{id_produk:formData.id_produk,qty:formData.qty}]; else if(type==='jahit') formData.items = [{id_potong:formData.id_potong,id_produk:formData.id_produk,qty:formData.qty}]; else formData.items = [{id_bahan:formData.id_bahan,qty:formData.qty}]; } if(type==='jahit' && formData.items) { formData.items.forEach(it => { it.ref_key = it.id_potong + '|' + it.id_produk + '|' + (it.qty || 9999); it.max_qty = it.qty; }); } }
                        modalTitle.value = modalTitle.value || ('Edit Data ' + type); 
                    }
                    isModalOpen.value = true; initCalendar(); 
                };
                
                const closeModal = () => { isModalOpen.value = false; };
                const openConfirm = (tit, msg, act, confirmBtn = 'Ya, Hapus') => {
                    showPopup({
                        type: 'confirm',
                        title: tit || 'Konfirmasi Tindakan',
                        message: msg || 'Apakah Anda yakin ingin melanjutkan tindakan ini?',
                        confirmText: confirmBtn,
                        cancelText: 'Batal',
                        onConfirm: act
                    });
                };
                const closeConfirm = closePopup;
                const executeConfirm = handlePopupConfirm;
                window.openConfirm = openConfirm;
                window.closeConfirm = closeConfirm;

                const tambahItem = (t) => { 
                    if (!Array.isArray(formData.items)) {
                        formData.items = [];
                    }
                    if(t==='pembelian') {
                        const defBahan = bahan.value.length ? bahan.value[0] : null;
                        const defPrice = defBahan ? Number(defBahan.harga_beli || 0) : 0;
                        formData.items.push({ 
                            id_bahan: defBahan ? (defBahan.id_bahan || defBahan.id) : '', 
                            raw_name: '',
                            nama_faktur_supplier: '',
                            qty: 1, 
                            satuan_beli: defBahan ? (defBahan.satuan_beli || defBahan.satuan || 'Roll') : 'Roll',
                            satuan: defBahan ? (defBahan.satuan_beli || defBahan.satuan || 'Roll') : 'Roll',
                            harga_satuan: defPrice,
                            total_harga: defPrice,
                            subtotal: defPrice,
                            mapping_status: 'MAPPED',
                            match_status: 'MAPPED',
                            confidence: 100
                        }); 
                        hitungGrandTotalPembelian();
                    }
                    else if(t==='distribusi') formData.items.push({ id_bahan: bahan.value.length?bahan.value[0].id:'', qty: 1 }); 
                    else if(t==='potong') formData.items.push({ id_produk: produk.value.length?produk.value[0].id:'', qty: 1 }); 
                    else if(t==='jahit') {
                        const defOpt = availablePotongItems.value.length ? availablePotongItems.value[0] : null;
                        formData.items.push({ 
                            ref_key: defOpt ? (defOpt.id_potong + '|' + defOpt.id_produk + '|' + defOpt.max_qty) : '', 
                            id_potong: defOpt ? defOpt.id_potong : '', 
                            id_produk: defOpt ? defOpt.id_produk : '', 
                            qty: defOpt ? defOpt.max_qty : 1, 
                            max_qty: defOpt ? defOpt.max_qty : 9999 
                        }); 
                    } 
                };
                const hapusItem = (idx) => { 
                    formData.items.splice(idx, 1); 
                    if (modalType.value === 'pembelian') {
                        hitungGrandTotalPembelian();
                    }
                };
                const tambahItemVarian = () => { 
                    const idx = (formData.variasi || []).length + 1;
                    const vId = generateUniqueIdVariasi(formData.id_produk, idx);
                    formData.variasi.push({ id: vId, id_variasi: vId, kode: '', warna: '', stok: 0, foto: '', barcode: generateSmartBarcode() }); 
                    updateSemuaSKUVarian(); 
                };
                const hapusItemVarian = (idx) => { formData.variasi.splice(idx, 1); updateSemuaSKUVarian(); };

                const updateHarga = (idx) => { const it = formData.items[idx]; const b = bahan.value.find(x => x.id == it.id_bahan); if(b && it.qty) it.total_harga = Number(b.harga_beli||0) * Number(it.qty); };
                
                const updateKasbonLimits = () => { 
                    if(!formData.id_dokumen) return; 
                    let spk = formData.tipe_spk==='potong'?potong.value.find(p=>p.id==formData.id_dokumen):jahit.value.find(p=>p.id==formData.id_dokumen); 
                    if(spk) { 
                        formData.temp_upah = getUpahTotalSPK(spk, formData.tipe_spk); 
                        formData.kasbon_lama = Number(spk.kasbon)||0; 
                        if (isEditMode.value && modalType.value === 'kasbon_global') {
                            const existingKasbon = kasbonList.value.find(k => k.id == formData.id);
                            if (existingKasbon && existingKasbon.id_dokumen == formData.id_dokumen) { formData.kasbon_lama = Math.max(0, formData.kasbon_lama - Number(existingKasbon.nominal)); }
                        }
                    } 
                };

                
                // =========================================================================
                // MODUL: MASTER STOK, PEMBELIAN VENDOR & HUTANG USAHA (ENTERPRISE ENGINE)
                // =========================================================================

                // A. Sinkronisasi Awal Master Stok dari Master Produk jika masih kosong
                const sinkronkanMasterStokDariProduk = () => {
                    if (!Array.isArray(produk.value) || !produk.value.length) return;
                    const existingSkus = new Set(masterStok.value.map(s => String(s.kode_sku || '').trim().toUpperCase()));
                    let hasNew = false;
                    
                    produk.value.forEach(p => {
                        const namaProduk = p.nama || 'Produk';
                        const kategori = p.kategori || 'Tas';
                        const satuan = p.satuan || 'Pcs';
                        const variasiList = Array.isArray(p.variasi) && p.variasi.length ? p.variasi : [{ nama: p.warna || 'Standar', sku: p.kode || p.sku || ('SKU-' + (p.id || '01')), barcode: p.barcode || '', id_variasi: p.id_variasi || '' }];
                        
                        variasiList.forEach((v, idx) => {
                            const skuCode = String(v.sku || (p.sku ? p.sku + '-' + (idx + 1) : 'SKU-' + p.id + '-' + (idx + 1))).trim().toUpperCase();
                            const itemBarcode = v.barcode || p.barcode || '';
                            const prodId = p.id_produk || p.parent_product_id || p.id || '';
                            const varId = v.id_variasi || v.id || '';
                            let stkId = v.id_stok_item || p.id_stok_item || '';

                            if (!existingSkus.has(skuCode)) {
                                if (!stkId) stkId = generateUniqueIdStokItem();
                                v.id_stok_item = stkId;
                                const hppAwal = Number(p.hpp_total || p.biaya_material || 0);
                                masterStok.value.push({
                                    id_stok_item: stkId,
                                    kode_sku: skuCode,
                                    id_produk: prodId,
                                    id_variasi: varId,
                                    nama_produk: namaProduk,
                                    varian_warna: v.nama || v.warna || 'Standar',
                                    kategori: kategori,
                                    barcode: itemBarcode,
                                    stok_awal: Number(v.stok || p.stok || 0),
                                    masuk_jahit: 0,
                                    masuk_vendor: 0,
                                    keluar_penjualan: 0,
                                    stok_akhir: Number(v.stok || p.stok || 0),
                                    satuan: satuan,
                                    hpp_rata_rata: hppAwal,
                                    total_valuasi_stok: Number(v.stok || p.stok || 0) * hppAwal,
                                    min_alert: 20,
                                    status_stok: Number(v.stok || p.stok || 0) > 20 ? 'Aman' : (Number(v.stok || p.stok || 0) > 0 ? 'Menipis' : 'Habis'),
                                    id_gudang: 'GDG-UTAMA',
                                    last_updated: new Date().toISOString()
                                });
                                existingSkus.add(skuCode);
                                hasNew = true;
                            } else {
                                const existItem = masterStok.value.find(s => String(s.kode_sku || '').trim().toUpperCase() === skuCode);
                                if (existItem) {
                                    if (!existItem.id_stok_item) {
                                        if (!stkId) stkId = generateUniqueIdStokItem();
                                        existItem.id_stok_item = stkId;
                                        v.id_stok_item = stkId;
                                        hasNew = true;
                                    } else if (!v.id_stok_item) {
                                        v.id_stok_item = existItem.id_stok_item;
                                    }
                                    if (!existItem.id_gudang) {
                                        existItem.id_gudang = 'GDG-UTAMA';
                                        hasNew = true;
                                    }
                                    if (!existItem.barcode && itemBarcode) {
                                        existItem.barcode = itemBarcode;
                                        hasNew = true;
                                    }
                                    if (!existItem.id_produk && prodId) {
                                        existItem.id_produk = prodId;
                                        hasNew = true;
                                    }
                                    if (!existItem.id_variasi && varId) {
                                        existItem.id_variasi = varId;
                                        hasNew = true;
                                    }
                                }
                            }
                        });
                    });
                    if (hasNew) {
                        syncKeDatabase('Master_Stok', masterStok.value);
                    }
                };

                // Watch produk untuk inisialisasi awal stok
                watch(() => produk.value.length, (newLen) => {
                    if (newLen > 0 && masterStok.value.length === 0) {
                        sinkronkanMasterStokDariProduk();
                    }
                }, { immediate: true });

                // Computed: Filtered Master Stok
                const filteredMasterStok = computed(() => {
                    let list = masterStok.value.slice();
                    if (searchMasterStok.value) {
                        const q = searchMasterStok.value.toLowerCase().trim();
                        list = list.filter(s => 
                            String(s.nama_produk || '').toLowerCase().includes(q) ||
                            String(s.kode_sku || '').toLowerCase().includes(q) ||
                            String(s.id_stok_item || '').toLowerCase().includes(q) ||
                            String(s.barcode || '').toLowerCase().includes(q) ||
                            String(s.id_produk || '').toLowerCase().includes(q) ||
                            String(s.id_variasi || '').toLowerCase().includes(q) ||
                            String(s.varian_warna || '').toLowerCase().includes(q) ||
                            String(s.kategori || '').toLowerCase().includes(q)
                        );
                    }
                    if (filterStatusStok.value === 'aman') {
                        list = list.filter(s => Number(s.stok_akhir || 0) > Number(s.min_alert || 20));
                    } else if (filterStatusStok.value === 'menipis') {
                        list = list.filter(s => Number(s.stok_akhir || 0) > 0 && Number(s.stok_akhir || 0) <= Number(s.min_alert || 20));
                    } else if (filterStatusStok.value === 'habis') {
                        list = list.filter(s => Number(s.stok_akhir || 0) <= 0);
                    }
                    return list;
                });

                // Computed: KPI Master Stok
                const kpiMasterStok = computed(() => {
                    const all = masterStok.value;
                    let totalPcs = 0;
                    let totalValuasi = 0;
                    let countKritis = 0;
                    let totalJahit = 0;
                    let totalVendor = 0;
                    
                    all.forEach(s => {
                        const akhir = Number(s.stok_akhir || 0);
                        const hpp = Number(s.hpp_rata_rata || 0);
                        const min = Number(s.min_alert || 20);
                        const jahit = Number(s.masuk_jahit || 0);
                        const vendor = Number(s.masuk_vendor || 0);
                        
                        totalPcs += akhir;
                        totalValuasi += (akhir * hpp);
                        if (akhir <= min) countKritis++;
                        totalJahit += jahit;
                        totalVendor += vendor;
                    });
                    
                    const sumAsal = totalJahit + totalVendor;
                    const persenJahit = sumAsal > 0 ? Math.round((totalJahit / sumAsal) * 100) : 50;
                    const persenVendor = sumAsal > 0 ? (100 - persenJahit) : 50;
                    
                    return { totalPcs, totalValuasi, countKritis, persenJahit, persenVendor };
                });

                // Helper: Buka Modal Kartu Stok (Berbasis id_stok_item dengan fallback SKU)
                const openModalKartuStok = (skuItem) => {
                    modalKartuStokState.sku = skuItem;
                    const stockId = String(skuItem?.id_stok_item || '').trim().toUpperCase();
                    const skuCode = String(skuItem?.kode_sku || '').toUpperCase();
                    modalKartuStokState.mutasi = mutasiStok.value
                        .filter(m => {
                            if (stockId && m.id_stok_item) {
                                return String(m.id_stok_item).trim().toUpperCase() === stockId;
                            }
                            return String(m.kode_sku || '').toUpperCase() === skuCode;
                        })
                        .sort((a, b) => new Date(b.tanggal || 0) - new Date(a.tanggal || 0));
                    modalKartuStokState.isOpen = true;
                };

                // Helper: Buka Modal Stock Opname
                const openModalStockOpname = (skuItem = null) => {
                    sinkronkanMasterStokDariProduk();
                    const target = skuItem || masterStok.value[0];
                    modalStockOpnameState.form = {
                        kode_sku: target ? target.kode_sku : '',
                        stok_sistem: target ? Number(target.stok_akhir || 0) : 0,
                        stok_aktual: target ? Number(target.stok_akhir || 0) : 0,
                        alasan: 'Opname Fisik Rutin'
                    };
                    modalStockOpnameState.error = '';
                    modalStockOpnameState.isOpen = true;
                };

                const onOpnameSkuChange = () => {
                    const found = masterStok.value.find(s => s.kode_sku === modalStockOpnameState.form.kode_sku);
                    if (found) {
                        modalStockOpnameState.form.stok_sistem = Number(found.stok_akhir || 0);
                        modalStockOpnameState.form.stok_aktual = Number(found.stok_akhir || 0);
                    }
                };

                const submitStockOpname = async () => {
                    try {
                        const { kode_sku, stok_sistem, stok_aktual, alasan } = modalStockOpnameState.form;
                        const idx = masterStok.value.findIndex(s => s.kode_sku === kode_sku);
                        if (idx === -1) throw new Error('SKU tidak ditemukan dalam master stok.');
                        
                        const selisih = Number(stok_aktual) - Number(stok_sistem);
                        const item = masterStok.value[idx];
                        if (!item.id_stok_item) item.id_stok_item = generateUniqueIdStokItem();
                        if (!item.id_gudang) item.id_gudang = 'GDG-UTAMA';

                        item.stok_akhir = Number(stok_aktual);
                        item.total_valuasi_stok = item.stok_akhir * Number(item.hpp_rata_rata || 0);
                        item.status_stok = item.stok_akhir > Number(item.min_alert || 20) ? 'Aman' : (item.stok_akhir > 0 ? 'Menipis' : 'Habis');
                        item.last_updated = new Date().toISOString();
                        
                        // Selaraskan ke Produk.stok
                        if (Array.isArray(produk.value)) {
                            produk.value.forEach(p => {
                                const pSku = String(p.kode || p.sku || '').trim().toUpperCase();
                                const pStkId = String(p.id_stok_item || '').trim().toUpperCase();
                                if ((pSku && pSku === String(item.kode_sku || '').toUpperCase()) || (pStkId && pStkId === String(item.id_stok_item || '').toUpperCase())) {
                                    p.stok = item.stok_akhir;
                                    if (!p.id_stok_item) p.id_stok_item = item.id_stok_item;
                                }
                            });
                        }

                        // Catat ke Mutasi_Stok (Single Inventory Ledger)
                        const jenisMutasiOpname = selisih > 0 ? 'IN_ADJUSTMENT' : (selisih < 0 ? 'OUT_ADJUSTMENT' : 'ADJUSTMENT');
                        const nowD = new Date();
                        const mutasiBaru = {
                            id_mutasi: 'MUT-OPN-' + Date.now(),
                            tanggal: nowD.toISOString().split('T')[0],
                            waktu: nowD.toTimeString().split(' ')[0],
                            id_stok_item: item.id_stok_item || '',
                            id_produk: item.id_produk || '',
                            kode_sku: item.kode_sku,
                            nama_produk: item.nama_produk,
                            varian_warna: item.varian_warna,
                            id_gudang: item.id_gudang || 'GDG-UTAMA',
                            jenis_mutasi: jenisMutasiOpname,
                            no_referensi: 'OPNAME-' + nowD.toISOString().split('T')[0],
                            pihak_terkait: 'Koreksi: ' + alasan,
                            qty_masuk: selisih > 0 ? selisih : 0,
                            qty_keluar: selisih < 0 ? Math.abs(selisih) : 0,
                            stok_sebelum: Number(stok_sistem),
                            stok_setelah: item.stok_akhir,
                            saldo_berjalan: item.stok_akhir,
                            hpp_satuan: item.hpp_rata_rata,
                            total_nilai: Math.abs(selisih) * Number(item.hpp_rata_rata || 0),
                            sumber_modul: 'OPNAME',
                            jenis_referensi: 'OPNAME',
                            id_referensi: 'OPN-' + Date.now(),
                            idempotency_key: 'STOCK|OPNAME|' + Date.now() + '|' + (item.id_stok_item || item.kode_sku),
                            operator: userRole.value || 'Admin',
                            created_at: nowD.toISOString()
                        };
                        mutasiStok.value.unshift(mutasiBaru);
                        
                        modalStockOpnameState.isOpen = false;
                        showNotification('Stock opname berhasil disimpan. Saldo stok diperbarui!', 'success');
                        syncMultiTabs({
                            'Master_Stok': masterStok.value,
                            'Mutasi_Stok': mutasiStok.value,
                            'Produk': produk.value
                        });
                    } catch(e) {
                        modalStockOpnameState.error = e?.message || 'Gagal menyimpan opname.';
                    }
                };

                // B. PEMBELIAN VENDOR & PENGADAAN MAKLOON
                const supplierVendorList = computed(() => {
                    if (!Array.isArray(supplier.value)) return [];
                    return supplier.value.filter(s => {
                        const kat = String(s.kategori || s.tipe || '').toLowerCase();
                        return kat.includes('vendor') || kat.includes('makloon') || kat.includes('jahit') || kat.includes('tas');
                    }).concat(supplier.value.filter(s => {
                        const kat = String(s.kategori || s.tipe || '').toLowerCase();
                        return !(kat.includes('vendor') || kat.includes('makloon') || kat.includes('jahit') || kat.includes('tas'));
                    }));
                });

                const produkListForVendor = computed(() => {
                    const list = [];
                    if (!Array.isArray(produk.value)) return list;
                    produk.value.forEach(p => {
                        const variasiList = Array.isArray(p.variasi) && p.variasi.length ? p.variasi : [{ nama: 'Standar', sku: p.sku || ('SKU-' + p.id) }];
                        variasiList.forEach((v, idx) => {
                            const skuCode = v.sku || (p.sku ? p.sku + '-' + (idx + 1) : 'SKU-' + p.id);
                            list.push({
                                sku: skuCode,
                                id_produk: p.id,
                                nama: p.nama,
                                warna: v.nama || v.warna || 'Standar',
                                kategori: p.kategori || 'Tas',
                                hpp_acuan: Number(p.hpp_total || p.biaya_material || 0)
                            });
                        });
                    });
                    return list;
                });

                const filteredPembelianVendor = computed(() => {
                    let list = pembelianVendor.value.slice();
                    if (searchPembelianVendor.value) {
                        const q = searchPembelianVendor.value.toLowerCase().trim();
                        list = list.filter(pv => 
                            String(pv.no_po_vendor || '').toLowerCase().includes(q) ||
                            String(pv.nama_vendor || '').toLowerCase().includes(q) ||
                            String(pv.nama_produk || '').toLowerCase().includes(q)
                        );
                    }
                    if (filterStatusBayarVendor.value !== 'semua') {
                        list = list.filter(pv => pv.status_bayar === filterStatusBayarVendor.value);
                    }
                    if (filterStatusBarangVendor.value !== 'semua') {
                        if (filterStatusBarangVendor.value === 'proses') {
                            list = list.filter(pv => pv.status_barang !== 'Diterima Gudang');
                        } else {
                            list = list.filter(pv => pv.status_barang === filterStatusBarangVendor.value);
                        }
                    }
                    return list.sort((a, b) => new Date(b.tanggal_po || 0) - new Date(a.tanggal_po || 0));
                });

                const kpiPembelianVendor = computed(() => {
                    const all = pembelianVendor.value;
                    let totalBelanja = 0;
                    let totalBelanjaBulanIni = 0;
                    let totalHutang = 0;
                    let countHutang = 0;
                    let countProses = 0;
                    let totalPcsProses = 0;

                    const now = new Date();
                    const currentMonth = now.getMonth();
                    const currentYear = now.getFullYear();

                    all.forEach(pv => {
                        const total = Number(pv.total_pembelian || 0);
                        const sisa = Number(pv.sisa_hutang || 0);
                        const qty = Number(pv.qty_order || 0);
                        totalBelanja += total;

                        if (pv.tanggal_po) {
                            const d = new Date(pv.tanggal_po);
                            if (d.getMonth() === currentMonth && d.getFullYear() === currentYear) {
                                totalBelanjaBulanIni += total;
                            }
                        }
                        if (sisa > 0) {
                            totalHutang += sisa;
                            countHutang++;
                        }
                        if (pv.status_barang !== 'Diterima Gudang') {
                            countProses++;
                            totalPcsProses += qty;
                        }
                    });

                    return { totalBelanja, totalBelanjaBulanIni, totalHutang, countHutang, countProses, totalPcsProses };
                });

                const openModalPOVendor = () => {

                        nama_vendor: defaultVendor ? defaultVendor.nama : '',

                        varian_warna: defaultProduk ? defaultProduk.warna : 'Standar',

                    };

                const openModalEditPOVendor = (pv) => {

                const onVendorSelectChange = () => {

                    if (p) {
                        modalPOVendorState.form.nama_produk = p.nama;
                        modalPOVendorState.form.varian_warna = p.warna;
                        if (p.hpp_acuan) modalPOVendorState.form.harga_beli_satuan = p.hpp_acuan;
                        kalkulasiTotalPOVendor();
                    }
                };

                const kalkulasiTotalPOVendor = () => {
                    const qty = Math.max(0, Number(modalPOVendorState.form.qty_order || 0));
                    const harga = Math.max(0, Number(modalPOVendorState.form.harga_beli_satuan || 0));
                    const ongkir = Math.max(0, Number(modalPOVendorState.form.biaya_tambahan || 0));
                    const subtotal = qty * harga;
                    const total = subtotal + ongkir;
                    modalPOVendorState.form.subtotal = subtotal;
                    modalPOVendorState.form.total_pembelian = total;

                    if (modalPOVendorState.form.status_bayar === 'Lunas') {
                        modalPOVendorState.form.nominal_bayar = total;
                        modalPOVendorState.form.sisa_hutang = 0;
                    } else if (modalPOVendorState.form.status_bayar === 'Tempo') {
                        modalPOVendorState.form.nominal_bayar = 0;
                        modalPOVendorState.form.sisa_hutang = total;
                    } else if (modalPOVendorState.form.status_bayar === 'DP') {
                        const dp = Math.min(total, Math.max(0, Number(modalPOVendorState.form.nominal_bayar || 0)));
                        modalPOVendorState.form.nominal_bayar = dp;
                        modalPOVendorState.form.sisa_hutang = total - dp;
                    }
                };

                const submitPOVendor = async () => {

                        if (!f.kode_sku) throw new Error('Silakan pilih Produk Jadi.');

                        // Validasi kas jika bayar Lunas / DP

                        // Mode Baru: validasi kas jika bayar Lunas / DP

                            const saldoTersedia = getSaldoRekening(f.akun_kas);

                            // Catat ke Buku Kas
                            keuangan.value.unshift({
                                id: 'KAS-' + Date.now(),
                                tanggal: f.tanggal_po,
                                id_rekening: f.akun_kas,
                                keterangan: 'Pembelian Tas Makloon ' + f.nama_vendor + ' (' + f.nama_produk + ' ' + f.qty_order + ' pcs)',
                                tipe: 'Keluar',
                                nominal: f.nominal_bayar,
                                kategori: 'Pembelian Vendor'
                            });

                        showNotification('✅ PO Pembelian Vendor ' + recordPO.no_po_vendor + ' berhasil diterbitkan!', 'success');
                        simpanCacheLokal();

                        const batch = { 'Pembelian_Vendor': pembelianVendor.value };

                const hapusPOVendor = (noPo) => {

                            await syncKeDatabase('Pembelian_Vendor', pembelianVendor.value);

                    });
                };

                // ============================================================
                // JAGO LABA SMART DOCUMENT SYSTEM: CENTRAL PDF HEADER ENGINE
                // SINGLE SOURCE OF TRUTH UNTUK SELURUH DOKUMEN PDF
                // ============================================================
                const hexToRgb = (hex, fallback = [11, 28, 63]) => {
                    if (!hex || typeof hex !== 'string') return fallback;
                    const clean = hex.replace('#', '').trim();
                    if (clean.length === 3) {
                        const r = parseInt(clean[0] + clean[0], 16);
                        const g = parseInt(clean[1] + clean[1], 16);
                        const b = parseInt(clean[2] + clean[2], 16);
                        return (!isNaN(r) && !isNaN(g) && !isNaN(b)) ? [r, g, b] : fallback;
                    }
                    if (clean.length === 6) {
                        const r = parseInt(clean.substring(0, 2), 16);
                        const g = parseInt(clean.substring(2, 4), 16);
                        const b = parseInt(clean.substring(4, 6), 16);
                        return (!isNaN(r) && !isNaN(g) && !isNaN(b)) ? [r, g, b] : fallback;
                    }
                    return fallback;
                };

                const PdfHeader_render = (doc, options = {}) => {
                    if (!doc) return { finalY: 45, contentStartY: 49, headerBottomY: 35 };

                    const pageW = doc.internal.pageSize.getWidth();
                    const pageH = doc.internal.pageSize.getHeight();
                    const isPortrait = pageH > pageW;
                    const isA4 = Math.max(pageW, pageH) >= 280;

                    // Margin halaman dinamis (A4 Portrait default 14mm, A5 Landscape default 8mm)
                    const m = Number(options.margin) || (isA4 ? 14 : 8);
                    const contentW = pageW - (m * 2);

                    // Konfigurasi kop dokumen aktif (Single Source of Truth)
                    const cfg = (typeof templateDokumen !== 'undefined' && templateDokumen) ? templateDokumen : {};
                    const safeProfil = (typeof profil !== 'undefined' && profil) ? profil : {};

                    const brandName = String(cfg.show_name !== false ? (cfg.nama_utama || safeProfil.nama || 'PT JAGO LABA') : '').toUpperCase();
                    const legalName = String(cfg.show_legal_name ? (cfg.nama_legal || '') : '').trim();
                    const tagline = String(cfg.show_tagline ? (cfg.tagline || '') : '').trim();
                    const alamat = String(cfg.show_address !== false ? (cfg.alamat || safeProfil.alamat || '') : '').trim();
                    const wa = String(cfg.show_whatsapp !== false ? (cfg.whatsapp || safeProfil.no_wa || '') : '').trim();
                    const telp = String(cfg.show_phone ? (cfg.telepon || '') : '').trim();
                    const email = String(cfg.show_email ? (cfg.email || '') : '').trim();
                    const website = String(cfg.show_website ? (cfg.website || '') : '').trim();
                    const nib = String(cfg.show_nib ? (cfg.nib || '') : '').trim();
                    const npwp = String(cfg.show_npwp ? (cfg.npwp || '') : '').trim();

                    // Konversi Palet Warna Hex ke RGB
                    const companyColor = hexToRgb(cfg.company_color, [11, 28, 63]);
                    const infoColor = hexToRgb(cfg.info_color, [71, 85, 105]);
                    const accentColor = hexToRgb(cfg.accent_color, [245, 158, 11]);
                    const lineColor = hexToRgb(cfg.line_color, [11, 28, 63]);

                    // Tipografi Aman
                    const nameFontSize = Math.max(11, Math.min(20, Number(cfg.company_font_size) || (isA4 ? 14 : 12)));
                    const subFontSize = Math.max(7.5, Math.min(13, Number(cfg.subtitle_font_size) || (isA4 ? 9 : 8)));
                    const infoFontSize = Math.max(5.2, Math.min(10, Number(cfg.info_font_size) || (isA4 ? 7.2 : 5.8)));

                    // Sumber & Pengaturan Logo
                    const logoData = cfg.logo_source === 'custom' && cfg.logo_custom_data
                        ? cfg.logo_custom_data
                        : (safeProfil.logo || cfg.logo_custom_data || '');

                    const logoSizePx = Math.max(32, Math.min(100, Number(cfg.logo_size) || 52));
                    let logoSizeMm = logoSizePx * 0.264583;
                    if (!isA4 && logoSizeMm > 19) logoSizeMm = 19;
                    if (isA4 && logoSizeMm > 26) logoSizeMm = 26;

                    const logoPosition = ['left', 'center', 'right'].includes(cfg.logo_position) ? cfg.logo_position : 'left';
                    const layoutType = ['corporate_left', 'centered_formal', 'enterprise_split'].includes(cfg.layout_type) ? cfg.layout_type : 'corporate_left';

                    let curY = isA4 ? 10 : 6.5;
                    let logoRendered = false;

                    const drawLogoImage = (x, y, w, h) => {
                        if (!logoData) return false;
                        try {
                            const match = String(logoData).match(/^data:image\/(png|webp|jpeg|jpg)/i);
                            const fmt = match ? ((match[1] || 'jpeg').toUpperCase() === 'JPG' ? 'JPEG' : (match[1] || 'jpeg').toUpperCase()) : 'JPEG';
                            doc.addImage(logoData, fmt, x, y, w, h, undefined, 'FAST');
                            return true;
                        } catch(e) {
                            console.warn('Gagal merender logo di PDF:', e);
                            return false;
                        }
                    };

                    // ==========================================
                    // 1. TATA LETAK IDENTITAS KOP
                    // ==========================================
                    if (layoutType === 'centered_formal' || logoPosition === 'center') {
                        // --- CENTERED FORMAL ---
                        if (logoData) {
                            const lx = (pageW - logoSizeMm) / 2;
                            logoRendered = drawLogoImage(lx, curY, logoSizeMm, logoSizeMm);
                            if (logoRendered) curY += logoSizeMm + 2.5;
                        }

                        if (brandName) {
                            doc.setFont('helvetica', 'bold');
                            doc.setFontSize(nameFontSize);
                            doc.setTextColor(...companyColor);
                            doc.text(brandName, pageW / 2, curY + (nameFontSize * 0.35 * 0.8), { align: 'center' });
                            curY += (nameFontSize * 0.35) + 1.5;
                        }

                        if (legalName || tagline) {
                            doc.setFont('helvetica', 'bold');
                            doc.setFontSize(subFontSize);
                            doc.setTextColor(...infoColor);
                            const subText = [legalName, tagline].filter(Boolean).join(' • ');
                            doc.text(subText, pageW / 2, curY + (subFontSize * 0.35 * 0.8), { align: 'center' });
                            curY += (subFontSize * 0.35) + 1.2;
                        }

                        doc.setFont('helvetica', 'normal');
                        doc.setFontSize(infoFontSize);
                        doc.setTextColor(...infoColor);

                        if (alamat) {
                            const maxW = contentW * 0.85;
                            const splitAlm = doc.splitTextToSize(alamat, maxW);
                            doc.text(splitAlm, pageW / 2, curY + (infoFontSize * 0.35 * 0.8), { align: 'center' });
                            curY += (splitAlm.length * infoFontSize * 0.4) + 1;
                        }

                        const contacts = [];
                        if (wa) contacts.push('Hotline / WA: ' + wa);
                        if (telp) contacts.push('Telp: ' + telp);
                        if (email) contacts.push('Email: ' + email);
                        if (website) contacts.push('Web: ' + website);
                        if (nib) contacts.push('NIB: ' + nib);
                        if (npwp) contacts.push('NPWP: ' + npwp);

                        if (contacts.length) {
                            const ctLine = contacts.join('   •   ');
                            const splitCt = doc.splitTextToSize(ctLine, contentW * 0.95);
                            doc.text(splitCt, pageW / 2, curY + (infoFontSize * 0.35 * 0.8), { align: 'center' });
                            curY += (splitCt.length * infoFontSize * 0.4) + 1.5;
                        }

                    } else if (layoutType === 'enterprise_split') {
                        // --- ENTERPRISE SPLIT (Identitas Kiri, Kontak Rapi Kanan) ---
                        const rightW = contentW * 0.38;
                        let textX = m;

                        if (logoData && logoPosition === 'left') {
                            logoRendered = drawLogoImage(m, curY, logoSizeMm, logoSizeMm);
                            if (logoRendered) textX = m + logoSizeMm + 3.5;
                        }

                        const maxLeftTextW = pageW - m - rightW - textX - 4;
                        let leftY = curY;

                        if (brandName) {
                            doc.setFont('helvetica', 'bold');
                            doc.setFontSize(nameFontSize);
                            doc.setTextColor(...companyColor);
                            const splitBrand = doc.splitTextToSize(brandName, maxLeftTextW);
                            doc.text(splitBrand, textX, leftY + (nameFontSize * 0.35 * 0.8));
                            leftY += (splitBrand.length * nameFontSize * 0.35) + 1.2;
                        }

                        if (legalName || tagline) {
                            doc.setFont('helvetica', 'bold');
                            doc.setFontSize(subFontSize);
                            doc.setTextColor(...infoColor);
                            const subText = [legalName, tagline].filter(Boolean).join(' - ');
                            const splitSub = doc.splitTextToSize(subText, maxLeftTextW);
                            doc.text(splitSub, textX, leftY + (subFontSize * 0.35 * 0.8));
                            leftY += (splitSub.length * subFontSize * 0.35) + 1.2;
                        }

                        if (alamat) {
                            doc.setFont('helvetica', 'normal');
                            doc.setFontSize(infoFontSize);
                            doc.setTextColor(...infoColor);
                            const splitAlm = doc.splitTextToSize(alamat, maxLeftTextW);
                            doc.text(splitAlm, textX, leftY + (infoFontSize * 0.35 * 0.8));
                            leftY += (splitAlm.length * infoFontSize * 0.4) + 1;
                        }

                        // Blok kanan: kontak vertikal rapi
                        let rightY = curY;
                        doc.setFont('helvetica', 'normal');
                        doc.setFontSize(infoFontSize);
                        doc.setTextColor(...infoColor);

                        const rightContacts = [];
                        if (wa) rightContacts.push('WA: ' + wa);
                        if (telp) rightContacts.push('Telp: ' + telp);
                        if (email) rightContacts.push('Email: ' + email);
                        if (website) rightContacts.push('Web: ' + website);
                        if (nib) rightContacts.push('NIB: ' + nib);
                        if (npwp) rightContacts.push('NPWP: ' + npwp);

                        rightContacts.forEach(rc => {
                            doc.text(rc, pageW - m, rightY + (infoFontSize * 0.35 * 0.8), { align: 'right' });
                            rightY += (infoFontSize * 0.4) + 1.2;
                        });

                        curY = Math.max(leftY, rightY, curY + (logoRendered ? logoSizeMm : 0)) + 2;

                    } else {
                        // --- CORPORATE LEFT (Default) ---
                        let textX = m;
                        if (logoData && logoPosition === 'left') {
                            logoRendered = drawLogoImage(m, curY, logoSizeMm, logoSizeMm);
                            if (logoRendered) textX = m + logoSizeMm + 3.5;
                        } else if (logoData && logoPosition === 'right') {
                            drawLogoImage(pageW - m - logoSizeMm, curY, logoSizeMm, logoSizeMm);
                            logoRendered = true;
                        }

                        const availW = pageW - textX - (logoPosition === 'right' ? (logoSizeMm + 4) : 0) - m;
                        let textY = curY;

                        if (brandName) {
                            doc.setFont('helvetica', 'bold');
                            doc.setFontSize(nameFontSize);
                            doc.setTextColor(...companyColor);
                            const splitBrand = doc.splitTextToSize(brandName, availW);
                            doc.text(splitBrand, textX, textY + (nameFontSize * 0.35 * 0.8));
                            textY += (splitBrand.length * nameFontSize * 0.35) + 1.2;
                        }

                        if (legalName || tagline) {
                            doc.setFont('helvetica', 'bold');
                            doc.setFontSize(subFontSize);
                            doc.setTextColor(...infoColor);
                            const subText = [legalName, tagline].filter(Boolean).join(' • ');
                            const splitSub = doc.splitTextToSize(subText, availW);
                            doc.text(splitSub, textX, textY + (subFontSize * 0.35 * 0.8));
                            textY += (splitSub.length * subFontSize * 0.35) + 1.2;
                        }

                        doc.setFont('helvetica', 'normal');
                        doc.setFontSize(infoFontSize);
                        doc.setTextColor(...infoColor);

                        if (alamat) {
                            const splitAlm = doc.splitTextToSize(alamat, availW);
                            doc.text(splitAlm, textX, textY + (infoFontSize * 0.35 * 0.8));
                            textY += (splitAlm.length * infoFontSize * 0.4) + 1;
                        }

                        const contacts = [];
                        if (wa) contacts.push('Hotline / WA: ' + wa);
                        if (telp) contacts.push('Telp: ' + telp);
                        if (email) contacts.push('Email: ' + email);
                        if (website) contacts.push('Web: ' + website);
                        if (nib) contacts.push('NIB: ' + nib);
                        if (npwp) contacts.push('NPWP: ' + npwp);

                        if (contacts.length) {
                            const ctLine = contacts.join('   •   ');
                            const splitCt = doc.splitTextToSize(ctLine, availW);
                            doc.text(splitCt, textX, textY + (infoFontSize * 0.35 * 0.8));
                            textY += (splitCt.length * infoFontSize * 0.4) + 1.2;
                        }

                        curY = Math.max(textY, curY + (logoRendered ? logoSizeMm : 0)) + 2;
                    }

                    // ==========================================
                    // 2. GARIS PEMBATAS KOP
                    // ==========================================
                    let lineY = curY;
                    if (cfg.line_enabled !== false) {
                        const style = cfg.line_style || 'accent';
                        const wFactor = Number(cfg.line_width) || 2;
                        const lineThickness = 0.25 * wFactor;

                        if (style === 'double') {
                            doc.setDrawColor(...lineColor);
                            doc.setLineWidth(lineThickness * 0.7);
                            doc.line(m, curY, pageW - m, curY);
                            doc.line(m, curY + 1.2, pageW - m, curY + 1.2);
                            curY += 3.2;
                        } else if (style === 'single') {
                            doc.setDrawColor(...lineColor);
                            doc.setLineWidth(lineThickness);
                            doc.line(m, curY, pageW - m, curY);
                            curY += 2.5;
                        } else {
                            // Style: 'accent' (Dual Navy + Gold signature JAGO LABA)
                            doc.setDrawColor(...lineColor);
                            doc.setLineWidth(lineThickness);
                            doc.line(m, curY, pageW - m, curY);
                            doc.setDrawColor(...accentColor);
                            doc.setLineWidth(0.35);
                            doc.line(m, curY + 1.1, pageW - m, curY + 1.1);
                            curY += 3.5;
                        }
                        lineY = curY;
                    } else {
                        curY += 1.5;
                        lineY = curY;
                    }

                    // ==========================================
                    // 3. DOCUMENT TITLE BANNER
                    // ==========================================
                    if (options.title && options.showBanner !== false) {
                        const bannerH = isA4 ? 13 : 11.5;
                        doc.setFillColor(...companyColor);
                        doc.roundedRect(m, curY, contentW, bannerH, 2, 2, 'F');

                        doc.setFont('helvetica', 'bold');
                        doc.setFontSize(isA4 ? 9.5 : 8.6);
                        doc.setTextColor(255, 255, 255);
                        doc.text(String(options.title || 'DOKUMEN RESMI').toUpperCase(), m + 4, curY + (bannerH / 2) + 1.2);

                            const badgeW = Math.max(26, doc.getTextWidth(badgeLabel) + 10);
                            const badgeH = isA4 ? 8.2 : 7.2;
                            doc.setFillColor(...accentColor);
                            doc.roundedRect(pageW - m - badgeW - 2.5, curY + ((bannerH - badgeH) / 2), badgeW, badgeH, 1.8, 1.8, 'F');
                            doc.setTextColor(15, 23, 42);
                            doc.text(badgeLabel, pageW - m - 2.5 - (badgeW / 2), curY + ((bannerH - badgeH) / 2) + (badgeH / 2) + 1.1, { align: 'center' });

                    }

                    return {
                        finalY: curY,
                        contentStartY: curY + 1.5,

                    };
                };

                // Helper PDF Builder: Surat Pesanan PO Vendor / Invoice Makloon A4 Portrait Resmi
                const buildInvoicePOVendorPDF = (pv) => {
                    if (!pv) return null;
                    if (!window.jspdf || typeof window.jspdf.jsPDF !== 'function') {
                        throw new Error('Library jsPDF belum siap. Silakan muat ulang aplikasi.');
                    }
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({ format: 'a4', orientation: 'portrait', unit: 'mm' });
                    const pageW = doc.internal.pageSize.getWidth();
                    const pageH = doc.internal.pageSize.getHeight();
                    const m = 14;
                    const contentW = pageW - (m * 2);

                    const BLUE = [7, 55, 105];
                    const YELLOW = [250, 190, 30];
                    const PALE = [248, 250, 252];
                    const LINE = [226, 232, 240];
                    const TEXT = [15, 23, 42];
                    const MUTED = [100, 116, 139];
                    const GREEN = [5, 150, 105];
                    const RED = [225, 29, 72];

                    // 1. BRAND KOP & HEADER RESMI DINAMIS (SINGLE SOURCE OF TRUTH)
                    const statusBadge = String(pv.status_bayar || 'TEMPO').toUpperCase();
                    const header = PdfHeader_render(doc, {
                        title: 'SURAT PESANAN PEMBELIAN VENDOR (PURCHASE ORDER)',
                        subtitle: statusBadge,
