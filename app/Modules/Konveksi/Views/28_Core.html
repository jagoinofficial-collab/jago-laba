                                    saldo_hutang: nominalDisimpan,
                                    status: 'Aktif',
                                    idempotency_key: idempKey,
                                    catatan: 'Disimpan dari penyelesaian SPK Jahit #' + spk.id,
                                    created_at: new Date().toISOString(),
                                    updated_at: new Date().toISOString(),
                                    operator: 'Admin'
                                };
                                spk.id_hutang_konveksi = idHutang;
                                hutangKonveksi.value.unshift(hutangBaru);
                                tabs.push({ tab: 'Hutang_Konveksi', data: hutangKonveksi.value });
                            }

                            // Jika ada yang dicairkan -> Catat Keuangan Keluar
                            if(nominalDicairkan > 0){
                                keuangan.value.unshift({ id: Date.now().toString(), tanggal: tglS, tipe: 'Keluar', nominal: nominalDicairkan, keterangan: 'Pelunasan SPK Sewing - ' + getPegawaiName(spk.id_pegawai) + (nominalDisimpan > 0 ? ' (Sebagian Disimpan ' + formatRupiah(nominalDisimpan) + ')' : '') + (hasilPiutang.pembayaran > 0 ? ' | Pembayaran Piutang Manual ' + formatRupiah(hasilPiutang.pembayaran) : ''), id_rekening: formData.id_rekening, id_referensi: spk.id });
                                tabs.push({ tab: 'Keuangan', data: keuangan.value });
                            }

                            await syncMultiTabs(tabs);
                            generateAndSavePDF('SPK_Jahit', spk); 
                            closeModal();
                            showPopup({ type: 'success', title: 'SPK Selesai Ditutup', message: 'SPK Jahit ditutup, stok produk bertambah, dan pembayaran tersimpan di database storage server.', autoClose: 2500 });
                        } catch (err) {
                            jahit.value = backupJahit;
                            produk.value = backupProduk;
                            keuangan.value = backupKeuangan;
                            hutangKonveksi.value = backupHutangKonveksi;
                            simpanCacheLokal();
                            showPopup({ type: 'error', title: 'Gagal Menyimpan', message: 'Gagal menyimpan pelunasan ke storage server: ' + (err?.message || err), autoClose: 0 });
                        }
                    }
                };

                const arsipkanProdukGrup = (g) => {
                    if (!g || !g.variants || !g.variants.length) return;
                    const isCurrentlyArsip = (g.status === 'Arsip');
                    const targetStatus = isCurrentlyArsip ? 'Aktif' : 'Arsip';
                    const actionLabel = isCurrentlyArsip ? 'mengaktifkan kembali' : 'mengarsipkan';

                    openConfirm(
                        isCurrentlyArsip ? 'Aktifkan Kembali Produk' : 'Arsipkan Produk & Seluruh Varian',
                        `Apakah Anda yakin ingin ${actionLabel} produk "${g.nama}" beserta seluruh (${g.variants.length}) varian warnanya?`,
                        async () => {
                            showPopup({
                                type: 'info',
                                loading: true,
                                title: 'Menyimpan Perubahan...',
                                message: `Sedang ${actionLabel} produk ke database MySQL...`,
                                autoClose: 0
                            });

                            const backupProduk = JSON.parse(JSON.stringify(produk.value));
                            const backupMasterStok = JSON.parse(JSON.stringify(masterStok.value));

                            const variantIds = g.variants.map(v => String(v.id));
                            const variantSkus = g.variants.map(v => String(v.kode || '').trim().toUpperCase());

                            // Update status di produk.value
                            produk.value.forEach(p => {
                                if (variantIds.includes(String(p.id))) {
                                    p.status = targetStatus;
                                    p.updated_at = new Date().toISOString();
                                }
                            });

                            // Update status di masterStok.value
                            (masterStok.value || []).forEach(m => {
                                if (variantSkus.includes(String(m.kode_sku || '').trim().toUpperCase())) {
                                    m.status_stok = targetStatus;
                                    m.last_updated = new Date().toISOString();
                                }
                            });

                            simpanCacheLokal();

                            try {
                                await syncMultiTabs([
                                    { tab: 'Produk', data: produk.value },
                                    { tab: 'Master_Stok', data: masterStok.value }
                                ]);
                                showPopup({
                                    type: 'success',
                                    title: isCurrentlyArsip ? 'Produk Diaktifkan' : 'Produk Diarsipkan',
                                    message: `Status produk "${g.nama}" berhasil diperbarui.`,
                                    autoClose: 2000
                                });
                                addLog(`Produk ${g.nama} diubah status menjadi ${targetStatus}`);
                            } catch (err) {
                                produk.value = backupProduk;
                                masterStok.value = backupMasterStok;
                                simpanCacheLokal();
                                showPopup({ type: 'error', title: 'Gagal Menyimpan', message: 'Gagal menyimpan ke MySQL: ' + (err?.message || err) });
                            }
                        },
                        isCurrentlyArsip ? 'Ya, Aktifkan' : 'Ya, Arsipkan'
                    );
                };

                const hapusProdukGrup = (g) => {
                    if (!g || !g.variants || !g.variants.length) return;
                    const variantIds = g.variants.map(v => String(v.id));
                    const variantSkus = g.variants.map(v => String(v.kode || '').trim().toUpperCase());

                    // Relational Integrity Check
                    const hasPotong = (potong.value || []).some(pt => (pt.items || []).some(it => variantIds.includes(String(it.id_produk))));
                    const hasJahit = (jahit.value || []).some(jh => (jh.items || []).some(it => variantIds.includes(String(it.id_produk))));
                    const hasMutasi = (mutasiStok.value || []).some(m => variantSkus.includes(String(m.kode_sku || '').trim().toUpperCase()) && m.jenis_mutasi !== 'OPENING_BALANCE');
                    const hasVendor = (pembelianVendor.value || []).some(pv => variantSkus.includes(String(pv.kode_sku || '').trim().toUpperCase()));
                    const hasDistribusi = (distribusi.value || []).some(d => (d.items || []).some(it => variantIds.includes(String(it.id_produk)) || variantSkus.includes(String(it.kode_sku || '').trim().toUpperCase())));
                    const hasPenjualan = (penjualanProduksi.value || []).some(pj => (pj.items || []).some(it => variantIds.includes(String(it.id_produk)) || variantSkus.includes(String(it.kode_sku || '').trim().toUpperCase())));

                    if (hasPotong || hasJahit || hasMutasi || hasVendor || hasDistribusi || hasPenjualan) {
                        showPopup({
                            type: 'warning',
                            title: 'Tidak Dapat Dihapus Permanen',
                            message: `Produk "${g.nama}" memiliki riwayat transaksi operasional/produksi terkait (SPK/Mutasi/Distribusi/Penjualan). Data dilindungi agar buku besar dan laporan keuangan tetap akurat. Silakan gunakan tombol "Arsipkan" untuk menonaktifkannya.`
                        });
                        return;
                    }

                    openConfirm(
                        'Hapus Produk Permanen',
                        `Apakah Anda yakin ingin menghapus permanen produk "${g.nama}" beserta seluruh (${g.variants.length}) variannya dari database? Data yang belum memiliki riwayat transaksi ini akan dibersihkan sepenuhnya.`,
                        async () => {
                            showPopup({
                                type: 'info',
                                loading: true,
                                title: 'Menghapus Data...',
                                message: `Sedang menghapus produk "${g.nama}" dan menyinkronkan database...`,
                                autoClose: 0
                            });

                            const backupProduk = JSON.parse(JSON.stringify(produk.value));
                            const backupMasterStok = JSON.parse(JSON.stringify(masterStok.value));
                            const backupMutasiStok = JSON.parse(JSON.stringify(mutasiStok.value));

                            // Filter out dari produk.value
                            produk.value = produk.value.filter(p => !variantIds.includes(String(p.id)));

                            // Filter out dari masterStok.value & mutasiStok.value
                            masterStok.value = (masterStok.value || []).filter(m => !variantSkus.includes(String(m.kode_sku || '').trim().toUpperCase()));
                            mutasiStok.value = (mutasiStok.value || []).filter(m => !variantSkus.includes(String(m.kode_sku || '').trim().toUpperCase()));

                            simpanCacheLokal();

                            try {
                                await syncMultiTabs([
                                    { tab: 'Produk', data: produk.value },
                                    { tab: 'Master_Stok', data: masterStok.value },
                                    { tab: 'Mutasi_Stok', data: mutasiStok.value }
                                ]);
                                showPopup({
                                    type: 'success',
                                    title: 'Produk Berhasil Dihapus',
                                    message: `Produk "${g.nama}" berhasil dihapus secara permanen dari database.`,
                                    autoClose: 2000
                                });
                                addLog(`Produk ${g.nama} dihapus permanen`);
                            } catch (err) {
                                produk.value = backupProduk;
                                masterStok.value = backupMasterStok;
                                mutasiStok.value = backupMutasiStok;
                                simpanCacheLokal();
                                showPopup({ type: 'error', title: 'Gagal Menghapus', message: 'Gagal menghapus di MySQL: ' + (err?.message || err) });
                            }
                        },
                        'Ya, Hapus Permanen'
                    );
                };

                const hapusData = (tipe, id) => {
                    let labelInfo = 'item ini';
                    if (tipe === 'supplier') {
                        const s = supplier.value.find(x => String(x.id) === String(id));
                        labelInfo = s ? `Mitra "${s.nama || 'Supplier/Vendor'}"` : 'Mitra Supplier/Vendor';
                    } else if (tipe === 'pegawai') {
                        const pg = pegawai.value.find(x => String(x.id) === String(id));
                        labelInfo = pg ? `Pegawai "${pg.nama}"` : 'Pegawai';
                    } else if (tipe === 'produk') {
                        const p = produk.value.find(x => String(x.id) === String(id));
                        labelInfo = p ? `Produk "${p.nama || p.kode}"` : 'Produk';
                    } else if (tipe === 'bahan') {
                        const b = bahan.value.find(x => String(x.id) === String(id));
                        labelInfo = b ? `Material "${b.nama}"` : 'Material';
                    } else if (tipe === 'bahan_hpp') {
                        const bh = bahanHPP.value.find(x => String(x.id) === String(id));
                        labelInfo = bh ? `Bahan HPP "${bh.nama}"` : 'Bahan HPP';
                    } else if (tipe === 'potong') {
                        labelInfo = `SPK Potong #${id}`;
                    } else if (tipe === 'jahit') {
                        labelInfo = `SPK Jahit #${id}`;
                    } else if (tipe === 'pembelian') {
                        labelInfo = `Faktur Beli #${id}`;
                    } else if (tipe === 'distribusi') {
                        labelInfo = `Distribusi #${id}`;
                    } else if (tipe === 'rekening') {
                        const r = rekening.value.find(x => String(x.id) === String(id));
                        labelInfo = r ? `Rekening "${r.nama}"` : 'Rekening';
                    } else if (tipe === 'piutang') {
                        labelInfo = `Pinjaman/Piutang #${id}`;
                    } else if (tipe === 'kasbon') {
                        labelInfo = `Kasbon #${id}`;
                    }

                    openConfirm('Hapus Data Permanen', `Apakah Anda yakin ingin menghapus ${labelInfo}? Tindakan ini akan menghapus data dari memori dan database storage server.`, async () => {
                        showPopup({
                            type: 'info',
                            loading: true,
                            title: 'Menghapus dari Database...',
                            message: `Sedang memproses penghapusan ${labelInfo} dan menyinkronkan ke storage server...`,
                            autoClose: 0
                        });

                        const snapshots = {
                            rekening: JSON.parse(JSON.stringify(rekening.value)),
                            produk: JSON.parse(JSON.stringify(produk.value)),
                            master_stok: JSON.parse(JSON.stringify(masterStok.value)),
                            mutasi_stok: JSON.parse(JSON.stringify(mutasiStok.value)),
                            bahan: JSON.parse(JSON.stringify(bahan.value)),
                            bahan_hpp: JSON.parse(JSON.stringify(bahanHPP.value)),
                            pegawai: JSON.parse(JSON.stringify(pegawai.value)),
                            supplier: JSON.parse(JSON.stringify(supplier.value)),
                            pembelian: JSON.parse(JSON.stringify(pembelian.value)),
                            distribusi: JSON.parse(JSON.stringify(distribusi.value)),
                            potong: JSON.parse(JSON.stringify(potong.value)),
                            jahit: JSON.parse(JSON.stringify(jahit.value)),
                            kasbon: JSON.parse(JSON.stringify(kasbonList.value)),
                            keuangan: JSON.parse(JSON.stringify(keuangan.value)),
                            hpp_model_bom: JSON.parse(JSON.stringify(hppModelBom.value))
                        };

                        const rollback = () => {
                            rekening.value = snapshots.rekening;
                            produk.value = snapshots.produk;
                            masterStok.value = snapshots.master_stok;
                            mutasiStok.value = snapshots.mutasi_stok;
                            bahan.value = snapshots.bahan;
                            bahanHPP.value = snapshots.bahan_hpp;
                            hppModelBom.value = snapshots.hpp_model_bom;
                            pegawai.value = snapshots.pegawai;
                            supplier.value = snapshots.supplier;
                            pembelian.value = snapshots.pembelian;
                            distribusi.value = snapshots.distribusi;
                            potong.value = snapshots.potong;
                            jahit.value = snapshots.jahit;
                            kasbonList.value = snapshots.kasbon;
                            keuangan.value = snapshots.keuangan;
                            simpanCacheLokal();
                        };

                        try {
                            const tabsToSync = [];

                            if (tipe === 'supplier') {
                                const sIdx = supplier.value.findIndex(x => String(x.id) === String(id));
                                if (sIdx === -1) {
                                    showPopup({ type: 'warning', title: 'Data Tidak Ditemukan', message: 'Data mitra supplier/vendor tidak ditemukan atau sudah dihapus.' });
                                    return;
                                }
                                supplier.value.splice(sIdx, 1);
                                tabsToSync.push({ tab: 'Supplier', data: supplier.value });
                                addLog('Mitra Supplier/Vendor Dihapus');
                            }
                            else if (tipe === 'rekening') {
                                rekening.value = rekening.value.filter(x => String(x.id) !== String(id));
                                tabsToSync.push({ tab: 'Rekening', data: rekening.value });
                            }
                            else if (tipe === 'produk') {
                                const pTarget = produk.value.find(x => String(x.id) === String(id));
                                const pSku = pTarget ? String(pTarget.kode || '').trim().toUpperCase() : '';

                                // Relational Integrity Check: periksa relasi di SPK Potong, SPK Jahit, Mutasi Stok, dan Pembelian Vendor
                                const hasPotong = (potong.value || []).some(pt => (pt.items || []).some(it => String(it.id_produk) === String(id)));
                                const hasJahit = (jahit.value || []).some(jh => (jh.items || []).some(it => String(it.id_produk) === String(id)));
                                const hasMutasi = (mutasiStok.value || []).some(m => String(m.kode_sku || '').trim().toUpperCase() === pSku && m.jenis_mutasi !== 'OPENING_BALANCE');
                                const hasVendor = (pembelianVendor.value || []).some(pv => String(pv.kode_sku || '').trim().toUpperCase() === pSku);

                                if (hasPotong || hasJahit || hasMutasi || hasVendor) {
                                    // Relational Protection: Soft delete / Arsipkan saja (Section 5, 41)
                                    if (pTarget) {
                                        pTarget.status = 'Arsip';
                                        pTarget.updated_at = new Date().toISOString();
                                    }
                                    const mIdx = (masterStok.value || []).findIndex(m => String(m.kode_sku || '').trim().toUpperCase() === pSku);
                                    if (mIdx > -1) {
                                        masterStok.value[mIdx].status_stok = 'Arsip';
                                        masterStok.value[mIdx].last_updated = new Date().toISOString();
                                    }
                                    tabsToSync.push({ tab: 'Produk', data: produk.value });
                                    tabsToSync.push({ tab: 'Master_Stok', data: masterStok.value });
                                    addLog('Produk ' + (pTarget?.nama || pSku) + ' Diarsipkan (Memiliki Riwayat Transaksi/Produksi)');
                                    showNotification('Produk memiliki riwayat transaksi/produksi terkait. Status diubah menjadi "Arsip" untuk menjaga keutuhan buku besar & data.', 'warning');
                                } else {
                                    // Belum pernah ada transaksi produksi, aman untuk dihapus permanen
                                    produk.value = produk.value.filter(x => String(x.id) !== String(id));
                                    if (pSku) {
                                        masterStok.value = (masterStok.value || []).filter(m => String(m.kode_sku || '').trim().toUpperCase() !== pSku);
                                        mutasiStok.value = (mutasiStok.value || []).filter(m => String(m.kode_sku || '').trim().toUpperCase() !== pSku);
                                    }
                                    tabsToSync.push({ tab: 'Produk', data: produk.value });
                                    tabsToSync.push({ tab: 'Master_Stok', data: masterStok.value });
                                    tabsToSync.push({ tab: 'Mutasi_Stok', data: mutasiStok.value });
                                    addLog('Produk ' + (pTarget?.nama || pSku) + ' Dihapus Permanen');
                                }
                            }
                            else if (tipe === 'bahan') {
                                bahan.value = bahan.value.filter(x => String(x.id) !== String(id));
                                tabsToSync.push({ tab: 'Bahan', data: bahan.value });
                            }
                            else if (tipe === 'bahan_hpp') {
                                bahanHPP.value = bahanHPP.value.filter(x => String(x.id) !== String(id));
                                tabsToSync.push({ tab: 'Bahan_HPP', data: bahanHPP.value });
                                hppModelBom.value = hppModelBom.value.filter(b => String(b.id_bahan_hpp) !== String(id));
                                tabsToSync.push({ tab: 'HPP_Model_BOM', data: hppModelBom.value });
                                addLog('Bahan Baku HPP Dihapus');
                            }
                            else if (tipe === 'pegawai') {
                                pegawai.value = pegawai.value.filter(x => String(x.id) !== String(id));
                                tabsToSync.push({ tab: 'Pegawai', data: pegawai.value });
                            }
                            else if (tipe === 'pembelian') {
                                const pb = pembelian.value.find(x => String(x.id) === String(id));
                                if (pb) {
                                    (pb.items || [{ id_bahan: pb.id_bahan, qty: pb.qty }]).forEach(it => {
                                        const bIdx = bahan.value.findIndex(b => String(b.id) === String(it.id_bahan));
                                        if (bIdx > -1) bahan.value[bIdx].stok = Math.max(0, Number(bahan.value[bIdx].stok || 0) - Number(it.qty || 0));
                                    });
                                    tabsToSync.push({ tab: 'Bahan', data: bahan.value });
                                }
                                pembelian.value = pembelian.value.filter(x => String(x.id) !== String(id));
                                tabsToSync.push({ tab: 'Pembelian', data: pembelian.value });
                            }
                            else if (tipe === 'distribusi') {
                                const dt = distribusi.value.find(x => String(x.id) === String(id));
                                if (dt) {
                                    (dt.items || []).forEach(it => {
                                        const bIdx = bahan.value.findIndex(b => String(b.id) === String(it.id_bahan));
                                        if (bIdx > -1) bahan.value[bIdx].stok = Number(bahan.value[bIdx].stok || 0) + Number(it.qty || 0);
                                    });
                                    tabsToSync.push({ tab: 'Bahan', data: bahan.value });
                                }
                                distribusi.value = distribusi.value.filter(x => String(x.id) !== String(id));
                                tabsToSync.push({ tab: 'Distribusi', data: distribusi.value });
                            }
                            else if (tipe === 'potong') {
                                potong.value = potong.value.filter(x => String(x.id) !== String(id));
                                tabsToSync.push({ tab: 'Potong', data: potong.value });
                            }
                            else if (tipe === 'jahit') {
                                const jh = jahit.value.find(x => String(x.id) === String(id));
                                if (jh && jh.status === 'Proses') {
                                    (jh.items || []).forEach(jItem => {
                                        const ptIdx = potong.value.findIndex(p => String(p.id) === String(jItem.id_potong));
                                        if (ptIdx > -1) {
                                            const ptItem = (potong.value[ptIdx].items || []).find(i => String(i.id_produk) === String(jItem.id_produk));
                                            if (ptItem) ptItem.qty = Number(ptItem.qty || 0) + Number(jItem.qty || 0);
                                        }
                                    });
                                    tabsToSync.push({ tab: 'Potong', data: potong.value });
                                }
                                jahit.value = jahit.value.filter(x => String(x.id) !== String(id));
                                tabsToSync.push({ tab: 'Jahit', data: jahit.value });
                            }
                            else if (tipe === 'piutang') {
                                const pItem = kasbonList.value.find(x => String(x.id) === String(id) && x.jenis === 'piutang_pegawai');
                                if (!pItem) {
                                    showPopup({ type: 'warning', title: 'Data Tidak Ditemukan', message: 'Data piutang tidak ditemukan.' });
                                    return;
                                }
                                if (Number(pItem.terbayar || 0) > 0) {
                                    showPopup({ type: 'warning', title: 'Tidak Dapat Dihapus', message: 'Piutang yang sudah memiliki pembayaran tidak dapat dihapus.' });
                                    return;
                                }
                                const kIdx = keuangan.value.findIndex(k => String(k.id_referensi) === String(id) && normalizeFinanceType(k.tipe) === 'keluar');
                                if (kIdx > -1) {
                                    keuangan.value.splice(kIdx, 1);
                                    tabsToSync.push({ tab: 'Keuangan', data: keuangan.value });
                                }
                                kasbonList.value = kasbonList.value.filter(x => String(x.id) !== String(id));
                                tabsToSync.push({ tab: 'Kasbon', data: kasbonList.value });
                            }
                            else if (tipe === 'kasbon') {
                                const kasbonItem = kasbonList.value.find(x => String(x.id) === String(id));
                                if (!kasbonItem) {
                                    showPopup({ type: 'warning', title: 'Data Tidak Ditemukan', message: 'Data kasbon tidak ditemukan.' });
                                    return;
                                }
                                const spkList = kasbonItem.divisi_spk === 'potong' ? potong : jahit;
                                const spkIdx = spkList.value.findIndex(p => String(p.id) === String(kasbonItem.id_dokumen));
                                if (spkIdx > -1) {
                                    spkList.value[spkIdx].kasbon = Math.max(0, (Number(spkList.value[spkIdx].kasbon) || 0) - Number(kasbonItem.nominal || 0));
                                    tabsToSync.push({ tab: kasbonItem.divisi_spk === 'potong' ? 'Potong' : 'Jahit', data: spkList.value });
                                }
                                const kIdx = keuangan.value.findIndex(k => (String(k.id_referensi) === String(id)) || (k.keterangan === kasbonItem.keterangan && k.nominal == kasbonItem.nominal && k.tanggal == kasbonItem.tanggal));
                                if (kIdx > -1) {
                                    keuangan.value.splice(kIdx, 1);
                                    tabsToSync.push({ tab: 'Keuangan', data: keuangan.value });
                                }
                                kasbonList.value = kasbonList.value.filter(x => String(x.id) !== String(id));
                                tabsToSync.push({ tab: 'Kasbon', data: kasbonList.value });
                            } else {
                                showPopup({ type: 'error', title: 'Operasi Ditolak', message: `Tipe data "${tipe}" tidak dikenali.` });
                                return;
                            }

                            await syncMultiTabs(tabsToSync);

                            showPopup({
                                type: 'success',
                                title: 'Berhasil Dihapus',
                                message: `Data ${labelInfo} telah berhasil dihapus secara permanen dari database storage server.`,
                                autoClose: 2500
                            });
                        } catch (err) {
                            console.error('Error saat menghapus data:', err);
                            rollback();
                            showPopup({
                                type: 'error',
                                title: 'Gagal Menghapus Data',
                                message: 'Terjadi kendala saat menyinkronkan penghapusan ke database storage server: ' + (err?.message || err) + '. Data telah dipulihkan.',
                                autoClose: 0
                            });
                        }
                    });
                };

                        // iframe backend API PHP dibanding doc.save() yang kadang hanya
                        // menampilkan notifikasi tetapi tidak memulai download.
                        const blob = doc.output('blob');
                        const blobUrl = URL.createObjectURL(blob);

                        if (isMobile) {
                            let opened = false;
                            try {
                                const win = window.open(blobUrl, '_blank');
                                opened = !!win;
                            } catch (e) {}

                            // Fallback jika popup/tab diblokir.
                            if (!opened) {
                                const a = document.createElement('a');
                                a.href = blobUrl;
                                a.download = safeName;
                                a.target = '_blank';
                                a.rel = 'noopener';
                                document.body.appendChild(a);
                                a.click();
                                a.remove();
                            }
                            showNotification('PDF siap. Jika tab PDF terbuka, tekan ikon Download / Bagikan untuk menyimpan.');
                        } else {
                            const a = document.createElement('a');
                            a.href = blobUrl;
                            a.download = safeName;
                            a.style.display = 'none';
                            document.body.appendChild(a);
                            a.click();
                            a.remove();
                            showNotification('PDF berhasil dibuat dan diunduh.');
                        }

                        if (window.jlApi && window.jlApi.run) {
                            try {
                                const b64 = doc.output('datauristring');
                                window.jlApi.run
                                    .withFailureHandler(e => console.warn('Backup Drive dilewati:', e))
                                    .saveDocumentFileServer(b64, safeName);

                            }

                        });

                        let y = header.contentStartY;
                        const totalSaldo = Number(totalSemuaSaldo.value || 0);
                        const totalMasuk = Number(totalPemasukan.value || 0);
                        const totalKeluar = Number(totalPengeluaran.value || 0);

                        doc.setTextColor(15,23,42);
                        doc.setFont('helvetica','bold');
                        doc.setFontSize(9);
                        doc.text('RINGKASAN POSISI KEUANGAN', margin, y);
                        y += 5;

                        const summary = [
                            ['TOTAL SALDO KAS & BANK', formatRupiah(totalSaldo)],
                            ['TOTAL PEMASUKAN', formatRupiah(totalMasuk)],
                            ['TOTAL PENGELUARAN', formatRupiah(totalKeluar)],
                            ['ARUS KAS BERSIH (NET)', formatRupiah(keuanganSaldoBersih.value || 0)],
                            ['TOTAL HUTANG USAHA', formatRupiah(kpiHutang.value?.totalSisaHutang || 0)],
                            ['PIUTANG PEGAWAI AKTIF', formatRupiah(totalPiutangAktif.value || 0)],
                            ['RASIO LIKUIDITAS KAS', (rasioLikuiditasKas.value || 100) + '%']
                        ];

                        if (doc.autoTable) {
                            doc.autoTable({
                                startY: y,
                                head: [['KETERANGAN','NILAI']],
                                body: summary,
                                margin: { left: margin, right: margin },
                                theme: 'grid',
                                styles: { fontSize: 7, cellPadding: 2.5 },
                                headStyles: { fillColor: [30,64,175], textColor: 255, fontStyle: 'bold' },
                                columnStyles: { 0: { cellWidth: 75 }, 1: { halign: 'right' } }
                            });
                            y = doc.lastAutoTable.finalY + 7;
                        } else {
                            summary.forEach(row => {
                                doc.text(row[0], margin, y);
                                doc.text(row[1], pageW - margin, y, { align: 'right' });
                                y += 5;
                            });
                            y += 3;
                        }

                        const rows = rekening.value.map(rek => {
                            const id = rek.id;
                            const awal = Number(rek.saldo_awal || 0);
                            const masuk = Number(getPemasukanRekening(id) || 0);
                            const keluar = Number(getPengeluaranRekening(id) || 0);
                            const akhir = awal + masuk - keluar;
                            return [
                                String(rek.kode || '-'),
                                String(rek.nama || '-'),
                                formatRupiah(awal),
                                formatRupiah(masuk),
                                formatRupiah(keluar),
                                formatRupiah(akhir)
                            ];
                        });

                        doc.setFontSize(9);
                        doc.setFont('helvetica','bold');
                        doc.text('POSISI SALDO PER REKENING', margin, y);
                        y += 4;

                        if (doc.autoTable) {
                            doc.autoTable({
                                startY: y,
                                head: [['KODE','REKENING','SALDO AWAL','PEMASUKAN','PENGELUARAN','SALDO AKHIR']],
                                body: rows.length ? rows : [['-','Belum ada rekening','Rp 0','Rp 0','Rp 0','Rp 0']],
                                margin: { left: margin, right: margin },
                                theme: 'grid',
                                styles: { fontSize: 6.5, cellPadding: 2 },
                                headStyles: { fillColor: [30,64,175], textColor: 255, fontStyle: 'bold' },
                                columnStyles: {
                                    0: { cellWidth: 18 },
                                    1: { cellWidth: 42 },
                                    2: { halign: 'right' },
                                    3: { halign: 'right' },
                                    4: { halign: 'right' },
                                    5: { halign: 'right', fontStyle: 'bold' }
                                }
                            });
                        }

                        const today = new Date().toLocaleDateString('id-ID');
                        doc.setFontSize(6.5);
                        doc.setFont('helvetica','normal');
                        doc.setTextColor(100,116,139);
                        doc.text('Dicetak: ' + today, margin, pageH - 6);

                        const blob = doc.output('blob');
                        const fileName = 'Laporan_Keuangan_JAGO_LABA_' + new Date().toISOString().slice(0,10) + '.pdf';
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        a.rel = 'noopener';
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        setTimeout(() => URL.revokeObjectURL(url), 5000);
                        showNotification('Laporan keuangan berhasil dibuat.');

                    } catch (error) {
                        console.error('generateLaporanKeuanganPDF:', error);
                        showNotification('Gagal membuat laporan keuangan: ' + (error && error.message ? error.message : 'Kesalahan tidak diketahui'));
                    }
                };


                // =============================================================
                // MODUL HPP PRODUKSI KONVEKSI & TAS (ENTERPRISE COSTING ENGINE)
                // BOM Material, Upah Langsung, Packaging/Makloon, Biaya Manual,
                // Simulasi Margin, Sinkronisasi Master Produk, dan Audit HPP Aktual
                // =============================================================

                // UNIQUE HPP MODEL LIST (Grouping produk berdasarkan model_tas / SKU Induk)
                const uniqueHppModelList = computed(() => {
                    const map = new Map();
                    produk.value.forEach(p => {
                        const modelKey = (p.model_tas || p.nama || '').trim();
                        if (!modelKey) return;
                        if (!map.has(modelKey)) {
                            map.set(modelKey, {
                                model_key: modelKey,
                                nama: modelKey,
                                kategori: p.kategori || 'Umum',
                                foto: p.foto || '',
                                satuan: p.satuan || 'Pcs',
                                hpp_produk: Number(p.hpp_produk || 0),
                                upah_potong: Number(p.upah_potong || 0),
                                upah_jahit: Number(p.upah_jahit || 0),
                                hpp_formula: p.hpp_formula || null,
                                hpp_aktual: p.hpp_aktual || null,
                                stok_total: Number(p.stok || 0),
                                varian_ids: [String(p.id)],
                                varian_names: [p.warna || p.kode || 'Standar'],
                                jumlah_varian: 1
                            });
                        } else {
                            const m = map.get(modelKey);
                            m.varian_ids.push(String(p.id));
                            m.stok_total += Number(p.stok || 0);
                            const vName = p.warna || p.kode || '';
                            if (vName && !m.varian_names.includes(vName)) {
                                m.varian_names.push(vName);
                            }
                            m.jumlah_varian = m.varian_ids.length;
                            if (!m.hpp_produk && p.hpp_produk) m.hpp_produk = Number(p.hpp_produk);
                            if (!m.upah_potong && p.upah_potong) m.upah_potong = Number(p.upah_potong);
                            if (!m.upah_jahit && p.upah_jahit) m.upah_jahit = Number(p.upah_jahit);
                            if (!m.hpp_formula && p.hpp_formula) m.hpp_formula = p.hpp_formula;
                            if (!m.foto && p.foto) m.foto = p.foto;
                        }
                    });
                    return Array.from(map.values());
                });

                const selectedHppModelKey = ref('');
                const selectedHppProdukId = ref(''); // kompatibilitas
                const hppBatchQty = ref(100);
                const hppMarginMode = ref('margin'); // 'margin' (Gross Margin) atau 'markup' (Markup)
                const hppTargetMarginPct = ref(30); // Target Margin Retail / Eceran %
                const hppTargetMarginGrosirPct = ref(20); // Target Margin Grosir %
                const isCopyBomModalOpen = ref(false);
                const copySourceModelKey = ref('');
                const hppBOMItems = ref([]);
                const hppUpah = reactive({
                    potong: 0,
                    jahit: 0,
                    finishing: 0,
                    packing: 0
                });
                const hppJasaPackaging = reactive({
                    sablon_bordir: 0,
                    hangtag_label: 0,
                    plastik_polybag: 0,
                    aksesoris_kemasan: 0
                });
                const hppOperasional = reactive({
                    mode: 'nominal',
                    nominal: 0,
                    persen: 0
                });
                const hppManualCosts = ref([]);
                const hppAktual = reactive({
                    spkId: '',
                    bahanRiil: 0,
                    upahPotongRiil: 0,
                    upahJahitRiil: 0,
                    biayaLainRiil: 0,
                    pcsBagus: 0
                });

                // Model terpilih untuk HPP
                const activeHppModel = computed(() => {
                    if (!selectedHppModelKey.value) return null;
                    return uniqueHppModelList.value.find(m => m.model_key === selectedHppModelKey.value) || null;
                });
                // Alias kompatibilitas
                const activeHppProduk = computed(() => activeHppModel.value);

                // Sentralisasi Perhitungan BOM Baris
                const getQtyEfektifPerPcs = (item) => {
                    if (!item) return 0;
                    const qty = normalizeHppNumber(item.qty_pakai_per_pcs !== undefined ? item.qty_pakai_per_pcs : item.qty_per_unit, 0);
                    const waste = normalizeHppNumber(item.waste_pct, 0);
                    return Math.round(qty * (1 + waste / 100) * 100000) / 100000;
                };

                const calculateHppBomItem = (item) => {
                    if (!item) return { qty_efektif_per_pcs: 0, hpp_material_per_pcs: 0 };
                    const harga = normalizeHppNumber(item.harga_satuan_pakai !== undefined && item.harga_satuan_pakai !== '' ? item.harga_satuan_pakai : item.harga_satuan, 0);
                    const qtyEfektif = getQtyEfektifPerPcs(item);
                    return {
                        qty_efektif_per_pcs: qtyEfektif,
                        hpp_material_per_pcs: Math.round(harga * qtyEfektif * 100) / 100
                    };
                };

                // Subtotal baris BOM
                const getSubtotalBOMItem = (item) => {
                    const calc = calculateHppBomItem(item);
                    return calc.hpp_material_per_pcs;
                };

                // Inisialisasi atau load data formula saat model dipilih
                const loadHppFormulaByModel = (modelKey) => {
                    if (!modelKey) return;
                    selectedHppModelKey.value = modelKey;
                    const model = uniqueHppModelList.value.find(m => m.model_key === modelKey);
                    if (!model) return;

                    const matchingProds = produk.value.filter(p => (p.model_tas || p.nama || '').trim() === modelKey);
                    const prodWithFormula = matchingProds.find(p => p.hpp_formula);
                    const repProd = prodWithFormula || matchingProds[0];
                    selectedHppProdukId.value = repProd ? String(repProd.id) : '';

                    // 1. CARI PADA HPP_MODEL_BOM TERLEBIH DAHULU
                    const bomListFromDb = (hppModelBom.value || []).filter(b => b.model_key === modelKey && b.status !== 'Nonaktif');
                    if (bomListFromDb.length > 0) {
                        hppBOMItems.value = bomListFromDb.map((b, idx) => {
                            const hargaBeli = normalizeHppNumber(b.harga_satuan_beli, 0);
                            const isiBeli = normalizeHppNumber(b.isi_satuan_beli, 1);
                            const hargaPakai = normalizeHppNumber(b.harga_satuan_pakai, hargaBeli / isiBeli);
                            const qtyPakai = normalizeHppNumber(b.qty_pakai_per_pcs !== undefined ? b.qty_pakai_per_pcs : b.qty_per_unit, 1);
                            const waste = normalizeHppNumber(b.waste_pct, 0);
                            const qtyEfektif = Math.round(qtyPakai * (1 + waste / 100) * 100000) / 100000;
                            return {
                                id: b.id_bom || ('BOM-' + Date.now() + '-' + idx),
                                id_bom: b.id_bom,
                                model_key: modelKey,
                                id_bahan_hpp: b.id_bahan_hpp || '',
                                id_bahan_gudang: b.id_bahan_gudang || b.id_bahan || '',
                                id_bahan: b.id_bahan_gudang || b.id_bahan || '',
                                kode_bahan: b.kode_bahan || '',
                                nama_bahan: b.nama_bahan || b.nama_item || 'Material',
                                nama_item: b.nama_bahan || b.nama_item || 'Material',
                                kategori: b.kategori || 'bahan_utama',
                                satuan_beli: b.satuan_beli || 'Meter',
                                isi_satuan_beli: isiBeli,
                                satuan_pakai: b.satuan_pakai || b.satuan || 'Meter',
                                satuan: b.satuan_pakai || b.satuan || 'Meter',
                                harga_satuan_beli: hargaBeli,
                                harga_satuan_pakai: hargaPakai,
                                harga_satuan: hargaPakai,
                                qty_pakai_per_pcs: qtyPakai,
                                qty_per_unit: qtyPakai,
                                waste_pct: waste,
                                qty_efektif_per_pcs: qtyEfektif,
                                hpp_material_per_pcs: Math.round(hargaPakai * qtyEfektif * 100) / 100,
                                catatan: b.catatan || '',
                                status: b.status || 'Aktif'
                            };
                        });

                        // Muat snapshot upah, margin & packaging jika tersimpan di produk
                        if (repProd && repProd.hpp_formula) {
                            try {
                                const f = typeof repProd.hpp_formula === 'string' ? JSON.parse(repProd.hpp_formula) : repProd.hpp_formula;
                                if (f && typeof f === 'object') {
                                    hppBatchQty.value = Number(f.batchQty) || 100;
                                    hppTargetMarginPct.value = f.targetMarginPct !== undefined ? Number(f.targetMarginPct) : 30;
                                    hppTargetMarginGrosirPct.value = f.targetMarginGrosirPct !== undefined ? Number(f.targetMarginGrosirPct) : 20;
                                    if (f.marginMode) hppMarginMode.value = f.marginMode;
                                    if (f.upah) {
                                        hppUpah.potong = Number(f.upah.potong) || 0;
                                        hppUpah.jahit = Number(f.upah.jahit) || 0;
                                        hppUpah.finishing = Number(f.upah.finishing) || 0;
                                        hppUpah.packing = Number(f.upah.packing) || 0;
                                    }
                                    if (f.packaging) {
                                        hppJasaPackaging.sablon_bordir = Number(f.packaging.sablon_bordir) || 0;
                                        hppJasaPackaging.hangtag_label = Number(f.packaging.hangtag_label) || 0;
                                        hppJasaPackaging.plastik_polybag = Number(f.packaging.plastik_polybag) || 0;
                                        hppJasaPackaging.aksesoris_kemasan = Number(f.packaging.aksesoris_kemasan) || 0;
                                    }
                                    if (f.operasional) {
                                        hppOperasional.mode = f.operasional.mode || 'nominal';
                                        hppOperasional.persen = Number(f.operasional.persen) || 0;
                                        hppOperasional.nominal = Number(f.operasional.nominal) || 0;
                                    } else {
                                        hppOperasional.mode = 'nominal';
                                        hppOperasional.persen = 0;
                                        hppOperasional.nominal = 0;
                                    }
                                    hppManualCosts.value = Array.isArray(f.manualCosts) ? JSON.parse(JSON.stringify(f.manualCosts)) : [];
                                }
                            } catch(e) {}
                        } else {
                            hppUpah.potong = Number(repProd?.upah_potong || model.upah_potong || 0);
                            hppUpah.jahit = Number(repProd?.upah_jahit || model.upah_jahit || 0);
                        }
                        initHppAktualForModel(model);
                        return;
                    }

                    // 2. FALLBACK KE SNAPSHOT LAMA (hpp_formula)
                    let loadedFromSnapshot = false;
                    if (repProd && repProd.hpp_formula) {
                        try {
                            const f = typeof repProd.hpp_formula === 'string' ? JSON.parse(repProd.hpp_formula) : repProd.hpp_formula;
                            if (f && typeof f === 'object') {
                                hppBatchQty.value = Number(f.batchQty) || 100;
                                hppTargetMarginPct.value = f.targetMarginPct !== undefined ? Number(f.targetMarginPct) : 30;
                                hppTargetMarginGrosirPct.value = f.targetMarginGrosirPct !== undefined ? Number(f.targetMarginGrosirPct) : 20;
                                if (f.marginMode) hppMarginMode.value = f.marginMode;
                                if (Array.isArray(f.bom) && f.bom.length) {
                                    hppBOMItems.value = f.bom.map((it, idx) => {
                                        const bh = (bahanHPP.value || []).find(x => String(x.id) === String(it.id_bahan_hpp));
                                        const hargaPakai = normalizeHppNumber(it.harga_satuan_pakai || it.harga_satuan || (bh ? getHargaPerSatuanPakai(bh) : 0), 0);
                                        const qty = normalizeHppNumber(it.qty_pakai_per_pcs !== undefined ? it.qty_pakai_per_pcs : it.qty_per_unit, 1);
                                        const waste = normalizeHppNumber(it.waste_pct, bh ? bh.waste_default : 0);
                                        return {
                                            id: it.id_bom || it.id || ('BOM-OLD-' + idx),
                                            id_bom: it.id_bom || '',
                                            model_key: modelKey,
                                            id_bahan_hpp: it.id_bahan_hpp || '',
                                            id_bahan_gudang: it.id_bahan_gudang || it.id_bahan || '',
                                            id_bahan: it.id_bahan_gudang || it.id_bahan || '',
                                            kode_bahan: it.kode_bahan || (bh ? bh.kode : ''),
                                            nama_bahan: it.nama_bahan || it.nama_item || (bh ? bh.nama : 'Bahan'),
                                            nama_item: it.nama_bahan || it.nama_item || (bh ? bh.nama : 'Bahan'),
                                            kategori: it.kategori || (bh ? bh.kategori : 'bahan_utama'),
                                            satuan_beli: it.satuan_beli || (bh ? bh.satuan_beli : 'Meter'),
                                            isi_satuan_beli: normalizeHppNumber(it.isi_satuan_beli || (bh ? bh.isi_satuan_beli : 1), 1),
                                            satuan_pakai: it.satuan_pakai || it.satuan || 'Meter',
                                            satuan: it.satuan_pakai || it.satuan || 'Meter',
                                            harga_satuan_beli: normalizeHppNumber(it.harga_satuan_beli || (bh ? bh.harga_satuan_beli : hargaPakai), hargaPakai),
                                            harga_satuan_pakai: hargaPakai,
                                            harga_satuan: hargaPakai,
                                            qty_pakai_per_pcs: qty,
                                            qty_per_unit: qty,
                                            waste_pct: waste,
                                            qty_efektif_per_pcs: Math.round(qty * (1 + waste / 100) * 100000) / 100000,
                                            hpp_material_per_pcs: Math.round(hargaPakai * qty * (1 + waste / 100) * 100) / 100,
                                            catatan: it.catatan || '',
                                            status: 'Aktif'
                                        };
                                    });
                                } else {
                                    hppBOMItems.value = [];
                                }
                                if (f.upah) {
                                    hppUpah.potong = Number(f.upah.potong) || 0;
                                    hppUpah.jahit = Number(f.upah.jahit) || 0;
                                    hppUpah.finishing = Number(f.upah.finishing) || 0;
                                    hppUpah.packing = Number(f.upah.packing) || 0;
                                }
                                if (f.packaging) {
                                    hppJasaPackaging.sablon_bordir = Number(f.packaging.sablon_bordir) || 0;
                                    hppJasaPackaging.hangtag_label = Number(f.packaging.hangtag_label) || 0;
                                    hppJasaPackaging.plastik_polybag = Number(f.packaging.plastik_polybag) || 0;
                                    hppJasaPackaging.aksesoris_kemasan = Number(f.packaging.aksesoris_kemasan) || 0;
                                }
                                if (f.operasional) {
                                    hppOperasional.mode = f.operasional.mode || 'nominal';
                                    hppOperasional.persen = Number(f.operasional.persen) || 0;
                                    hppOperasional.nominal = Number(f.operasional.nominal) || 0;
                                } else {
                                    hppOperasional.mode = 'nominal';
                                    hppOperasional.persen = 0;
                                    hppOperasional.nominal = 0;
                                }
                                hppManualCosts.value = Array.isArray(f.manualCosts) ? JSON.parse(JSON.stringify(f.manualCosts)) : [];
                                loadedFromSnapshot = true;
                            }
                        } catch(e) {
                            console.warn('Gagal mem-parse legacy hpp_formula:', e);
                        }
                    }

                    // 3. MODEL BARU BELUM MEMILIKI FORMULA
                    if (!loadedFromSnapshot) {
                        hppBatchQty.value = 100;
                        hppTargetMarginPct.value = 30;
                        hppTargetMarginGrosirPct.value = 20;
                        hppMarginMode.value = 'margin';
                        hppUpah.potong = Number(repProd?.upah_potong || model.upah_potong || 0);
                        hppUpah.jahit = Number(repProd?.upah_jahit || model.upah_jahit || 0);
                        hppUpah.finishing = 0;
                        hppUpah.packing = 0;
                        hppJasaPackaging.sablon_bordir = 0;
                        hppJasaPackaging.hangtag_label = 0;
                        hppJasaPackaging.plastik_polybag = 0;
                        hppJasaPackaging.aksesoris_kemasan = 0;
                        hppOperasional.mode = 'nominal';
                        hppOperasional.persen = 0;
                        hppOperasional.nominal = 0;
                        hppManualCosts.value = [];
                        hppBOMItems.value = [];
                    }

                    initHppAktualForModel(model);
                };

                // Kompatibilitas loadHppFormula
                const loadHppFormula = (idOrKey) => {
                    const p = produk.value.find(x => String(x.id) === String(idOrKey));
                    const modelKey = p ? (p.model_tas || p.nama || '').trim() : String(idOrKey);
                    loadHppFormulaByModel(modelKey);
                };

                // Watcher ganti model HPP
                watch(selectedHppModelKey, (newKey) => {
                    if (newKey) {
                        loadHppFormulaByModel(newKey);
                    }
                });

                // Auto select model pertama saat tab HPP dibuka jika belum ada yang terpilih
                watch(currentTab, (newTab) => {
                    if (newTab === 'hpp_produksi' && !selectedHppModelKey.value && uniqueHppModelList.value.length) {
                        selectedHppModelKey.value = uniqueHppModelList.value[0].model_key;
                    }
                });

                // Shortcut untuk membuka HPP dari tabel produk
                const bukaKalkulatorHpp = (idProduk) => {
                    const p = produk.value.find(x => String(x.id) === String(idProduk));
                    const modelKey = p ? (p.model_tas || p.nama || '').trim() : '';
                    if (modelKey) {
                        selectedHppModelKey.value = modelKey;
                    } else if (uniqueHppModelList.value.length) {
                        selectedHppModelKey.value = uniqueHppModelList.value[0].model_key;
                    }
                    switchTab('hpp_produksi');
                };

                // Tambah baris BOM item
                const tambahItemBOM = (kategori = 'bahan_utama') => {
                    let defBahanHpp = null;
                    if (kategori === 'bahan_utama') {
                        defBahanHpp = (bahanHPP.value || []).find(b => (b.kategori||'').toLowerCase().includes('utama') || (b.kategori||'').toLowerCase().includes('kain')) || (bahanHPP.value || [])[0];
                    } else if (kategori === 'furing') {
                        defBahanHpp = (bahanHPP.value || []).find(b => (b.kategori||'').toLowerCase().includes('furing') || (b.kategori||'').toLowerCase().includes('lapis')) || (bahanHPP.value || [])[0];
                    } else {
                        defBahanHpp = (bahanHPP.value || []).find(b => (b.kategori||'').toLowerCase().includes('aksesoris') || (b.kategori||'').toLowerCase().includes('trims')) || (bahanHPP.value || [])[0];
                    }

                    if (defBahanHpp) {
                        const hargaPakai = getHargaPerSatuanPakai(defBahanHpp);
                        const waste = defBahanHpp.waste_default !== undefined && defBahanHpp.waste_default !== '' ? Number(defBahanHpp.waste_default) : (kategori === 'bahan_utama' ? 3 : 0);
                        hppBOMItems.value.push({
                            id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
                            id_bom: '',
                            model_key: selectedHppModelKey.value,
                            kategori: kategori,
                            id_bahan_hpp: String(defBahanHpp.id),
                            id_bahan_gudang: defBahanHpp.id_bahan_gudang || '',
                            id_bahan: defBahanHpp.id_bahan_gudang || '',
                            kode_bahan: defBahanHpp.kode || '',
                            nama_bahan: defBahanHpp.nama,
                            nama_item: defBahanHpp.nama,
                            satuan_beli: defBahanHpp.satuan_beli || defBahanHpp.satuan || 'Meter',
                            isi_satuan_beli: normalizeHppNumber(defBahanHpp.isi_satuan_beli, 1),
                            satuan_pakai: defBahanHpp.satuan_pakai || defBahanHpp.satuan || 'Meter',
                            satuan: defBahanHpp.satuan_pakai || defBahanHpp.satuan || 'Meter',
                            harga_satuan_beli: normalizeHppNumber(defBahanHpp.harga_satuan_beli || defBahanHpp.harga_standar, 0),
                            harga_satuan_pakai: hargaPakai,
                            harga_satuan: hargaPakai,
                            qty_pakai_per_pcs: 1,
                            qty_per_unit: 1,
                            waste_pct: waste,
                            catatan: '',
                            status: 'Aktif'
                        });
                    } else {
                        hppBOMItems.value.push({
                            id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
                            id_bom: '',
                            model_key: selectedHppModelKey.value,
                            kategori: kategori,
                            id_bahan_hpp: '',
                            id_bahan_gudang: '',
                            id_bahan: '',
                            kode_bahan: '',
                            nama_bahan: kategori === 'bahan_utama' ? 'Material Utama' : 'Aksesoris/Trims',
                            nama_item: kategori === 'bahan_utama' ? 'Material Utama' : 'Aksesoris/Trims',
                            satuan_beli: 'Meter',
                            isi_satuan_beli: 1,
                            satuan_pakai: 'Meter',
                            satuan: 'Meter',
                            harga_satuan_beli: 0,
                            harga_satuan_pakai: 0,
                            harga_satuan: 0,
                            qty_pakai_per_pcs: 1,
                            qty_per_unit: 1,
                            waste_pct: kategori === 'bahan_utama' ? 3 : 0,
                            catatan: '',
                            status: 'Aktif'
                        });
                    }
                };

                // Hapus baris BOM
                const hapusItemBOM = (index) => {
                    hppBOMItems.value.splice(index, 1);
                };

                // Saat bahan dipilih dari master gudang fisik
                const onPilihBahanBOM = (item) => {
                    if (!item.id_bahan) return;
                    const b = bahan.value.find(x => String(x.id) === String(item.id_bahan));
                    if (b) {
                        item.nama_bahan = b.nama;
                        item.nama_item = b.nama;
                        item.kode_bahan = b.kode || '';
                        item.satuan_pakai = b.satuan || item.satuan_pakai || 'Pcs';
                        item.satuan = item.satuan_pakai;
                        item.harga_satuan_pakai = Number(b.harga_beli || 0);
                        item.harga_satuan = item.harga_satuan_pakai;
                        item.id_bahan_gudang = b.id;
                    }
                };

                // Saat bahan dipilih dari dropdown Bahan Baku HPP / Gudang
                const onPilihBahanHppBOM = (item) => {
                    if (!item.id_bahan_hpp) {
                        if (item.id_bahan) onPilihBahanBOM(item);
                        return;
                    }
                    if (String(item.id_bahan_hpp).startsWith('gudang_')) {
                        const rawId = String(item.id_bahan_hpp).replace('gudang_', '');
                        item.id_bahan = rawId;
                        item.id_bahan_gudang = rawId;
                        const b = bahan.value.find(x => String(x.id) === rawId);
                        if (b) {
                            item.nama_bahan = b.nama;
                            item.nama_item = b.nama;
                            item.kode_bahan = b.kode || '';
                            item.satuan_pakai = b.satuan || 'Pcs';
                            item.satuan = item.satuan_pakai;
                            item.harga_satuan_pakai = Number(b.harga_beli || 0);
                            item.harga_satuan = item.harga_satuan_pakai;
                        }
                        return;
                    }
                    const bh = (bahanHPP.value || []).find(x => String(x.id) === String(item.id_bahan_hpp));
                    if (bh) {
                        item.nama_bahan = bh.nama;
                        item.nama_item = bh.nama;
                        item.kode_bahan = bh.kode || '';
                        item.kategori = bh.kategori || item.kategori;
                        item.satuan_beli = bh.satuan_beli || bh.satuan || 'Meter';
                        item.isi_satuan_beli = normalizeHppNumber(bh.isi_satuan_beli, 1);
                        item.satuan_pakai = bh.satuan_pakai || bh.satuan || 'Meter';
                        item.satuan = item.satuan_pakai;
                        item.harga_satuan_beli = normalizeHppNumber(bh.harga_satuan_beli || bh.harga_standar, 0);
                        item.harga_satuan_pakai = getHargaPerSatuanPakai(bh);
                        item.harga_satuan = item.harga_satuan_pakai;
                        if (bh.waste_default !== undefined && bh.waste_default !== null && bh.waste_default !== '') {
                            item.waste_pct = Number(bh.waste_default);
                        }
                        item.id_bahan_gudang = bh.id_bahan_gudang || '';
                        item.id_bahan = bh.id_bahan_gudang || '';
                    }
                };

                // Salin BOM dari Model Lain
                const salinBomModel = (sourceModelKey) => {
                    if (!sourceModelKey || !selectedHppModelKey.value) {
                        showNotification('Pilih model sumber yang ingin disalin formulanya.', 'warning');
                        return;
                    }
                    if (sourceModelKey === selectedHppModelKey.value) {
                        showNotification('Model sumber tidak boleh sama dengan model aktif.', 'warning');
                        return;
                    }

                    let sourceItems = (hppModelBom.value || []).filter(b => b.model_key === sourceModelKey && b.status !== 'Nonaktif');
                    if (!sourceItems.length) {
                        const srcProd = (produk.value || []).find(p => (p.model_tas || p.nama || '').trim() === sourceModelKey && p.hpp_formula);
                        if (srcProd) {
                            try {
                                const f = typeof srcProd.hpp_formula === 'string' ? JSON.parse(srcProd.hpp_formula) : srcProd.hpp_formula;
                                if (Array.isArray(f.bom) && f.bom.length) sourceItems = f.bom;
                            } catch(e) {}
                        }
                    }

                    if (!sourceItems.length) {
                        showNotification(`Model "${sourceModelKey}" belum memiliki resep material BOM untuk disalin.`, 'warning');
                        return;
                    }

                    hppBOMItems.value = sourceItems.map((it, idx) => {
                        const cloned = JSON.parse(JSON.stringify(it));
                        cloned.id = 'BOM-' + Date.now() + '-' + idx + '-' + Math.random().toString(36).substr(2, 3);
                        cloned.id_bom = '';
                        cloned.model_key = selectedHppModelKey.value;
                        return cloned;
                    });

                    isCopyBomModalOpen.value = false;
                    showNotification(`Berhasil menyalin ${hppBOMItems.value.length} komponen material dari model "${sourceModelKey}".`);
                };

                // Tambah biaya tambahan manual
                const tambahBiayaManualHpp = () => {
                    hppManualCosts.value.push({
                        id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
                        deskripsi: '',
                        tipe_alokasi: 'per_batch',
                        nominal: 0
                    });
                };

                // Hapus biaya tambahan manual
                const hapusBiayaManualHpp = (index) => {
                    hppManualCosts.value.splice(index, 1);
                };

                // Total Biaya Per Kategori Material
                const totalBiayaBahanUtamaPerUnit = computed(() => {
                    return hppBOMItems.value
                        .filter(it => (it.kategori || '').toLowerCase().includes('utama') || (it.kategori || '').toLowerCase().includes('kain'))
                        .reduce((sum, it) => sum + getSubtotalBOMItem(it), 0);
                });

                const totalBiayaFuringFoamPerUnit = computed(() => {
                    return hppBOMItems.value
                        .filter(it => (it.kategori || '').toLowerCase().includes('furing') || (it.kategori || '').toLowerCase().includes('foam') || (it.kategori || '').toLowerCase().includes('busa'))
                        .reduce((sum, it) => sum + getSubtotalBOMItem(it), 0);
                });

                const totalBiayaAksesorisPerUnit = computed(() => {
                    return hppBOMItems.value
                        .filter(it => (it.kategori || '').toLowerCase().includes('aksesoris'))
                        .reduce((sum, it) => sum + getSubtotalBOMItem(it), 0);
                });

                const totalBiayaTrimsPerUnit = computed(() => {
                    return hppBOMItems.value
                        .filter(it => (it.kategori || '').toLowerCase().includes('trims'))
                        .reduce((sum, it) => sum + getSubtotalBOMItem(it), 0);
                });

                const totalBiayaPackagingBOMPerUnit = computed(() => {
                    return hppBOMItems.value
                        .filter(it => (it.kategori || '').toLowerCase().includes('packaging'))
                        .reduce((sum, it) => sum + getSubtotalBOMItem(it), 0);
                });

                // Total Seluruh Material BOM per Unit
                const totalBiayaBahanPerUnit = computed(() => {
                    return hppBOMItems.value.reduce((sum, it) => sum + getSubtotalBOMItem(it), 0);
                });

                // Total Upah Langsung per Unit
                const totalBiayaUpahPerUnit = computed(() => {
                    return Number(hppUpah.potong || 0) +
                           Number(hppUpah.jahit || 0) +
                           Number(hppUpah.finishing || 0) +
                           Number(hppUpah.packing || 0);
                });

                // Total Biaya Jasa & Packaging Tambahan per Unit
                const totalBiayaJasaPackagingPerUnit = computed(() => {
                    return Number(hppJasaPackaging.sablon_bordir || 0) +
                           Number(hppJasaPackaging.hangtag_label || 0) +
                           Number(hppJasaPackaging.plastik_polybag || 0) +
                           Number(hppJasaPackaging.aksesoris_kemasan || 0) +
                           totalBiayaPackagingBOMPerUnit.value;
                });

                // Biaya Manual: per item per unit
                const getNominalManualPerUnit = (m) => {
                    const nom = Number(m.nominal || 0);
                    if (m.tipe_alokasi === 'per_batch') {
                        const batch = Math.max(1, Number(hppBatchQty.value || 1));
                        return nom / batch;
                    }
                    return nom;
                };

                // Total Biaya Tambahan Manual per Unit
                const totalBiayaManualPerUnit = computed(() => {
                    return hppManualCosts.value.reduce((sum, m) => sum + getNominalManualPerUnit(m), 0);
                });

                // Total Biaya Tambahan Manual per 1 Batch
                const totalBiayaManualBatch = computed(() => {
                    const batch = Math.max(1, Number(hppBatchQty.value || 1));
                    return hppManualCosts.value.reduce((sum, m) => {
                        const nom = Number(m.nominal || 0);
                        return sum + (m.tipe_alokasi === 'per_batch' ? nom : (nom * batch));
                    }, 0);
                });

                // Total Biaya Operasional / Overhead Pabrik per Unit
                const totalBiayaOperasionalPerUnit = computed(() => {
                    if (hppOperasional.mode === 'persen') {
                        const basis = totalBiayaBahanPerUnit.value + totalBiayaUpahPerUnit.value;
                        return Math.round((basis * Number(hppOperasional.persen || 0)) / 100);
                    }
                    return Math.round(Number(hppOperasional.nominal || 0));
                });
                const biayaOperasionalPerUnit = totalBiayaOperasionalPerUnit;

                // HPP STANDAR (FINAL COSTING PER 1 PCS TAS)
                const hppStandarPerUnit = computed(() => {
                    return Math.round(
                        totalBiayaBahanPerUnit.value +
                        totalBiayaUpahPerUnit.value +
                        totalBiayaJasaPackagingPerUnit.value +
                        totalBiayaOperasionalPerUnit.value +
                        totalBiayaManualPerUnit.value
                    );
                });

                // Total Biaya HPP 1 Batch
                const totalHppBatch = computed(() => {
                    return hppStandarPerUnit.value * Math.max(1, Number(hppBatchQty.value || 1));
                });

                // Status Versi HPP Aktif
                const activeHppVersion = computed(() => {
                    if (activeHppModel.value && activeHppModel.value.hpp_version) {
                        return activeHppModel.value.hpp_version;
                    }
                    return 'DRAFT';
                });

                // Simulasi Kebutuhan Material Batch vs Stok Gudang
                const batchRequirementList = computed(() => {
                    const batch = Math.max(1, Number(hppBatchQty.value || 100));
                    return hppBOMItems.value.map(it => {
                        const qtyEfektif = getQtyEfektifPerPcs(it);
                        const totalBatch = Math.round(qtyEfektif * batch * 1000) / 1000;
                        let stokGudang = null;
                        let unitGudang = it.satuan_pakai || it.satuan || 'Pcs';
                        const gId = it.id_bahan_gudang || it.id_bahan;
                        if (gId) {
                            const bg = (bahan.value || []).find(b => String(b.id) === String(gId));
                            if (bg) {
                                stokGudang = Number(bg.stok || 0);
                                unitGudang = bg.satuan || unitGudang;
                            }
                        }
                        let statusStok = 'TANPA_LINK';
                        if (stokGudang !== null) {
                            if (stokGudang < totalBatch) statusStok = 'KURANG';
                            else if (stokGudang < totalBatch * 1.2) statusStok = 'MENIPIS';
                            else statusStok = 'AMAN';
                        }
                        return {
                            id: it.id,
                            nama: it.nama_bahan || it.nama_item || 'Material',
                            kategori: it.kategori || 'Bahan',
                            satuan: it.satuan_pakai || it.satuan || 'Meter',
                            qty_per_pcs: it.qty_pakai_per_pcs || it.qty_per_unit || 0,
                            waste_pct: it.waste_pct || 0,
                            qty_efektif: qtyEfektif,
                            total_kebutuhan: totalBatch,
                            stok_gudang: stokGudang,
                            status_stok: statusStok
                        };
                    });
                });

                // Helper status ketersediaan stok fisik gudang per item BOM
                const getBOMItemStokInfo = (item) => {
                    if (!item) return { linked: false, stok: null, status: 'TANPA_LINK', text: 'Non-Gudang', badgeClass: 'bg-slate-100 text-slate-500 border-slate-200' };
                    const gId = item.id_bahan_gudang || item.id_bahan;
                    if (!gId) return { linked: false, stok: null, status: 'TANPA_LINK', text: 'Non-Gudang', badgeClass: 'bg-slate-100 text-slate-500 border-slate-200' };
                    const bg = (bahan.value || []).find(b => String(b.id) === String(gId));
                    if (!bg) return { linked: false, stok: null, status: 'TANPA_LINK', text: 'Non-Gudang', badgeClass: 'bg-slate-100 text-slate-500 border-slate-200' };
                    const stok = Number(bg.stok || 0);
                    const batch = Math.max(1, Number(hppBatchQty.value || 100));
                    const butuh = Math.round(getQtyEfektifPerPcs(item) * batch * 1000) / 1000;
                    if (stok < butuh) return { linked: true, stok, butuh, status: 'KURANG', text: 'TIDAK CUKUP', badgeClass: 'bg-rose-50 text-rose-700 border-rose-200' };
                    if (stok < butuh * 1.2) return { linked: true, stok, butuh, status: 'MENIPIS', text: 'MENIPIS', badgeClass: 'bg-amber-50 text-amber-700 border-amber-200' };
                    return { linked: true, stok, butuh, status: 'AMAN', text: 'AMAN', badgeClass: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
                };

                // Thin compatibility helper untuk template
                const getStokGudangForBOM = (item) => {
                    const info = getBOMItemStokInfo(item);
                    return info && info.linked ? info.stok : null;
                };

                // Persentase Komponen Biaya HPP Standar
                const hppBreakdownPct = computed(() => {
                    const total = hppStandarPerUnit.value;
                    if (!total || total <= 0) return { bahan: 0, upah: 0, packaging: 0, operasional: 0, manual: 0 };
                    return {
                        bahan: Math.round((totalBiayaBahanPerUnit.value / total) * 100),
                        upah: Math.round((totalBiayaUpahPerUnit.value / total) * 100),
