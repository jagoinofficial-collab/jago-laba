                    });

                    // 3. INFORMASI PO & VENDOR (TWO COLUMNS)
                    const infoY = header.contentStartY;
                    doc.setFillColor(...PALE);
                    doc.setDrawColor(...LINE);
                    doc.setLineWidth(0.3);
                    doc.roundedRect(m, infoY, (contentW / 2) - 3, 34, 2, 2, 'FD');
                    doc.roundedRect(m + (contentW / 2) + 3, infoY, (contentW / 2) - 3, 34, 2, 2, 'FD');

                    // Kolom Kiri: Detail Pesanan
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(8.5);
                    doc.setTextColor(...BLUE);
                    doc.text('RINCIAN SURAT PESANAN', m + 5, infoY + 6.5);
                    
                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(8);
                    doc.setTextColor(...MUTED);
                    doc.text('No. PO Vendor', m + 5, infoY + 13);
                    doc.text('Tanggal Terbit', m + 5, infoY + 19.5);
                    doc.text('Jatuh Tempo', m + 5, infoY + 26);

                    doc.setFont('helvetica', 'bold');
                    doc.setTextColor(...TEXT);
                    doc.text(': ' + (pv.no_po_vendor || '-'), m + 32, infoY + 13);
                    doc.text(': ' + formatDateID(pv.tanggal_po), m + 32, infoY + 19.5);
                    doc.text(': ' + (pv.jatuh_tempo ? formatDateID(pv.jatuh_tempo) : '-'), m + 32, infoY + 26);

                    // Kolom Kanan: Detail Vendor / Mitra Makloon
                    const rColX = m + (contentW / 2) + 8;
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(8.5);
                    doc.setTextColor(...BLUE);
                    doc.text('MITRA VENDOR / SUPPLIER', rColX, infoY + 6.5);

                    const vData = supplier.value.find(s => s.id === pv.id_vendor || s.nama === pv.nama_vendor);
                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(8);
                    doc.setTextColor(...MUTED);
                    doc.text('Nama Mitra', rColX, infoY + 13);
                    doc.text('No. WhatsApp / HP', rColX, infoY + 19.5);
                    doc.text('Status Barang', rColX, infoY + 26);

                    doc.setFont('helvetica', 'bold');
                    doc.setTextColor(...TEXT);
                    doc.text(': ' + (pv.nama_vendor || '-'), rColX + 32, infoY + 13);
                    doc.text(': ' + (vData ? (vData.no_wa || vData.kontak || vData.telepon || '-') : '-'), rColX + 32, infoY + 19.5);
                    doc.text(': ' + (pv.status_barang || 'Proses Jahit'), rColX + 32, infoY + 26);

                    // 4. TABEL ITEM PESANAN (AUTOTABLE)
                    ensureAutoTable(doc);
                    const tableBody = [
                        [
                            '1',
                            pv.kode_sku || '-',
                            (pv.nama_produk || '-') + (pv.varian_warna ? ' (' + pv.varian_warna + ')' : ''),
                            Number(pv.qty_order || 0).toLocaleString('id-ID') + ' pcs',
                            formatRupiah(pv.harga_beli_satuan || 0),
                            formatRupiah(pv.subtotal || 0)
                        ]
                    ];

                    doc.autoTable({
                        startY: infoY + 38,
                        margin: { left: m, right: m },
                        head: [['NO', 'KODE SKU', 'DESKRIPSI PRODUK / VARIAN', 'QTY ORDER', 'HARGA SATUAN', 'SUBTOTAL']],
                        body: tableBody,
                        theme: 'grid',
                        styles: {
                            font: 'helvetica',
                            fontSize: 8.5,
                            cellPadding: 3.5,
                            lineColor: LINE,
                            lineWidth: 0.25,
                            textColor: TEXT
                        },
                        headStyles: {
                            fillColor: BLUE,
                            textColor: [255, 255, 255],
                            fontStyle: 'bold',
                            halign: 'center',
                            fontSize: 8.5
                        },
                        columnStyles: {
                            0: { cellWidth: 10, halign: 'center' },
                            1: { cellWidth: 26, fontStyle: 'bold', halign: 'center' },
                            2: { cellWidth: 72 },
                            3: { cellWidth: 24, halign: 'center', fontStyle: 'bold' },
                            4: { cellWidth: 26, halign: 'right' },
                            5: { cellWidth: 24, halign: 'right', fontStyle: 'bold' }
                        },
                        alternateRowStyles: {
                            fillColor: [252, 253, 255]
                        }
                    });

                    let curY = doc.lastAutoTable.finalY + 6;

                    // 5. BOX FINANSIAL & CATATAN
                    const boxH = 46;
                    const noteW = (contentW * 0.52);
                    const finW = contentW - noteW - 5;
                    const finX = m + noteW + 5;

                    // Box Catatan (Kiri)
                    doc.setFillColor(...PALE);
                    doc.setDrawColor(...LINE);
                    doc.roundedRect(m, curY, noteW, boxH, 2, 2, 'FD');

                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(8.5);
                    doc.setTextColor(...BLUE);
                    doc.text('CATATAN / KETENTUAN QC:', m + 4, curY + 6);

                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(7.5);
                    doc.setTextColor(...MUTED);
                    const noteText = pv.catatan ? pv.catatan : '1. Standar jahitan rapi, presisi, dan sesuai sample acuan.\n2. Seluruh barang wajib lolos Quality Control saat tiba di gudang.\n3. Dokumen ini sah sebagai tanda pemesanan makloon resmi.';
                    const splitNotes = doc.splitTextToSize(noteText, noteW - 8);
                    doc.text(splitNotes, m + 4, curY + 12);

                    if (pv.tgl_diterima) {
                        doc.setFont('helvetica', 'bold');
                        doc.setTextColor(...GREEN);
                        doc.text('Barang telah diterima gudang pada: ' + formatDateID(pv.tgl_diterima), m + 4, curY + boxH - 4);
                    }

                    // Box Finansial Rekapitulasi (Kanan)
                    doc.setFillColor(255, 255, 255);
                    doc.setDrawColor(...LINE);
                    doc.roundedRect(finX, curY, finW, boxH, 2, 2, 'FD');

                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(8);
                    doc.setTextColor(...MUTED);

                    // Subtotal
                    doc.text('Subtotal:', finX + 4, curY + 8);
                    doc.setTextColor(...TEXT);
                    doc.text(formatRupiah(pv.subtotal || 0), finX + finW - 4, curY + 8, { align: 'right' });

                    // Biaya Tambahan
                    doc.setTextColor(...MUTED);
                    doc.text('Biaya Ongkir/Lain:', finX + 4, curY + 14);
                    doc.setTextColor(...TEXT);
                    doc.text(formatRupiah(pv.biaya_tambahan || 0), finX + finW - 4, curY + 14, { align: 'right' });

                    // Garis Pembatas
                    doc.setDrawColor(...LINE);
                    doc.line(finX + 4, curY + 17, finX + finW - 4, curY + 17);

                    // Total Pembelian
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(9);
                    doc.setTextColor(...BLUE);
                    doc.text('Total Pembelian:', finX + 4, curY + 22.5);
                    doc.text(formatRupiah(pv.total_pembelian || 0), finX + finW - 4, curY + 22.5, { align: 'right' });

                    // Nominal Bayar (DP / Pelunasan)
                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(8);
                    doc.setTextColor(...GREEN);
                    doc.text('Dibayar (DP / Kas):', finX + 4, curY + 29.5);
                    doc.setFont('helvetica', 'bold');
                    doc.text(formatRupiah(pv.nominal_bayar || 0), finX + finW - 4, curY + 29.5, { align: 'right' });

                    // Sisa Hutang
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(9);
                    doc.setTextColor(Number(pv.sisa_hutang || 0) > 0 ? RED[0] : GREEN[0],
                                     Number(pv.sisa_hutang || 0) > 0 ? RED[1] : GREEN[1],
                                     Number(pv.sisa_hutang || 0) > 0 ? RED[2] : GREEN[2]);
                    doc.text('Sisa Hutang:', finX + 4, curY + 38);
                    doc.text(formatRupiah(pv.sisa_hutang || 0), finX + finW - 4, curY + 38, { align: 'right' });

                    curY += boxH + 16;

                    // 6. DUAL TANDA TANGAN (PEMBELI & MITRA VENDOR)
                    const sigW = 65;
                    const sigY = curY;

                    // Pihak Pembeli (PT JAGO LABA)
                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(8.5);
                    doc.setTextColor(...MUTED);
                    doc.text('Dipesan Oleh,', m + (sigW / 2), sigY, { align: 'center' });
                    doc.text('Purchasing / Keuangan', m + (sigW / 2), sigY + 4.5, { align: 'center' });

                    doc.setDrawColor(148, 163, 184);
                    doc.line(m + 5, sigY + 24, m + sigW - 5, sigY + 24);

                    doc.setFont('helvetica', 'bold');
                    doc.setTextColor(...TEXT);
                    doc.text(String(profil.nama || 'PT JAGO LABA KONVEKSI'), m + (sigW / 2), sigY + 28.5, { align: 'center' });

                    // Pihak Vendor Makloon
                    const sig2X = pageW - m - sigW;
                    doc.setFont('helvetica', 'normal');
                    doc.setTextColor(...MUTED);
                    doc.text('Diterima & Disetujui,', sig2X + (sigW / 2), sigY, { align: 'center' });
                    doc.text('Mitra Vendor Makloon', sig2X + (sigW / 2), sigY + 4.5, { align: 'center' });

                    doc.setDrawColor(148, 163, 184);
                    doc.line(sig2X + 5, sigY + 24, sig2X + sigW - 5, sigY + 24);

                    doc.setFont('helvetica', 'bold');
                    doc.setTextColor(...TEXT);
                    doc.text(String(pv.nama_vendor || 'Mitra Vendor'), sig2X + (sigW / 2), sigY + 28.5, { align: 'center' });

                    // 7. FOOTER
                    addPdfPageFooter(doc, 'Surat Pesanan Makloon • No. PO ' + pv.no_po_vendor + ' • Auto-generated by ' + (profil.nama || 'Sistem Konveksi'));

                    const cleanNoPo = String(pv.no_po_vendor || 'PO').replace(/[^a-zA-Z0-9_-]/g, '_');
                    return {
                        doc: doc,
                        fileName: 'PO_Vendor_' + cleanNoPo + '.pdf'
                    };
                };

                // Helper PDF: Cetak Surat Pesanan PO Vendor / Invoice Makloon A4 Portrait Resmi
                const cetakInvoicePOVendorPDF = (pv) => {
                    try {
                        if (!pv) return;
                        showNotification('Mempersiapkan Surat Pesanan / Invoice Vendor PDF...');
                        const res = buildInvoicePOVendorPDF(pv);
                        if (res && res.doc) {
                            eksekusiUnduhPDF(res.doc, res.fileName);
                        }
                    } catch(e) {
                        console.error('Gagal cetak PDF PO Vendor:', e);
                        showNotification('Gagal membuat PDF: ' + (e.message || e), 'error');
                    }
                };

                // Helper WhatsApp: Bagikan Rincian Surat Pesanan Vendor ke Kontak Vendor (dengan link PDF Drive)
                const bagikanWAPembelianVendor = (pv) => {
                    if (!pv) return;
                    const v = supplier.value.find(s => s.id === pv.id_vendor || s.nama === pv.nama_vendor);
                    let no = '';
                    if (v && (v.no_wa || v.kontak || v.telepon)) {
                        no = v.no_wa || v.kontak || v.telepon;
                    }

                    bagikanDokumenWhatsApp({
                        tipe: 'Pembelian_Vendor',
                        data: pv,
                        phone: no,
                        docKey: 'PO_Vendor-' + pv.no_po_vendor,
                        docName: 'PO_Vendor_' + String(pv.no_po_vendor).replace(/[^a-zA-Z0-9_-]/g, '_') + '.pdf',
                        tabName: 'Pembelian_Vendor',
                        tableRef: pembelianVendor,
                        pdfBuilder: () => buildInvoicePOVendorPDF(pv),
                        messageBuilder: (pdfUrl) => {
                            let msg = "Halo *" + (pv.nama_vendor || 'Mitra Vendor') + "*,\n";
                            msg += "Berikut Surat Pesanan / Purchase Order dari *" + (profil.nama || 'JAGO LABA') + "*:\n";
                            msg += "━━━━━━━━━━━━━━━━━━\n";
                            msg += "📄 *PURCHASE ORDER*\n";
                            msg += "▪️ No. PO: *" + pv.no_po_vendor + "*\n";
                            msg += "▪️ Tanggal: " + formatDateID(pv.tanggal_po) + "\n";
                            msg += "▪️ Produk: *" + pv.nama_produk + "*\n";
                            if (pv.varian_warna) msg += "▪️ Varian: " + pv.varian_warna + "\n";
                            msg += "▪️ Qty Order: *" + Number(pv.qty_order || 0) + " pcs*\n";
                            msg += "▪️ Harga Satuan: " + formatRupiah(pv.harga_beli_satuan) + "\n";
                            if (Number(pv.biaya_tambahan || 0) > 0) {
                                msg += "▪️ Biaya Ongkir / Lain: " + formatRupiah(pv.biaya_tambahan) + "\n";
                            }
                            msg += "▪️ Total Pembelian: *" + formatRupiah(pv.total_pembelian) + "*\n";
                            msg += "▪️ Status Bayar: *" + pv.status_bayar + "*\n";
                            if (Number(pv.nominal_bayar || 0) > 0) {
                                msg += "▪️ Sudah Dibayar: " + formatRupiah(pv.nominal_bayar) + "\n";
                            }
                            if (Number(pv.sisa_hutang || 0) > 0) {
                                msg += "▪️ Sisa Tagihan: " + formatRupiah(pv.sisa_hutang) + "\n";
                                if (pv.jatuh_tempo) msg += "▪️ Jatuh Tempo: " + formatDateID(pv.jatuh_tempo) + "\n";
                            }
                            msg += "▪️ Status Barang: " + (pv.status_barang || 'Proses Jahit') + "\n";
                            if (pv.catatan) {
                                msg += "📌 Catatan QC: " + pv.catatan + "\n";
                            }
                            msg += "━━━━━━━━━━━━━━━━━━\n";
                            msg += "📎 *INVOICE / SURAT PESANAN PDF:*\n" + pdfUrl + "\n";
                            msg += "━━━━━━━━━━━━━━━━━━\n";
                            msg += "Mohon konfirmasi apabila pesanan telah diterima dan diproses.\nTerima kasih atas kerja samanya.\n";
                            msg += "*- " + (profil.nama || 'JAGO LABA') + " -*";
                            return msg;
                        }
                    });
                };

                // Helper: Terima Barang Masuk Gudang (Inbound ke Master Stok)
                const openModalTerimaBarang = (po) => {
                    modalTerimaBarangState.po = po;
                    modalTerimaBarangState.tanggal_diterima = new Date().toISOString().split('T')[0];
                    modalTerimaBarangState.isOpen = true;
                };

                const eksekusiTerimaBarang = async () => {
                    try {
                        const po = modalTerimaBarangState.po;
                        if (!po) return;

                        // 1. Update status di Pembelian Vendor
                        po.status_barang = 'Diterima Gudang';
                        po.tgl_diterima = modalTerimaBarangState.tanggal_diterima || new Date().toISOString().split('T')[0];

                        // 2. Inbound ke Master Stok
                        sinkronkanMasterStokDariProduk();
                        let targetSku = masterStok.value.find(s => s.kode_sku === po.kode_sku);
                        if (!targetSku) {
                            const newStkId = generateUniqueIdStokItem();
                            targetSku = {
                                id_stok_item: newStkId,
                                id_produk: po.id_produk || '',
                                id_variasi: po.id_variasi || '',
                                kode_sku: po.kode_sku,
                                nama_produk: po.nama_produk,
                                varian_warna: po.varian_warna || 'Standar',
                                kategori: 'Tas',
                                stok_awal: 0,
                                masuk_jahit: 0,
                                masuk_vendor: 0,
                                keluar_penjualan: 0,
                                stok_akhir: 0,
                                satuan: 'Pcs',
                                hpp_rata_rata: Number(po.harga_beli_satuan || 0),
                                total_valuasi_stok: 0,
                                min_alert: 20,
                                status_stok: 'Aman',
                                id_gudang: 'GDG-UTAMA',
                                last_updated: new Date().toISOString()
                            };
                            masterStok.value.push(targetSku);
                        } else {
                            if (!targetSku.id_stok_item) targetSku.id_stok_item = generateUniqueIdStokItem();
                            if (!targetSku.id_gudang) targetSku.id_gudang = 'GDG-UTAMA';
                        }

                        const stokLama = Number(targetSku.stok_akhir || 0);
                        const hppLama = Number(targetSku.hpp_rata_rata || 0);
                        const qtyIn = Number(po.qty_order || 0);
                        const hargaBeli = Number(po.harga_beli_satuan || 0);

                        // Rumus Weighted Average HPP
                        const totalUnit = stokLama + qtyIn;
                        const hppBaru = totalUnit > 0 ? Math.round(((stokLama * hppLama) + (qtyIn * hargaBeli)) / totalUnit) : hargaBeli;

                        targetSku.masuk_vendor = Number(targetSku.masuk_vendor || 0) + qtyIn;
                        targetSku.stok_akhir = (Number(targetSku.stok_awal || 0) + Number(targetSku.masuk_jahit || 0) + targetSku.masuk_vendor) - Number(targetSku.keluar_penjualan || 0);
                        targetSku.hpp_rata_rata = hppBaru;
                        targetSku.total_valuasi_stok = targetSku.stok_akhir * hppBaru;
                        targetSku.status_stok = targetSku.stok_akhir > Number(targetSku.min_alert || 20) ? 'Aman' : (targetSku.stok_akhir > 0 ? 'Menipis' : 'Habis');
                        targetSku.last_updated = new Date().toISOString();

                        // Selaraskan ke Produk.stok
                        if (Array.isArray(produk.value)) {
                            produk.value.forEach(p => {
                                const pSku = String(p.kode || p.sku || '').trim().toUpperCase();
                                const pStkId = String(p.id_stok_item || '').trim().toUpperCase();
                                if ((pSku && pSku === String(targetSku.kode_sku || '').toUpperCase()) || (pStkId && pStkId === String(targetSku.id_stok_item || '').toUpperCase())) {
                                    p.stok = targetSku.stok_akhir;
                                    if (!p.id_stok_item && targetSku.id_stok_item) p.id_stok_item = targetSku.id_stok_item;
                                }
                            });
                        }

                        // 3. Catat ke Mutasi_Stok (Single Inventory Ledger)
                        const nowVnd = new Date();
                        const recordMutasi = {
                            id_mutasi: 'MUT-VND-' + Date.now(),
                            tanggal: po.tgl_diterima || nowVnd.toISOString().split('T')[0],
                            waktu: nowVnd.toTimeString().split(' ')[0],
                            id_stok_item: targetSku.id_stok_item || '',
                            id_produk: targetSku.id_produk || '',
                            kode_sku: targetSku.kode_sku,
                            nama_produk: targetSku.nama_produk,
                            varian_warna: targetSku.varian_warna,
                            id_gudang: targetSku.id_gudang || 'GDG-UTAMA',
                            jenis_mutasi: 'IN_VENDOR',
                            no_referensi: po.no_po_vendor,
                            pihak_terkait: po.nama_vendor,
                            qty_masuk: qtyIn,
                            qty_keluar: 0,
                            stok_sebelum: stokLama,
                            stok_setelah: targetSku.stok_akhir,
                            saldo_berjalan: targetSku.stok_akhir,
                            hpp_satuan: hargaBeli,
                            total_nilai: qtyIn * hargaBeli,
                            sumber_modul: 'VENDOR',
                            jenis_referensi: 'PO',
                            id_referensi: po.id || '',
                            idempotency_key: 'STOCK|VENDOR|' + po.no_po_vendor + '|' + (targetSku.id_stok_item || targetSku.kode_sku),
                            operator: userRole.value || 'Admin',
                            created_at: nowVnd.toISOString()
                        };
                        mutasiStok.value.unshift(recordMutasi);

                        modalTerimaBarangState.isOpen = false;
                        showNotification('✅ Barang ' + qtyIn + ' pcs berhasil diterima! Master Stok & HPP diperbarui.', 'success');
                        simpanCacheLokal();

                        showPopup({
                            type: 'success',
                            title: 'Penerimaan Barang Selesai',
                            message: 'Penerimaan ' + qtyIn + ' pcs untuk ' + (po.no_po_vendor || 'PO Vendor') + ' (' + (po.nama_produk || '-') + ') berhasil dibukukan! Stok gudang dan HPP Rata-Rata Berjalan telah diperbarui secara otomatis.',
                            confirmText: 'Buka Master Stok',
                            cancelText: 'Tutup',
                            onConfirm: () => {
                                switchTab('master_stok');
                            },
                            autoClose: 0
                        });

                        syncMultiTabs({
                            'Pembelian_Vendor': pembelianVendor.value,
                            'Master_Stok': masterStok.value,
                            'Mutasi_Stok': mutasiStok.value,
                            'Produk': produk.value
                        });
                    } catch(e) {
                        showPopup({
                            type: 'error',
                            title: 'Gagal Menerima Barang',
                            message: 'Terjadi kesalahan saat memproses penerimaan barang: ' + (e?.message || e)
                        });
                    }
                };

                // Helper: Inbound dari SPK Jahit yang selesai
                const syncStokFromJahit = (spk) => {
                    try {
                        sinkronkanMasterStokDariProduk();
                        const namaP = getProdukName(spk.id_produk);
                        const qtyFinish = Number(spk.qty_selesai || spk.qty || 0);
                        if (qtyFinish <= 0) return;

                        // Cari SKU berdasarkan identitas stok
                        let targetSku = resolveStockItem({ id_produk: spk.id_produk, kode_sku: spk.kode_sku, nama_produk: namaP }) ||
                                        masterStok.value.find(s => s.nama_produk === namaP) ||
                                        masterStok.value[0];

                        if (targetSku) {
                            if (!targetSku.id_stok_item) targetSku.id_stok_item = generateUniqueIdStokItem();
                            if (!targetSku.id_gudang) targetSku.id_gudang = 'GDG-UTAMA';

                            const stokLamaJahit = Number(targetSku.stok_akhir || 0);
                            targetSku.masuk_jahit = Number(targetSku.masuk_jahit || 0) + qtyFinish;
                            targetSku.stok_akhir = (Number(targetSku.stok_awal || 0) + targetSku.masuk_jahit + Number(targetSku.masuk_vendor || 0)) - Number(targetSku.keluar_penjualan || 0);
                            targetSku.total_valuasi_stok = targetSku.stok_akhir * Number(targetSku.hpp_rata_rata || 0);
                            targetSku.status_stok = targetSku.stok_akhir > Number(targetSku.min_alert || 20) ? 'Aman' : (targetSku.stok_akhir > 0 ? 'Menipis' : 'Habis');
                            targetSku.last_updated = new Date().toISOString();

                            // Sinkronkan ke Produk.stok
                            if (Array.isArray(produk.value)) {
                                produk.value.forEach(p => {
                                    const pSku = String(p.kode || p.sku || '').trim().toUpperCase();
                                    const pStkId = String(p.id_stok_item || '').trim().toUpperCase();
                                    if ((pSku && pSku === String(targetSku.kode_sku || '').toUpperCase()) || (pStkId && pStkId === String(targetSku.id_stok_item || '').toUpperCase())) {
                                        p.stok = targetSku.stok_akhir;
                                        if (!p.id_stok_item && targetSku.id_stok_item) p.id_stok_item = targetSku.id_stok_item;
                                    }
                                });
                            }

                            const nowJht = new Date();
                            const noRefJahit = spk.id_dokumen || spk.nomor_spk || ('SPK-JHT-' + (spk.id || ''));
                            mutasiStok.value.unshift({
                                id_mutasi: 'MUT-JHT-' + Date.now(),
                                tanggal: spk.tanggal_selesai || nowJht.toISOString().split('T')[0],
                                waktu: nowJht.toTimeString().split(' ')[0],
                                id_stok_item: targetSku.id_stok_item || '',
                                id_produk: targetSku.id_produk || spk.id_produk || '',
                                kode_sku: targetSku.kode_sku,
                                nama_produk: targetSku.nama_produk,
                                varian_warna: targetSku.varian_warna,
                                id_gudang: targetSku.id_gudang || 'GDG-UTAMA',
                                jenis_mutasi: 'IN_JAHIT',
                                no_referensi: noRefJahit,
                                pihak_terkait: getPegawaiName(spk.id_pegawai) || 'Tim Penjahit',
                                qty_masuk: qtyFinish,
                                qty_keluar: 0,
                                stok_sebelum: stokLamaJahit,
                                stok_setelah: targetSku.stok_akhir,
                                saldo_berjalan: targetSku.stok_akhir,
                                hpp_satuan: targetSku.hpp_rata_rata,
                                total_nilai: qtyFinish * Number(targetSku.hpp_rata_rata || 0),
                                sumber_modul: 'JAHIT',
                                jenis_referensi: 'SPK',
                                id_referensi: spk.id || '',
                                idempotency_key: 'STOCK|JAHIT|' + (spk.nomor_spk || spk.id || '') + '|' + (targetSku.id_stok_item || targetSku.kode_sku),
                                operator: userRole.value || 'Admin',
                                created_at: nowJht.toISOString()
                            });

                            syncMultiTabs({
                                'Master_Stok': masterStok.value,
                                'Mutasi_Stok': mutasiStok.value,
                                'Produk': produk.value
                            });
                        }
                    } catch(e) {
                        console.error("Gagal auto-sync stok dari jahit:", e);
                    }
                };

                // C. MODUL HUTANG USAHA (ACCOUNTS PAYABLE INTEGRATION)
                const daftarHutangGabungan = computed(() => {
                    const list = [];
                    const todayTime = new Date().setHours(0,0,0,0);

                    // 1. Dari Pembelian Bahan Baku
                    if (Array.isArray(pembelian.value)) {
                        pembelian.value.forEach(p => {
                            const total = Number(p.total_harga || 0);
                            const bayar = Number(p.nominal_bayar || 0);
                            const sisa = p.sisa_hutang !== undefined ? Number(p.sisa_hutang) : (total - bayar);
                            const isTempo = p.status_bayar === 'Tempo' || p.status_bayar === 'DP' || sisa > 0;
                            
                            if (isTempo || sisa > 0) {
                                const tglJatuhTempo = p.jatuh_tempo || p.tanggal || '';
                                let statusTempo = 'aman';
                                let labelTempo = 'Aman';

                                if (sisa <= 0) {
                                    statusTempo = 'lunas';
                                    labelTempo = 'Lunas';
                                } else if (tglJatuhTempo) {
                                    const jtTime = new Date(tglJatuhTempo).setHours(0,0,0,0);
                                    const diffDays = Math.round((jtTime - todayTime) / 86400000);
                                    if (diffDays < 0) {
                                        statusTempo = 'overdue';
                                        labelTempo = 'Lewat ' + Math.abs(diffDays) + ' Hari';
                                    } else if (diffDays <= 7) {
                                        statusTempo = 'mendekati';
                                        labelTempo = diffDays === 0 ? 'Hari Ini' : diffDays + ' Hari Lagi';
                                    } else {
                                        statusTempo = 'aman';
                                        labelTempo = diffDays + ' Hari Lagi';
                                    }
                                }

                                list.push({
                                    id_unique: 'PB-' + (p.id || p.id_dokumen),
                                    no_faktur: p.id_dokumen || ('FAK-PB-' + p.id),
                                    tanggal: p.tanggal,
                                    tipe: 'Supplier Bahan',
                                    id_mitra: p.id_supplier,
                                    nama_mitra: getSupplierName(p.id_supplier) || 'Supplier Bahan',
                                    keterangan_produk: 'Material Kain & Aksesoris',
                                    total_tagihan: total,
                                    nominal_bayar: bayar,
                                    sisa_hutang: Math.max(0, sisa),
                                    jatuh_tempo: tglJatuhTempo,
                                    status_tempo: statusTempo,
                                    label_tempo: labelTempo,
                                    raw_source: 'pembelian',
                                    raw_item: p
                                });
                            }
                        });
                    }

                    // 2. Dari Pembelian Vendor Makloon
                    if (Array.isArray(pembelianVendor.value)) {
                        pembelianVendor.value.forEach(pv => {
                            const total = Number(pv.total_pembelian || 0);
                            const bayar = Number(pv.nominal_bayar || 0);
                            const sisa = Number(pv.sisa_hutang !== undefined ? pv.sisa_hutang : (total - bayar));
                            const isTempo = pv.status_bayar === 'Tempo' || pv.status_bayar === 'DP' || sisa > 0;

                            if (isTempo || sisa > 0) {
                                const tglJatuhTempo = pv.jatuh_tempo || pv.tanggal_po || '';
                                let statusTempo = 'aman';
                                let labelTempo = 'Aman';

                                if (sisa <= 0) {
                                    statusTempo = 'lunas';
                                    labelTempo = 'Lunas';
                                } else if (tglJatuhTempo) {
                                    const jtTime = new Date(tglJatuhTempo).setHours(0,0,0,0);
                                    const diffDays = Math.round((jtTime - todayTime) / 86400000);
                                    if (diffDays < 0) {
                                        statusTempo = 'overdue';
                                        labelTempo = 'Lewat ' + Math.abs(diffDays) + ' Hari';
                                    } else if (diffDays <= 7) {
                                        statusTempo = 'mendekati';
                                        labelTempo = diffDays === 0 ? 'Hari Ini' : diffDays + ' Hari Lagi';
                                    } else {
                                        statusTempo = 'aman';
                                        labelTempo = diffDays + ' Hari Lagi';
                                    }
                                }

                                list.push({
                                    id_unique: 'PV-' + pv.no_po_vendor,
                                    no_faktur: pv.no_po_vendor,
                                    tanggal: pv.tanggal_po,
                                    tipe: 'Vendor Makloon',
                                    id_mitra: pv.id_vendor,
                                    nama_mitra: pv.nama_vendor,
                                    keterangan_produk: (pv.nama_produk || 'Tas') + ' (' + (pv.qty_order || 0) + ' pcs)',
                                    total_tagihan: total,
                                    nominal_bayar: bayar,
                                    sisa_hutang: Math.max(0, sisa),
                                    jatuh_tempo: tglJatuhTempo,
                                    status_tempo: statusTempo,
                                    label_tempo: labelTempo,
                                    raw_source: 'pembelian_vendor',
                                    raw_item: pv
                                });
                            }
                        });
                    }

                    return list.sort((a, b) => new Date(b.tanggal || 0) - new Date(a.tanggal || 0));
                });

                const filteredHutangUsaha = computed(() => {
                    let list = daftarHutangGabungan.value.slice();
                    if (searchHutang.value) {
                        const q = searchHutang.value.toLowerCase().trim();
                        list = list.filter(h => 
                            h.no_faktur.toLowerCase().includes(q) ||
                            h.nama_mitra.toLowerCase().includes(q) ||
                            h.keterangan_produk.toLowerCase().includes(q)
                        );
                    }
                    if (filterTipeKreditur.value !== 'semua') {
                        list = list.filter(h => h.tipe === filterTipeKreditur.value);
                    }
                    if (filterStatusHutang.value === 'aktif') {
                        list = list.filter(h => h.sisa_hutang > 0);
                    } else if (filterStatusHutang.value === 'overdue') {
                        list = list.filter(h => h.status_tempo === 'overdue' && h.sisa_hutang > 0);
                    } else if (filterStatusHutang.value === 'mendekati') {
                        list = list.filter(h => h.status_tempo === 'mendekati' && h.sisa_hutang > 0);
                    } else if (filterStatusHutang.value === 'lunas') {
                        list = list.filter(h => h.sisa_hutang <= 0);
                    }
                    return list;
                });

                const kpiHutang = computed(() => {
                    const all = daftarHutangGabungan.value;
                    let totalSisaHutang = 0;
                    let countAktif = 0;
                    let totalOverdue = 0;
                    let countOverdue = 0;
                    let totalMendekati = 0;
                    let countMendekati = 0;
                    let totalTerbayar = 0;
                    let countLunas = 0;

                    all.forEach(h => {
                        totalTerbayar += h.nominal_bayar;
                        if (h.sisa_hutang > 0) {
                            totalSisaHutang += h.sisa_hutang;
                            countAktif++;
                            if (h.status_tempo === 'overdue') {
                                totalOverdue += h.sisa_hutang;
                                countOverdue++;
                            } else if (h.status_tempo === 'mendekati') {
                                totalMendekati += h.sisa_hutang;
                                countMendekati++;
                            }
                        } else {
                            countLunas++;
                        }
                    });

                    return { totalSisaHutang, countAktif, totalOverdue, countOverdue, totalMendekati, countMendekati, totalTerbayar, countLunas };
                });

                // =============================================================
                // LAPORAN KEUANGAN EKSEKUTIF & ANALISIS ARUS KAS TERPADU
                // =============================================================
                const rasioLikuiditasKas = computed(() => {
                    const sisaHutang = Number(kpiHutang.value?.totalSisaHutang || 0);
                    const kas = Number(totalSemuaSaldo.value || 0);
                    if (sisaHutang <= 0) return 100;
                    return Math.min(999, Math.round((kas / sisaHutang) * 100));
                });

                const getKategoriKeuangan = (k) => {
                    if (k && k.kategori) return k.kategori;
                    const ket = (k?.keterangan || '').toLowerCase();
                    if (ket.includes('pelunasan hutang') || ket.includes('bayar hutang')) return 'Pelunasan Hutang';
                    if (ket.includes('makloon') || ket.includes('po vendor') || ket.includes('vendor')) return 'Vendor Makloon';
                    if (ket.includes('faktur pembelian') || ket.includes('pembelian bahan') || ket.includes('bahan')) return 'Bahan Baku';
                    if (ket.includes('spk') || ket.includes('cutting') || ket.includes('jahit') || ket.includes('upah')) return 'Upah Produksi';
                    if (ket.includes('kasbon')) return 'Kasbon Pegawai';
                    if (ket.includes('piutang')) return 'Piutang Pegawai';
                    if (k?.tipe === 'Masuk') return 'Pendapatan';
                    return 'Operasional';
                };

                const getBadgeKategoriKeuangan = (kategori) => {
                    switch (kategori) {
                        case 'Bahan Baku': return 'bg-sky-50 text-sky-700 border-sky-200';
                        case 'Vendor Makloon': return 'bg-purple-50 text-purple-700 border-purple-200';
                        case 'Pelunasan Hutang': return 'bg-rose-50 text-rose-700 border-rose-200';
                        case 'Upah Produksi': return 'bg-amber-50 text-amber-800 border-amber-200';
                        case 'Kasbon Pegawai': return 'bg-orange-50 text-orange-700 border-orange-200';
                        case 'Piutang Pegawai': return 'bg-cyan-50 text-cyan-700 border-cyan-200';
                        case 'Pendapatan': return 'bg-emerald-50 text-emerald-700 border-emerald-200';
                        default: return 'bg-slate-100 text-slate-700 border-slate-200';
                    }
                };

                let chartTrenInstance = null;
                let chartKomposisiInstance = null;

                const renderKeuanganCharts = () => {
                    if (typeof window.Chart === 'undefined') return;
                    if (currentTab.value !== 'keuangan') return;

                    Vue.nextTick(() => {
                        const canvasTren = document.getElementById('chartTrenArusKas');
                        const canvasKomposisi = document.getElementById('chartKomposisiBeban');
                        if (!canvasTren || !canvasKomposisi) return;

                        if (chartTrenInstance) {
                            try { chartTrenInstance.destroy(); } catch (e) {}
                            chartTrenInstance = null;
                        }
                        if (chartKomposisiInstance) {
                            try { chartKomposisiInstance.destroy(); } catch (e) {}
                            chartKomposisiInstance = null;
                        }

                        // Label 6 bulan terakhir
                        const months = [];
                        const now = new Date();
                        for (let i = 5; i >= 0; i--) {
                            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                            months.push({
                                year: d.getFullYear(),
                                month: d.getMonth(),
                                label: d.toLocaleDateString('id-ID', { month: 'short' }) + " " + String(d.getFullYear()).slice(-2)
                            });
                        }

                        const monthlyInflow = months.map(m => {
                            return keuangan.value.filter(k => {
                                if (k.tipe !== 'Masuk') return false;
                                const kd = new Date(k.tanggal);
                                return !isNaN(kd) && kd.getFullYear() === m.year && kd.getMonth() === m.month;
                            }).reduce((sum, c) => sum + (Number(c.nominal) || 0), 0);
                        });

                        const monthlyOutflow = months.map(m => {
                            return keuangan.value.filter(k => {
                                if (k.tipe !== 'Keluar') return false;
                                const kd = new Date(k.tanggal);
                                return !isNaN(kd) && kd.getFullYear() === m.year && kd.getMonth() === m.month;
                            }).reduce((sum, c) => sum + (Number(c.nominal) || 0), 0);
                        });

                        chartTrenInstance = new window.Chart(canvasTren, {
                            type: 'bar',
                            data: {
                                labels: months.map(m => m.label),
                                datasets: [
                                    {
                                        label: 'Pemasukan (Inflow)',
                                        data: monthlyInflow,
                                        backgroundColor: 'rgba(16, 185, 129, 0.85)',
                                        borderColor: '#059669',
                                        borderWidth: 1,
                                        borderRadius: 6
                                    },
                                    {
                                        label: 'Pengeluaran (Outflow)',
                                        data: monthlyOutflow,
                                        backgroundColor: 'rgba(244, 63, 94, 0.85)',
                                        borderColor: '#e11d48',
                                        borderWidth: 1,
                                        borderRadius: 6
                                    }
                                ]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: {
                                        position: 'top',
                                        labels: { boxWidth: 12, font: { family: 'Inter', weight: 'bold', size: 10 } }
                                    },
                                    tooltip: {
                                        callbacks: {
                                            label: function(ctx) {
                                                return ctx.dataset.label + ': ' + formatRupiah(ctx.raw);
                                            }
                                        }
                                    }
                                },
                                scales: {
                                    y: {
                                        beginAtZero: true,
                                        ticks: {
                                            callback: function(v) { return formatRupiahSingkat(v); },
                                            font: { family: 'Inter', size: 9 }
                                        },
                                        grid: { color: 'rgba(241, 245, 249, 1)' }
                                    },
                                    x: {
                                        grid: { display: false },
                                        ticks: { font: { family: 'Inter', weight: 'bold', size: 10 } }
                                    }
                                }
                            }
                        });

                        // 2. Komposisi Beban Pengeluaran
                        const catTotals = {
                            'Bahan Baku': 0,
                            'Vendor Makloon': 0,
                            'Upah Produksi': 0,
                            'Pelunasan Hutang': 0,
                            'Kasbon Pegawai': 0,
                            'Operasional': 0
                        };

                        keuangan.value.filter(k => k.tipe === 'Keluar' && isDateInRange(k.tanggal)).forEach(k => {
                            const cat = getKategoriKeuangan(k);
                            if (catTotals[cat] != null) {
                                catTotals[cat] += Number(k.nominal || 0);
                            } else {
                                catTotals['Operasional'] += Number(k.nominal || 0);
                            }
                        });

                        const compLabels = Object.keys(catTotals);
                        let compValues = compLabels.map(l => catTotals[l]);
                        const sumComp = compValues.reduce((a,b)=>a+b,0);
                        if (sumComp === 0) {
                            compValues = [1, 1, 1, 1, 1, 1];
                        }

                        chartKomposisiInstance = new window.Chart(canvasKomposisi, {
                            type: 'doughnut',
                            data: {
                                labels: compLabels,
                                datasets: [{
                                    data: compValues,
                                    backgroundColor: [
                                        '#0284c7',
                                        '#9333ea',
                                        '#f59e0b',
                                        '#e11d48',
                                        '#ea580c',
                                        '#64748b'
                                    ],
                                    borderWidth: 2,
                                    borderColor: '#ffffff'
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: {
                                        position: 'bottom',
                                        labels: { boxWidth: 10, font: { family: 'Inter', weight: 'bold', size: 9 }, padding: 8 }
                                    },
                                    tooltip: {
                                        callbacks: {
                                            label: function(ctx) {
                                                const val = sumComp > 0 ? formatRupiah(ctx.raw) : 'Rp 0';
                                                return ctx.label + ': ' + val;
                                            }
                                        }
                                    }
                                },
                                cutout: '65%'
                            }
                        });
                    });
                };

                const exportKeuanganExcel = () => {
                    try {
                        if (typeof window.XLSX === 'undefined') {
                            showNotification('Library Excel belum siap.');
                            return;
                        }
                        const dataRows = filteredKeuangan.value.map(k => ({
                            'ID Jurnal': k.id || '-',
                            'Tanggal': formatDateID(k.tanggal),
                            'Kategori': getKategoriKeuangan(k),
                            'Keterangan': k.keterangan || '-',
                            'Akun Rekening': getRekeningName(k.id_rekening),
                            'Arus Kas': k.tipe,
                            'Nilai Mutasi (Rp)': Number(k.nominal) || 0
                        }));
                        const ws = window.XLSX.utils.json_to_sheet(dataRows);
                        const wb = window.XLSX.utils.book_new();
                        window.XLSX.utils.book_append_sheet(wb, ws, 'Laporan_Keuangan');
                        const filename = 'Laporan_Keuangan_JagoLaba_' + new Date().toISOString().slice(0,10) + '.xlsx';
                        window.XLSX.writeFile(wb, filename);
                        showNotification('Laporan Keuangan berhasil diekspor ke Excel!');
                    } catch (e) {
                        console.error('exportKeuanganExcel error:', e);
                        showNotification('Gagal ekspor Excel: ' + e.message);
                    }
                };

                const triggerBackupDrive = () => {
                    showNotification('Memproses snapshot backup ke storage server...');
                    if (window.jlApi && window.jlApi.run) {
                        window.jlApi.run
                            .withSuccessHandler((res) => {
                                showNotification('Backup database berhasil disimpan di storage server!');
                            })
                            .withFailureHandler((err) => {
                                showNotification('Pemberitahuan backup: ' + (err?.message || err));
                            })
                            .backupSekarangJagoLaba();
                    } else {
                        showNotification('Snapshot database berhasil dibuat.');
                    }
                };

                const openModalBayarHutang = (faktur) => {
                    modalBayarHutangState.faktur = faktur;

                    // Cerdas: otomatis pilih rekening kas yang memiliki saldo mencukupi
                    let defaultRekId = faktur.raw_item?.akun_kas || faktur.raw_item?.id_rekening || '';
                    const sisa = Number(faktur.sisa_hutang || 0);
                    
                    if (!defaultRekId || getSaldoRekening(defaultRekId) < sisa) {
                        const rekCukup = rekening.value.find(r => getSaldoRekening(r.id) >= sisa);
                        const rekTerbesar = [...rekening.value].sort((a,b) => getSaldoRekening(b.id) - getSaldoRekening(a.id))[0];
                        defaultRekId = rekCukup?.id || rekTerbesar?.id || rekening.value[0]?.id || '';
                    }

                    modalBayarHutangState.form = {
                        tanggal: new Date().toISOString().split('T')[0],
                        nominal: sisa,
                        id_rekening: defaultRekId,
                        catatan: 'Pelunasan faktur ' + (faktur.no_faktur || '')
                    };
                    modalBayarHutangState.error = '';
                    modalBayarHutangState.isOpen = true;
                };

                const openModalBayarHutangDariPO = (po) => {
                    const mapped = daftarHutangGabungan.value.find(h => h.no_faktur === po.no_po_vendor);
                    if (mapped) {
                        openModalBayarHutang(mapped);
                    } else {
                        openModalBayarHutang({
                            id_unique: 'PV-' + po.no_po_vendor,
                            no_faktur: po.no_po_vendor,
                            tanggal: po.tanggal_po,
                            tipe: 'Vendor Makloon',
                            id_mitra: po.id_vendor,
                            nama_mitra: po.nama_vendor,
                            total_tagihan: Number(po.total_pembelian || 0),
                            nominal_bayar: Number(po.nominal_bayar || 0),
                            sisa_hutang: Number(po.sisa_hutang || 0),
                            jatuh_tempo: po.jatuh_tempo,
                            raw_source: 'pembelian_vendor',
                            raw_item: po
                        });
                    }
                };

                const submitBayarHutang = async () => {
                    try {
                        const { tanggal, nominal, id_rekening, catatan } = modalBayarHutangState.form;
                        const h = modalBayarHutangState.faktur;
                        if (!h) return;
                        if (nominal <= 0) throw new Error('Nominal pembayaran harus lebih dari 0.');
                        if (nominal > h.sisa_hutang) throw new Error('Nominal bayar tidak boleh melebihi sisa hutang.');
                        if (!id_rekening) throw new Error('Silakan pilih rekening kas pembayaran.');

                        const rek = rekening.value.find(r => String(r.id) === String(id_rekening));
                        if (!rek) throw new Error('Rekening kas tidak ditemukan.');

                        modalBayarHutangState.isOpen = false;
                        showNotification('✅ Pembayaran hutang ' + h.no_faktur + ' sebesar ' + formatRupiah(nominal) + ' berhasil dibukukan!', 'success');
                        simpanCacheLokal();

                        // 5. SUPER FAST BATCH DATABASE SYNC (Single-call background write)
                        const batchPayload = {
                            'Keuangan': keuangan.value,

                            message: `Pembayaran ${h.no_faktur} (${h.nama_mitra}) sebesar ${formatRupiah(nominal)} telah berhasil dibukukan! Transaksi otomatis tersinkron ke Buku Hutang Usaha, Rekening Kas (${rek.nama || rek.nama_bank || ''}), dan Laporan Keuangan.`,
                            confirmText: 'Buka Buku Hutang',
                            cancelText: 'Tutup',
                            onConfirm: () => {
                                switchTab('hutang');
                            },
                            autoClose: 0
                        });
                    } catch(e) {
                        modalBayarHutangState.error = e?.message || 'Gagal memproses pembayaran hutang.';

                const openModalRiwayatHutang = (faktur) => {

                        .sort((a, b) => new Date(b.tanggal_bayar || 0) - new Date(a.tanggal_bayar || 0));

                const bukaModalSelesai = (t, id) => {

                };

                const simpanKasbon = async () => {
                    if(formData.nominal_kasbon > (formData.temp_upah - formData.kasbon_lama)) {

                    });

                    const backupPotong = JSON.parse(JSON.stringify(potong.value));
                    const backupJahit = JSON.parse(JSON.stringify(jahit.value));

                                const oldSPKIdx = oldSPKList.value.findIndex(p => String(p.id) === String(oldKasbon.id_dokumen));

                                await syncMultiTabs([

                            let docData = null;

                                    potong.value[idx].kasbon = (Number(potong.value[idx].kasbon) || 0) + Number(formData.nominal_kasbon);

                                    docData = potong.value[idx];

                            kasbonList.value.unshift(nKR);

                            await syncMultiTabs([
                                { tab: formData.tipe_spk === 'potong' ? 'Potong' : 'Jahit', data: formData.tipe_spk === 'potong' ? potong.value : jahit.value },
                                { tab: 'Kasbon', data: kasbonList.value },
                                { tab: 'Keuangan', data: keuangan.value }
                            ]);
                            
                            generateAndSavePDF("Bukti_Kasbon_" + div, docData, formData.nominal_kasbon, tKasbon); 
                            closeModal();
                            showPopup({ type: 'success', title: 'Kasbon Dicairkan', message: 'Dana kasbon berhasil dicairkan dan tersimpan di database storage server.', autoClose: 2200 });
                        }
                    } catch (err) {
                        potong.value = backupPotong;
                        jahit.value = backupJahit;
                        kasbonList.value = backupKasbon;
                        keuangan.value = backupKeuangan;
                        simpanCacheLokal();
                        showPopup({ type: 'error', title: 'Gagal Menyimpan Kasbon', message: 'Gagal menyimpan transaksi ke storage server: ' + (err?.message || err), autoClose: 0 });
                    }
                };

                const simpanData = async () => {
                    if (modalType.value === 'bahan') {
                        eksekusiSimpanMaterial();
                        return;
                    }
                    if (modalType.value === 'pembelian') {
                        eksekusiPostingPembelian();
                        return;
                    }
                    const newId = Date.now().toString(); 
                    let pDate = new Date().toISOString().split('T')[0];
                    if(formData.tanggal && formData.tanggal.includes('/')) { 
                        const p = formData.tanggal.split('/'); 
                        if(p.length === 3) pDate = p[2] + "-" + p[1] + "-" + p[0]; 
                    } else if(formData.tanggal) {
                        pDate = formData.tanggal;
                    }
                    const r = JSON.parse(JSON.stringify(formData));
                    
                    showPopup({
                        type: 'info',
                        loading: true,
                        title: 'Menyimpan Data...',
                        message: 'Sedang memproses dan menyinkronkan data ke storage server...',
                        autoClose: 0
                    });

                    const snapshots = {
                        rekening: JSON.parse(JSON.stringify(rekening.value)),
                        produk: JSON.parse(JSON.stringify(produk.value)),
                        bahan: JSON.parse(JSON.stringify(bahan.value)),
                        bahan_hpp: JSON.parse(JSON.stringify(bahanHPP.value)),
                        pegawai: JSON.parse(JSON.stringify(pegawai.value)),
                        supplier: JSON.parse(JSON.stringify(supplier.value)),
                        pembelian: JSON.parse(JSON.stringify(pembelian.value)),
                        distribusi: JSON.parse(JSON.stringify(distribusi.value)),
                        potong: JSON.parse(JSON.stringify(potong.value)),
                        jahit: JSON.parse(JSON.stringify(jahit.value)),
                        kasbon: JSON.parse(JSON.stringify(kasbonList.value)),
                        keuangan: JSON.parse(JSON.stringify(keuangan.value))
                    };

                    const rollback = () => {
                        rekening.value = snapshots.rekening;
                        produk.value = snapshots.produk;
                        bahan.value = snapshots.bahan;
                        bahanHPP.value = snapshots.bahan_hpp;
                        pegawai.value = snapshots.pegawai;
                        supplier.value = snapshots.supplier;
                        pembelian.value = snapshots.pembelian;
                        distribusi.value = snapshots.distribusi;
                        potong.value = snapshots.potong;
                        jahit.value = snapshots.jahit;
                        kasbonList.value = snapshots.kasbon;
                        keuangan.value = snapshots.keuangan;
                        simpanCacheLokal();
                    };

                    try {
                        const tabsToSync = [];

                        if (modalType.value === 'saldo_awal') {

                                rekening.value.unshift(Object.assign({ id: newId }, r));

                            tabsToSync.push({ tab: 'Rekening', data: rekening.value });

                        else if (modalType.value === 'produk') {

                            r.id_produk = r.id_produk || formData.id_produk || (r.id && String(r.id).startsWith('PRD-') ? r.id : generateUniqueIdProduk());
                            r.parent_product_id = r.id_produk;
                            r.sku_induk = r.kode ? String(r.kode).trim().toUpperCase() : '';

                            if (isEditMode.value) {

                                const dup = produk.value.find(p => String(p.id) !== String(r.id) && String(p.kode || '').trim().toUpperCase() === r.kode);

                                        if (existIdx === -1) {

                                                model_tas: r.model_tas || r.nama,
                                                tipe_input: undefined,
                                                variasi: undefined
                                            });

                                            // Update Master Stok

                                                masterStok.value[mIdx].last_updated = new Date().toISOString();

                                        } else {

                                            const newVarId = v.id || ('PRD-' + Date.now() + '-' + String(idx + 1).padStart(2, '0'));
                                            const newStkId = v.id_stok_item || generateUniqueIdStokItem();

                                                id: newVarId,

                                                model_tas: r.model_tas || r.nama,

                                                variasi: undefined
